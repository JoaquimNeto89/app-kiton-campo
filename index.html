}

/** Apontamento do fim: parcial ou final, com assinatura ou justificativa. */
function fluxoApontar(s) {
  topo('Apontar OS ' + s.numero);
  const d = est.dados, chave = 'kc_ap_' + s.n;
  let f = { tipo: '', executado: '', materiais: [], pendencias: '', ausente: false, motivo: '', assinante: '', cargo: '', emails: null, extra: '', incluirAPR: '' };
  try { Object.assign(f, JSON.parse(lerLocal(chave) || '{}')); } catch (e) { /* rascunho inválido */ }
  const fotos = []; let assinatura = null, tracos = 0, p = 0;
  const passos = ['Situação', 'Serviço', 'Fotos', 'Assinatura'];
  const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
  const cab = () => `<div class="passos">${passos.map((_, i) => `<i class="${i < p ? 'feito' : i === p ? 'atual' : ''}"></i>`).join('')}</div><div class="passo-nome">OS ${esc(s.numero)} · ${esc(s.cliente)} · passo ${p + 1} de 4</div><div id="erro"></div>`;
  function ler() {
    if (p === 1) {
      f.executado = val('aExec'); f.pendencias = val('aPend');
      f.materiais = [...document.querySelectorAll('.mat')].map(r => ({ qtd: r.querySelector('[data-q]').value.trim(), desc: r.querySelector('[data-d]').value.trim() })).filter(m => m.desc);
    }
    if (p === 3) {
      f.assinante = val('aAss'); f.cargo = val('aCargo'); f.motivo = val('aMot'); f.extra = val('aExtra');
      f.emails = [...document.querySelectorAll('#aMails input:checked')].map(x => x.value);
    }
    guardar(chave, JSON.stringify(f));
  }
  function validar() {
    if (p === 0 && !f.tipo) throw new Error('Escolha se é parcial ou finalização.');
    if (p === 1 && !f.executado) throw new Error('Descreva o que foi executado neste período.');
  }
  const rodape = txt => {
    barra(`<div class="dentro"><button class="acao voltar" id="ant" type="button" aria-label="Voltar">${ic('voltar')}</button><button class="acao" id="prox" type="button">${txt}</button></div>`);
    if (p > 0) document.getElementById('ant').dataset.passo = '1';
    document.getElementById('ant').onclick = () => { ler(); if (p === 0) telaOS(); else { p--; desenhar(); } };
    document.getElementById('prox').onclick = () => { ler(); try { validar(); } catch (e) { return erroTela(e.message); } if (p < 3) { p++; desenhar(); } else finalizar(); };
  };
  function desenhar() {
    window.scrollTo(0, 0);
    if (p === 0) {
      $app.innerHTML = `${cab()}<h1>Como fica a OS?</h1>
        <button type="button" class="opcao larga ${f.tipo === 'Parcial' ? 'sel' : ''}" data-t="Parcial" style="margin-bottom:10px">${ic('retorno')}<span>Apontamento parcial<small class="suave" style="display:block;font-weight:400">O serviço continua em outro momento ou outro dia</small></span></button>
        <button type="button" class="opcao larga ${f.tipo === 'Final' ? 'sel' : ''}" data-t="Final">${ic('ok')}<span>Finalizar a OS<small class="suave" style="display:block;font-weight:400">Serviço concluído. O cliente recebe o PDF completo</small></span></button>
        <p class="suave" style="margin-top:12px">Início: ${esc(s.inicio)} · Equipe: ${esc(s.equipe.join(', '))}</p>`;
      document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { f.tipo = b.dataset.t; guardar(chave, JSON.stringify(f)); desenhar(); setTimeout(() => { p = 1; desenhar(); }, 150); });
      rodape('Continuar');
    } else if (p === 1) {
      const linhaMat = (m = {}) => `<div class="mat grade" style="grid-template-columns:76px 1fr 44px;margin-bottom:8px"><input class="campo-txt" data-q placeholder="Qtd." value="${esc(m.qtd || '')}"><input class="campo-txt" data-d placeholder="Material" value="${esc(m.desc || '')}"><button type="button" class="acao leve" data-x style="margin:0;min-height:0;padding:0" aria-label="Remover">×</button></div>`;
      $app.innerHTML = `${cab()}<h1>${f.tipo === 'Final' ? 'Finalização' : 'Apontamento parcial'}</h1>
        <label class="rotulo" for="aExec">O que foi executado neste período</label><textarea class="campo-txt" id="aExec" style="min-height:130px">${esc(f.executado)}</textarea>
        <label class="rotulo">Materiais utilizados</label><div id="mats">${(f.materiais.length ? f.materiais : [{}]).map(linhaMat).join('')}</div>
        <button type="button" class="link" id="addMat">+ Adicionar material</button>
        ${f.tipo === 'Final' ? `<label class="rotulo" for="aPend">Pendências e recomendações</label><textarea class="campo-txt" id="aPend">${esc(f.pendencias)}</textarea>` : ''}`;
      const ligarX = () => document.querySelectorAll('[data-x]').forEach(b => b.onclick = () => b.closest('.mat').remove());
      document.getElementById('addMat').onclick = () => { document.getElementById('mats').insertAdjacentHTML('beforeend', linhaMat()); ligarX(); };
      ligarX(); rodape('Continuar');
    } else if (p === 2) {
      $app.innerHTML = `${cab()}<h1>Fotos (opcional)</h1><p class="suave">Até 6 fotos deste período. Elas entram no PDF.</p>
        <div class="fotos" id="fotos"></div>
        ${botoesFoto('aFoto', true)}`;
      const pintar = () => {
        document.getElementById('fotos').innerHTML = fotos.map((x, i) => `<div class="foto"><img src="${x}" alt="Foto ${i + 1}"><button type="button" data-rm="${i}" aria-label="Remover foto">×</button></div>`).join('');
        document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { fotos.splice(+b.dataset.rm, 1); pintar(); });
      };
      ligarFoto('aFoto', e => executar(async () => {
        for (const a of [...e.target.files]) { if (fotos.length >= 6) break; fotos.push(await comprimir(a, 1100, 0.7)); }
        e.target.value = ''; pintar();
      }));
      pintar(); rodape('Continuar');
    } else {
      const cli = d.clientesInfo.find(c => c.nome === s.cliente) || { emails: [] };
      if (!f.emails) f.emails = cli.emails.slice();
      $app.innerHTML = `${cab()}<h1>Assinatura do cliente</h1>
        <div class="segmento" id="aModo"><button type="button" class="${f.ausente ? '' : 'sel'}" data-v="0">Cliente presente</button><button type="button" class="${f.ausente ? 'sel ruim' : ''}" data-v="1">Cliente ausente</button></div>
        <div id="boxAss" class="${f.ausente ? 'oculto' : ''}">
          <label class="rotulo">Assine no quadro abaixo</label>
          <div class="assin"><canvas id="cv"></canvas><button type="button" class="link" id="limpar">Limpar</button></div>
          <label class="rotulo" for="aAss">Nome de quem assinou</label><input class="campo-txt" id="aAss" value="${esc(f.assinante)}" autocomplete="off">
          <label class="rotulo" for="aCargo">Cargo / setor (opcional)</label><input class="campo-txt" id="aCargo" value="${esc(f.cargo)}"></div>
        <div id="boxAus" class="${f.ausente ? '' : 'oculto'}"><label class="rotulo" for="aMot">Por que não há assinatura?</label>
          <textarea class="campo-txt" id="aMot" placeholder="Ex.: fim de expediente, sem responsável no local">${esc(f.motivo)}</textarea>
          <p class="suave" style="margin-top:6px">Fica destacado para a administração e no PDF.</p></div>
        ${f.tipo === 'Final' ? `<label class="rotulo">Enviar a OS para</label><div id="aMails">${cli.emails.map(e => `<label class="linha" style="font-weight:500"><input type="checkbox" value="${esc(e)}" ${f.emails.includes(e) ? 'checked' : ''} style="width:22px;height:22px"> ${esc(e)}</label>`).join('') || '<p class="suave">Este cliente não tem e-mail cadastrado.</p>'}</div>
          <input class="campo-txt" id="aExtra" type="email" inputmode="email" placeholder="Outro e-mail (opcional)" value="${esc(f.extra)}">
          <p class="suave" style="margin-top:8px">A Kiton (contato@) sempre recebe uma cópia.</p>
          <label class="rotulo">Enviar a APR junto no PDF do cliente?</label>
          <div class="segmento" id="aApr"><button type="button" data-v="Sim" class="${f.incluirAPR === 'Sim' ? 'sel' : ''}">Sim, incluir</button><button type="button" data-v="Não" class="${f.incluirAPR === 'Não' ? 'sel' : ''}">Não incluir</button></div>
          <p class="suave" style="margin-top:6px">Decisão do responsável técnico. A APR fica registrada na Kiton nos dois casos. <button type="button" class="link" id="aVerApr">Ver a APR deste serviço</button></p>` : `<p class="suave" style="margin-top:12px">O PDF deste apontamento vai só para a Kiton (contato@). O cliente recebe tudo na finalização.</p>`}
        ${blocoHorario('hFim', 'Que horas terminou?')}`;
      ligarHorario('hFim');
      const montar = () => montarAssinatura(document.getElementById('cv'), (url, n) => { assinatura = url; tracos = n; });
      if (!f.ausente) montar();
      document.getElementById('limpar').onclick = () => { assinatura = null; tracos = 0; montar(); };
      document.querySelectorAll('#aModo button').forEach(b => b.onclick = () => {
        f.ausente = b.dataset.v === '1';
        document.querySelectorAll('#aModo button').forEach(x => x.className = x === b ? 'sel' + (f.ausente ? ' ruim' : '') : '');
        document.getElementById('boxAss').classList.toggle('oculto', f.ausente); document.getElementById('boxAus').classList.toggle('oculto', !f.ausente);
        if (!f.ausente && !assinatura) montar();
      });
      const va = document.getElementById('aVerApr'); if (va) va.onclick = () => verAPR({ ap: s.n });
      document.querySelectorAll('#aApr button').forEach(b => b.onclick = () => { f.incluirAPR = b.dataset.v; document.querySelectorAll('#aApr button').forEach(x => x.classList.toggle('sel', x === b)); });
      rodape(`${ic('ok')} ${f.tipo === 'Final' ? 'Finalizar OS' : 'Salvar parcial'}`);
    }
  }
  function finalizar() {
    executar(async () => {
      if (f.ausente && !f.motivo) throw new Error('Explique por que não há assinatura.');
      if (!f.ausente && (!assinatura || tracos < 1)) throw new Error('Peça para o cliente assinar no quadro.');
      if (!f.ausente && !f.assinante) throw new Error('Informe o nome de quem assinou.');
      if (f.tipo === 'Final' && !f.incluirAPR) throw new Error('Escolha se a APR vai junto no PDF do cliente.');
      const emails = f.tipo === 'Final' ? [...(f.emails || []), f.extra].filter(Boolean) : [];
      if (emails.length > 3) throw new Error('No máximo 3 e-mails do cliente.');
      const horario = lerHorarioApos('hFim', s.inicio, 'do início do apontamento');
      const geo = await localizacao();
      const r = await api('apontarOS', { n: s.n, tipo: f.tipo, executado: f.executado, materiais: f.materiais, pendencias: f.pendencias, fotos,
        assinatura: f.ausente ? '' : assinatura, assinante: f.assinante, cargo: f.cargo, ausente: f.ausente ? f.motivo : '', emails, horario, geo, incluirAPR: f.incluirAPR === 'Sim' });
      guardar(chave, null);
      await recarregarDados();
      telaEAgora(r);
    });
  }
  desenhar();
}

/** Depois do apontamento: outra OS aqui, outro cliente ou encerrar o dia. */
function telaEAgora(r) {
  topo('Ordem de serviço'); barra('');
  const resultado = r.tipo === 'Final'
    ? (r.enviada ? msg('ok', `OS ${r.numero} finalizada e enviada para ${r.emails.length ? r.emails.join(', ') + ' e ' : ''}contato@.`) : msg('erro', `OS ${r.numero} finalizada, mas o e-mail não saiu. A administração pode reenviar.`))
    : msg('ok', `Apontamento parcial da OS ${r.numero} salvo (${dur(r.horas)}).`);
  $app.innerHTML = `<div id="erro">${resultado}</div><h1>E agora?</h1><p class="suave">${esc(r.cliente)}</p>
    <button type="button" class="opcao larga" id="eOutra" style="margin-bottom:10px">${ic('os')}<span>Outra OS neste cliente<small class="suave" style="display:block;font-weight:400">Continua no mesmo check-in</small></span></button>
    <button type="button" class="opcao larga" id="eCliente" style="margin-bottom:10px">${ic('cliente')}<span>Vou para outro cliente<small class="suave" style="display:block;font-weight:400">Registra a saída deste cliente</small></span></button>
    <button type="button" class="opcao larga" id="eFim">${ic('interno')}<span>Encerrar o dia<small class="suave" style="display:block;font-weight:400">Retorno à base ou ida para casa</small></span></button>
    ${r.link ? `<p style="margin-top:16px"><a class="link" href="${esc(r.link)}" target="_blank" rel="noopener">Abrir o PDF deste apontamento</a></p>` : ''}`;
  document.getElementById('eOutra').onclick = () => telaOutraOSCliente(r.cliente);
  document.getElementById('eCliente').onclick = () => executar(async () => {
    const geo = await localizacao();
    const x = await api('encerrarAtendimento', { destino: 'Outro cliente', geo });
    await recarregarDados();
    telaOS(x.semCheckin ? '' : `Saída de ${x.cliente} registrada às ${hora(x.quando)}. Escolha a próxima OS.`);
  });
  document.getElementById('eFim').onclick = () => {
    $app.querySelector('h1').textContent = 'Para onde vai?';
    ['eOutra', 'eCliente', 'eFim'].forEach(id => document.getElementById(id).remove());
    $app.insertAdjacentHTML('beforeend', `<button type="button" class="opcao larga" data-d="Retorno à base" style="margin-bottom:10px">${ic('interno')}<span>Retorno à base</span></button>
      <button type="button" class="opcao larga" data-d="Ida para casa">${ic('carro')}<span>Vou para casa</span></button>`);
    document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => executar(async () => {
      const geo = await localizacao();
      const x = await api('encerrarAtendimento', { destino: b.dataset.d, geo });
      await recarregarDados();
      const ab = est.dados.abertas || [];
      const lembrete = ab.length ? (b.dataset.d === 'Retorno à base' ? `Ao chegar na base, registre o retorno da saída nº ${ab[0].n} (veículo e ferramentas).` : `A saída nº ${ab[0].n} continua aberta. Registre o retorno quando voltar à base.`) : '';
      telaFeito(x.semCheckin ? 'Dia encerrado' : `Saída de ${x.cliente} registrada`, `${b.dataset.d}${x.quando ? ' · ' + hora(x.quando) : ''}`, x.semLocalizacao, x.tardio, lembrete);
    }));
  };
}

async function telaOutraOSCliente(cliente) {
  topo('Ordem de serviço'); voltarInicio();
  $app.innerHTML = `<h1>Outra OS em ${esc(cliente)}</h1><div id="erro"></div><div id="lista"><p class="suave">Carregando…</p></div>`;
  document.getElementById('ini').onclick = () => telaEAgora({ cliente, numero: '', tipo: '' });
  await executar(async () => {
    const r = await api('minhasOS'); est.minhasOS = r;
    const daqui = r.abertas.filter(o => o.cliente === cliente);
    document.getElementById('lista').innerHTML = (daqui.length ? daqui.map(o => cartaoOS(o)).join('') : msg('info', 'Nenhuma outra OS sua neste cliente.')) +
      `<button class="acao" id="nova" type="button">${ic('os')} Abrir nova OS neste cliente</button>`;
    document.querySelectorAll('[data-os]').forEach(b => b.onclick = () => telaIniciarOS(daqui.find(o => o.numero === b.dataset.os)));
    document.getElementById('nova').onclick = () => telaNovaOSCampo({ cliente });
  });
}

// ---------- administração: painel de OS ----------
/** Filtros do painel de OS: ficam guardados enquanto o app está aberto. */
const filtroOS = { periodo: 'mes', mes: '', ano: '', de: '', ate: '', cliente: '', colaborador: '', tipo: '', visao: 'lista', status: '' };
function intervaloOS(f) {
  if (f.periodo === 'mes') { const [a, m] = f.mes.split('-').map(Number); return { de: f.mes + '-01', ate: `${f.mes}-${doisDig(new Date(a, m, 0).getDate())}` }; }
  if (f.periodo === 'ano') return { de: f.ano + '-01-01', ate: f.ano + '-12-31' };
  if (f.periodo === 'periodo') return { de: f.de, ate: f.ate };
  return { de: '', ate: '' };
}
async function adminOS(box) {
  const h = new Date(), d = est.dados, f = filtroOS;
  if (!f.mes) f.mes = `${h.getFullYear()}-${doisDig(h.getMonth() + 1)}`;
  if (!f.ano) f.ano = String(h.getFullYear());
  const anos = []; for (let a = h.getFullYear(); a >= 2026; a--) anos.push(String(a));
  const sel = (id, rot, lista, v) => `<label class="rotulo" for="${id}">${rot}</label><select class="campo-txt" id="${id}"><option value="">Todos</option>${lista.map(x => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>`;
  box.innerHTML = `<h1>Ordens de serviço</h1><button class="acao" id="progAdm" type="button" style="margin-top:0">${ic('calib')} Programar OS</button>
    <div class="cartao nao-suja" style="margin-top:12px"><div class="t">Filtros</div>
      <div class="segmento" id="fPer" data-nf>${[['mes', 'Mês'], ['ano', 'Ano'], ['periodo', 'Período'], ['geral', 'Geral']].map(([k, t]) => `<button type="button" data-v="${k}" class="${f.periodo === k ? 'sel' : ''}">${t}</button>`).join('')}</div>
      <div id="fPerBox" style="margin-top:10px">
        ${f.periodo === 'mes' ? `<input class="campo-txt" id="fMes" type="month" value="${f.mes}">` : ''}
        ${f.periodo === 'ano' ? `<select class="campo-txt" id="fAno">${anos.map(a => `<option ${a === f.ano ? 'selected' : ''}>${a}</option>`).join('')}</select>` : ''}
        ${f.periodo === 'periodo' ? `<label class="rotulo" for="fDe" style="margin-top:0">De</label><input class="campo-txt" id="fDe" type="date" value="${f.de}" style="width:100%;min-width:0">
          <label class="rotulo" for="fAte">Até</label><input class="campo-txt" id="fAte" type="date" value="${f.ate}" style="width:100%;min-width:0">` : ''}
        ${f.periodo === 'geral' ? '<p class="suave" style="margin:0">Todas as OS desde o início.</p>' : ''}</div>
      ${f.mais || f.cliente || f.colaborador || f.tipo ? `${sel('fCli', 'Cliente', d.clientesInfo.map(c => c.nome), f.cliente)}
      ${sel('fCol', 'Colaborador', d.equipeCampo || d.colaboradores, f.colaborador)}
      ${sel('fTipo', 'Tipo de serviço', d.tiposOS, f.tipo)}
      ${f.cliente || f.colaborador || f.tipo ? '<button type="button" class="link" id="fLimpar">Limpar filtros</button>' : ''}`
      : '<button type="button" class="link" id="fMais">+ Filtrar por cliente, colaborador ou tipo</button>'}
    </div>
    <div class="segmento nao-suja" id="fVis" data-nf style="margin-top:12px"><button type="button" data-v="lista" class="${f.visao === 'lista' ? 'sel' : ''}">Lista de OS</button><button type="button" data-v="resumo" class="${f.visao === 'resumo' ? 'sel' : ''}">Resumo</button></div>
    <div id="painel" style="margin-top:12px"></div>`;
  document.getElementById('progAdm').onclick = () => telaProgramarOS();
  const refazer = () => adminOS(box);
  document.querySelectorAll('#fPer button').forEach(b => b.onclick = () => { f.periodo = b.dataset.v; refazer(); });
  document.querySelectorAll('#fVis button').forEach(b => b.onclick = () => { f.visao = b.dataset.v; refazer(); });
  const liga = (id, k) => { const e = document.getElementById(id); if (e) e.onchange = () => { f[k] = e.value; refazer(); }; };
  liga('fMes', 'mes'); liga('fAno', 'ano'); liga('fDe', 'de'); liga('fAte', 'ate'); liga('fCli', 'cliente'); liga('fCol', 'colaborador'); liga('fTipo', 'tipo');
  const lp = document.getElementById('fLimpar'); if (lp) lp.onclick = () => { f.cliente = f.colaborador = f.tipo = ''; f.mais = false; refazer(); };
  const fm = document.getElementById('fMais'); if (fm) fm.onclick = () => { f.mais = true; refazer(); };
  await executar(async () => {
    const r = await api('painelOS', Object.assign(intervaloOS(f), { cliente: f.cliente, colaborador: f.colaborador, tipo: f.tipo }));
    const L = r.lista;
    const grupos = [
      ['Programada', 'Programadas', o => o.status === 'Programada' && !o.atrasada, ''],
      ['Atrasada', 'Atrasadas p/ iniciar', o => o.atrasada, 'vermelho'],
      ['Andamento', 'Em andamento', o => o.status === 'Em andamento' && !o.parada, 'amarelo'],
      ['Parada', 'Paradas', o => o.parada, 'laranja'],
      ['Finalizada', 'Finalizadas', o => o.status === 'Finalizada', 'verde'],
      ['Cancelada', 'Canceladas', o => o.status === 'Cancelada', '']

    const cnt = (lista, k, v) => lista.filter(o => o[k] === v).length;

    let html;
    if (f.visao === 'resumo') {
      html = quadros + `<div class="cartao" style="margin-top:12px"><div class="t">Execução das finalizadas (${fin.length})</div><table><tbody>
        <tr><td>Iniciadas antes do programado</td><td class="n">${cnt(fin, 'inicioVsPrevisto', 'Antes do programado')}</td></tr>
        <tr><td>Iniciadas no dia programado</td><td class="n">${cnt(fin, 'inicioVsPrevisto', 'No dia programado')}</td></tr>
        <tr><td>Iniciadas depois do programado</td><td class="n">${cnt(fin, 'inicioVsPrevisto', 'Depois do programado')}</td></tr>
        <tr><td>Concluídas dentro do previsto</td><td class="n">${cnt(fin, 'prazo', 'Dentro do previsto')}</td></tr>
        <tr><td>Concluídas após o previsto</td><td class="n">${cnt(fin, 'prazo', 'Após o previsto')}</td></tr>
        <tr><td>Horas trabalhadas</td><td class="n">${dur(fin.reduce((s, o) => s + o.horas, 0))}</td></tr>
        <tr><td>Reabertas (retrabalho)</td><td class="n">${L.filter(o => o.reaberta).length}</td></tr>
        <tr><td>Corrigidas após finalizar</td><td class="n">${L.filter(o => o.revisao && !o.reaberta).length}</td></tr>

        ${r.porTecnico.map(t => `<tr><td>${esc(t.nome)}</td><td class="n">${t.os}</td><td class="n">${dur(t.horas)}</td><td class="n">${t.finalizadas}</td><td class="n">${t.noPrazo}${t.aposPrazo ? ` / <span style="color:var(--vermelho-esc)">${t.aposPrazo} após</span>` : ''}</td><td class="n">${t.reabertas || 0}</td><td class="n">${t.ausente}</td></tr>`).join('')}
      </tbody></table></div></div>` : ''}
      ${r.porCliente.length ? `<div class="cartao"><div class="t">Por cliente</div><table><thead><tr><th>Cliente</th><th class="n">OS</th><th class="n">Final.</th><th class="n">Horas</th></tr></thead><tbody>
        ${r.porCliente.map(c => `<tr><td>${esc(c.cliente)}</td><td class="n">${c.os}</td><td class="n">${c.finalizadas}</td><td class="n">${dur(c.horas)}</td></tr>`).join('')}
      </tbody></table></div>` : ''}
      ${L.length ? '' : msg('info', 'Nenhuma OS com esses filtros.')}`;
    } else {

/** Correção de OS finalizada: texto, materiais, fotos e pendências. Gera revisão do PDF. */
function telaCorrigirOS(o, aps) {
  topo('Corrigir OS ' + o.numero);
  const fechados = aps.filter(a => a.fim);
  const fotos = {}; // n -> [{id, src}] quando o administrador abre as fotos

  $app.innerHTML = `<h1>Corrigir OS ${esc(o.numero)}</h1><div id="erro"></div>
    ${msg('info', `Gera a revisão ${String((o.revisao || 0) + 1).padStart(2, '0')} do PDF. O PDF anterior fica guardado no Drive. Assinatura, horários e localização não podem ser alterados.`)}
    ${fechados.map(a => `<div class="cartao" data-ap="${esc(a.n)}"><div class="t">${esc(a.inicio.slice(0, 10))} · ${esc(hora(a.inicio))} às ${esc(hora(a.fim))}${a.tipo === 'Final' ? ' · Finalização' : ' · Parcial'}</div>

      <div data-fbox><button type="button" class="link" data-vf="${esc(a.n)}">Ver e alterar as fotos (${a.fotos})</button></div></div>`).join('')}
    <label class="rotulo" for="cPend">Pendências e recomendações</label><textarea class="campo-txt" id="cPend">${esc(o.pendencias)}</textarea>
    <label class="rotulo" for="cMot">Motivo da correção</label><textarea class="campo-txt" id="cMot" placeholder="Ex.: material utilizado não informado no apontamento"></textarea>
    <label class="rotulo">Incluir a APR no PDF do cliente?</label>
    <div class="segmento" id="cApr"><button type="button" data-v="Sim" class="${o.aprNoPdf === 'Sim' ? 'sel' : ''}">Sim, incluir</button><button type="button" data-v="Não" class="${o.aprNoPdf !== 'Sim' ? 'sel' : ''}">Não incluir</button></div>
    <p class="suave" style="margin-top:6px">${fechados.filter(a => a.apr).map(a => `<button type="button" class="link" data-apr="${esc(a.apr)}">Ver APR nº ${esc(a.apr)}</button>`).join(' · ') || 'Nenhuma APR registrada nesta OS.'}</p>
    <label class="rotulo">Reenviar a revisão ao cliente?</label>
    <div class="segmento" id="cReenv"><button type="button" data-v="1">Sim, reenviar</button><button type="button" data-v="0">Não, só arquivar</button></div>
    <p class="suave" style="margin-top:6px">Se reenviar, o e-mail informa o motivo e que esta versão substitui a anterior.</p>`;
  const pintar = n => {
    const box = document.querySelector(`[data-ap="${n}"] [data-fbox]`);
    box.innerHTML = `<label class="rotulo">Fotos (até 6)</label><div class="fotos">${fotos[n].map((f, i) => `<div class="foto"><img src="${f.src}" alt="Foto ${i + 1}"><button type="button" data-rmf="${i}" aria-label="Remover foto">×</button></div>`).join('')}</div>${botoesFoto('cF' + n, true)}`;
    box.querySelectorAll('[data-rmf]').forEach(b => b.onclick = () => { fotos[n].splice(+b.dataset.rmf, 1); pintar(n); });
    ligarFoto('cF' + n, e => executar(async () => {
      for (const a of [...e.target.files]) { if (fotos[n].length >= 6) break; const src = await comprimir(a, 1100, 0.7); fotos[n].push({ src, novo: true }); }
      pintar(n);
    }));
  };
  document.querySelectorAll('[data-vf]').forEach(b => b.onclick = () => executar(async () => {
    const n = b.dataset.vf; const r = await api('fotosAp', { n }); fotos[n] = r.fotos.filter(f => f.src); pintar(n);
  }));
  document.querySelectorAll('#cApr button').forEach(b => b.onclick = () => { incluirAPR = b.dataset.v === 'Sim'; document.querySelectorAll('#cApr button').forEach(x => x.classList.toggle('sel', x === b)); });
  document.querySelectorAll('[data-apr]').forEach(b => b.onclick = () => verAPR({ n: b.dataset.apr }));
  document.querySelectorAll('#cReenv button').forEach(b => b.onclick = () => { reenviar = b.dataset.v; document.querySelectorAll('#cReenv button').forEach(x => x.classList.toggle('sel', x === b)); });
  barra(`<div class="dentro"><button class="acao voltar" id="ant" type="button" aria-label="Voltar">${ic('voltar')}</button><button class="acao" id="ok" type="button">${ic('ok')} Salvar revisão</button></div>`);
  document.getElementById('ant').onclick = () => telaOSDetalhe(o.numero, true);
  document.getElementById('ok').onclick = () => executar(async () => {
    const motivo = document.getElementById('cMot').value.trim();
    if (!motivo) throw new Error('Informe o motivo da correção.');
    if (!reenviar) throw new Error('Escolha se a revisão vai para o cliente.');
    const apontamentos = [...document.querySelectorAll('[data-ap]')].map(c => {
      const n = c.dataset.ap, x = { n, executado: c.querySelector('[data-ex]').value.trim(), materiais: c.querySelector('[data-mat]').value.trim() };
      if (fotos[n]) x.fotos = fotos[n].map(f => f.novo ? f.src : f.id);
      return x;
    });
    if (apontamentos.some(a => !a.executado)) throw new Error('O serviço executado não pode ficar vazio.');
    const r = await api('corrigirOS', { numero: o.numero, motivo, apontamentos, pendencias: document.getElementById('cPend').value.trim(), reenviar: reenviar === '1', incluirAPR });
    await telaOSDetalhe(o.numero, true);
    document.getElementById('erro').innerHTML = msg(/^Erro/.test(r.envio) ? 'erro' : 'ok', `Revisão ${String(r.revisao).padStart(2, '0')} gerada.${r.envio ? ' ' + r.envio + '.' : ' Arquivada sem reenvio.'}`);
  });
}

/** Quadro de assinatura com dedo ou caneta. Devolve PNG com fundo branco. */
function montarAssinatura(cv, aoMudar) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  const g = cv.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
  g.lineWidth = 2.4 * dpr; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#0B2A6F';
  let desenhando = false, n = 0, ult = null;
  const pos = e => { const b = cv.getBoundingClientRect(); return { x: (e.clientX - b.left) * dpr, y: (e.clientY - b.top) * dpr }; };
  cv.onpointerdown = e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); desenhando = true; ult = pos(e); g.beginPath(); g.moveTo(ult.x, ult.y); };
  cv.onpointermove = e => { if (!desenhando) return; const q = pos(e); g.lineTo(q.x, q.y); g.stroke(); ult = q; };
  const fim = () => { if (!desenhando) return; desenhando = false; n++; aoMudar(cv.toDataURL('image/png'), n); };
  cv.onpointerup = fim; cv.onpointercancel = fim; cv.onpointerleave = fim;
}

        <div class="cal-qd verde"><b style="font-size:18px">${reais(soma('Aprovada'))}</b><span>Aprovado, a receber</span></div>
        <div class="cal-qd"><b style="font-size:18px">${reais(soma('Reembolsada'))}</b><span>Já reembolsado</span></div></div>
      <h2>Lançamentos</h2>` + (r.lista.length ? r.lista.map(x => `<div class="cartao"><div class="t">${esc(x.categoria)} · ${reais(x.valor)}</div>
        <p class="suave" style="margin:2px 0 6px">${esc(x.data)}${x.cliente ? ' · ' + esc(x.cliente) : ''} · ${esc(/reembolso/i.test(x.pagamento) ? 'reembolso' : 'pago pela Kiton')}${x.descricao ? '<br>' + esc(x.descricao) : ''}</p>
        <span class="selo-txt ${cor(x.situacao)}">${esc(x.situacao === 'Aguardando conferência' ? 'Aguardando conferência' : x.situacao)}</span>${x.motivo ? `<p class="suave" style="margin:6px 0 0">Motivo: ${esc(x.motivo)}</p>` : ''}</div>`).join('') : msg('info', 'Nenhuma despesa lançada.'));
  });
}

function telaNovaDespesa() {
  const d = est.dados;
  const f = { categoria: '', pagamento: d.pagamentosDespesa[0] || '', foto: null };
  $app.innerHTML = `<h1>Lançar despesa</h1><div id="erro"></div>
    <label class="rotulo">Categoria</label>${chips('dCat', d.categoriasDespesa, '')}
    <label class="rotulo" for="dValor">Valor (R$)</label><input class="campo-txt" id="dValor" inputmode="decimal" placeholder="0,00">
    <label class="rotulo" for="dData">Data</label><input class="campo-txt" id="dData" type="date" max="${hojeISO()}" value="${hojeISO()}">
    <label class="rotulo">Quem pagou?</label>${chips('dPag', d.pagamentosDespesa, f.pagamento)}
    <label class="rotulo" for="dCli">Cliente / obra (se for de um atendimento)</label><select class="campo-txt" id="dCli"><option value="">Nenhum</option>${d.clientesInfo.map(c => `<option ${d.checkin && d.checkin.cliente === c.nome ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}</select>
    <label class="rotulo" for="dDesc">Descrição</label><input class="campo-txt" id="dDesc" placeholder="Ex.: almoço da equipe, pedágio de Medianeira">
    <label class="rotulo">Comprovante</label>
    <div id="dPrev"></div>
    ${botoesFoto('dFoto')}
    <button type="button" class="link" id="semFoto" style="margin-top:10px">Não tenho comprovante</button>
    <div id="boxSem" class="oculto"><input class="campo-txt" id="dSem" placeholder="Por que não tem comprovante?" style="margin-top:8px"></div>
    <p class="regra">${ic('recibo')}<span>Só são reembolsadas despesas lançadas aqui e aprovadas pela administração.</span></p>`;
  barra(`<div class="dentro"><button class="acao voltar" id="ant" type="button" aria-label="Voltar">${ic('voltar')}</button><button class="acao" id="ok" type="button">Salvar despesa</button></div>`);
  ligarChips('dCat', v => f.categoria = v);
  ligarChips('dPag', v => f.pagamento = v);
  ligarFoto('dFoto', e => executar(async () => {
    const a = e.target.files[0]; if (!a) return;
    f.foto = await comprimir(a, 1600, 0.75);
    document.getElementById('dPrev').innerHTML = `<div class="fotos"><div class="foto"><img src="${f.foto}" alt="Comprovante"></div></div>`;
  }));
  document.getElementById('semFoto').onclick = () => document.getElementById('boxSem').classList.toggle('oculto');
  document.getElementById('ant').onclick = () => telaDespesas();
  document.getElementById('ok').onclick = () => executar(async () => {
    if (!f.categoria) throw new Error('Escolha a categoria.');
    const valor = numBR(document.getElementById('dValor').value);
    if (!valor) throw new Error('Informe o valor.');
    const semFotoMotivo = document.getElementById('dSem').value.trim();
    if (!f.foto && !semFotoMotivo) throw new Error('Fotografe o comprovante ou diga por que não tem.');
    const r = await api('salvarDespesa', { categoria: f.categoria, valor, data: document.getElementById('dData').value, pagamento: f.pagamento,
      cliente: document.getElementById('dCli').value, descricao: document.getElementById('dDesc').value, foto: f.foto, semFotoMotivo });
    telaFeito(`Despesa nº ${r.n} lançada`, `${f.categoria} · ${reais(valor)} · aguardando conferência`, false, false);
  });
}

// ---------- cadastro de item pelo app ----------
async function telaNovoItem() {
  topo('Cadastrar item');
  barra(`<div class="dentro"><button class="acao voltar" id="ant" type="button" aria-label="Voltar">${ic('voltar')}</button><button class="acao" id="ok" type="button">Cadastrar</button></div>`);
  $app.innerHTML = `<h1>Cadastrar item</h1><div id="erro"></div><p class="suave">Carregando…</p>`;
  document.getElementById('ant').onclick = () => telaCadastros();
  let info;
  await executar(async () => { info = await api('cadastroInfo'); });
  if (!info) return;
  const f = { grupo: '', tipo: '', uso: 'Coletivo', estado: 'N', periodicidade: '' };
  $app.innerHTML = `<h1>Cadastrar item</h1><div id="erro"></div>
    <label class="rotulo" for="nGrupo">Grupo</label>
    <select class="campo-txt" id="nGrupo"><option value="">Escolha um grupo existente…</option>${info.grupos.map(g => `<option value="${esc(g.grupo)}">${esc(g.grupo)} (${esc(g.prefixos.join(', '))}) · ${g.qtd}</option>`).join('')}<option value="__novo">+ Grupo novo</option></select>
    <input class="campo-txt oculto" id="nGrupoNovo" placeholder="Nome do grupo novo (ex.: Escada)" style="margin-top:8px">
    <label class="rotulo">Início do código</label>
    <div class="grade" style="grid-template-columns:1fr 1fr"><input class="campo-txt" id="nFam" maxlength="3" placeholder="FAM" style="text-transform:uppercase;text-align:center;letter-spacing:3px">
      <input class="campo-txt" id="nTip" maxlength="3" placeholder="TIP" style="text-transform:uppercase;text-align:center;letter-spacing:3px"></div>
    <p class="suave" id="nProx" style="margin-top:6px">Ex.: ESC-FIB para escada de fibra.</p>
    <label class="rotulo" for="nDesc">Descrição</label><input class="campo-txt" id="nDesc">
    <label class="rotulo">Tipo</label>${chips('nTipo', info.tipos, '')}
    <div class="grade" style="margin-top:0"><div><label class="rotulo" for="nQtd">Quantidade</label><input class="campo-txt" id="nQtd" type="number" min="1" max="20" value="1"></div>
      <div><label class="rotulo" for="nIdent">Nº pintado</label><input class="campo-txt" id="nIdent" inputmode="numeric"></div></div>
    <p class="suave" style="margin-top:6px">Com quantidade maior que 1, cada peça ganha um código e o nº pintado segue a sequência a partir do informado.</p>
    <label class="rotulo">Uso</label>${chips('nUso', info.usos, 'Coletivo')}
    <div id="boxResp" class="oculto"><label class="rotulo" for="nResp">Responsável</label><select class="campo-txt" id="nResp"><option value="">Escolha…</option>${info.colaboradores.map(c => `<option>${esc(c)}</option>`).join('')}</select></div>
    <label class="rotulo" for="nMarca">Marca / modelo</label><input class="campo-txt" id="nMarca">
    <label class="rotulo" for="nSerie">Nº de série</label><input class="campo-txt" id="nSerie">
    <label class="rotulo">Estado</label>${chips('nEst', info.estados, 'N')}<p class="suave" style="margin-top:6px">${esc(info.legendaEstado.join(' · '))}</p>
    <label class="rotulo" for="nValor">Valor de reposição (R$)</label><input class="campo-txt" id="nValor" inputmode="decimal" placeholder="0,00">
    <label class="rotulo" for="nLocal">Local de guarda</label><input class="campo-txt" id="nLocal" list="locais"><datalist id="locais">${info.locais.map(x => `<option value="${esc(x)}">`).join('')}</datalist>
    ${info.kits.length ? `<label class="rotulo" for="nKit">Faz parte de um kit?</label><select class="campo-txt" id="nKit"><option value="">Não</option>${info.kits.map(k => `<option value="${esc(k.pat)}">${esc(k.pat)} · ${esc(k.desc)}</option>`).join('')}</select>` : ''}
    <div id="boxPer" class="oculto"><label class="rotulo">Periodicidade da calibração</label>${chips('nPer', info.periodicidades, '')}</div>
    <label class="rotulo" for="nObs">Observação (opcional)</label><textarea class="campo-txt" id="nObs"></textarea>`;
  const prox = () => {
    const pf = (document.getElementById('nFam').value + '-' + document.getElementById('nTip').value).toUpperCase();
    const el = document.getElementById('nProx');
    if (/^[A-Z]{3}-[A-Z]{3}$/.test(pf)) {
      const n = (info.ultimos[pf] || 0) + 1, q = Math.max(1, Number(document.getElementById('nQtd').value) || 1);
      el.innerHTML = `Próximo código: <b>${pf}-${String(n).padStart(3, '0')}</b>${q > 1 ? ` até <b>${pf}-${String(n + q - 1).padStart(3, '0')}</b>` : ''}${info.ultimos[pf] ? '' : ' (código novo)'}`;
    } else el.textContent = 'Use 3 letras para a família e 3 para o tipo. Ex.: ESC-FIB.';
  };
  const marcarTipo = t => { f.tipo = t; document.querySelectorAll('#nTipo .pessoa').forEach(b => b.classList.toggle('sel', b.dataset.v === t)); document.getElementById('boxPer').classList.toggle('oculto', t !== 'Instrumento'); };
  document.getElementById('nGrupo').onchange = e => {
    const v = e.target.value;
    document.getElementById('nGrupoNovo').classList.toggle('oculto', v !== '__novo');
    const g = info.grupos.find(x => x.grupo === v);
    if (g) {
      f.grupo = g.grupo; const [a, b] = (g.prefixos[0] || '-').split('-');
      document.getElementById('nFam').value = a || ''; document.getElementById('nTip').value = b || '';
      if (!document.getElementById('nDesc').value) document.getElementById('nDesc').value = g.desc;
      if (g.tipo) marcarTipo(g.tipo);
    } else f.grupo = '';
    prox();
  };
  ['nFam', 'nTip', 'nQtd'].forEach(id => document.getElementById(id).oninput = prox);
  ligarChips('nTipo', marcarTipo);
  ligarChips('nUso', v => { f.uso = v; document.getElementById('boxResp').classList.toggle('oculto', v !== 'Individual'); });
  ligarChips('nEst', v => f.estado = v);
  ligarChips('nPer', v => f.periodicidade = v);
  document.getElementById('ok').onclick = () => executar(async () => {
    const grupo = document.getElementById('nGrupo').value === '__novo' ? document.getElementById('nGrupoNovo').value.trim() : f.grupo;
    if (!grupo) throw new Error('Escolha o grupo ou crie um novo.');
    if (!f.tipo) throw new Error('Escolha o tipo.');
    const kit = document.getElementById('nKit');
    const r = await api('novoItem', {
      grupo, tipo: f.tipo, prefixo: (document.getElementById('nFam').value + '-' + document.getElementById('nTip').value).toUpperCase(),
      descricao: document.getElementById('nDesc').value, quantidade: document.getElementById('nQtd').value, ident: document.getElementById('nIdent').value,
      uso: f.uso, responsavel: document.getElementById('nResp').value, marca: document.getElementById('nMarca').value, serie: document.getElementById('nSerie').value,
      estado: f.estado, valor: numBR(document.getElementById('nValor').value), local: document.getElementById('nLocal').value,
      kit: kit ? kit.value : '', periodicidade: f.tipo === 'Instrumento' ? f.periodicidade : '', obs: document.getElementById('nObs').value
    });
    barra(`<div class="dentro"><button class="acao leve" id="fim" type="button">Cadastros</button><button class="acao" id="outro" type="button">Cadastrar outro</button></div>`);
    $app.innerHTML = `<div class="feito-tela"><div class="selo">${ic('ok')}</div><h1>${r.criados.length === 1 ? 'Item cadastrado' : r.criados.length + ' itens cadastrados'}</h1>
      <p class="suave">${r.criados.map(esc).join(', ')}</p>${msg('info', 'Escreva o código na etiqueta e cole na peça.')}</div>`;
    document.getElementById('fim').onclick = telaCadastros;
    document.getElementById('outro').onclick = telaNovoItem;
  });
}

// ---------- administração: despesas e presença ----------
async function adminDespesas(box) {
  await executar(async () => {
    const r = await api('despesasPendentes');
    box.innerHTML = `<h1>Despesas para conferir</h1>` + (r.lista.length ? r.lista.map(x => `<div class="cartao" data-n="${esc(x.n)}">
      <div class="t">${esc(x.colaborador)} · ${reais(x.valor)}</div>
      <p class="suave" style="margin:2px 0 6px">${esc(x.data)} · ${esc(x.categoria)}${x.cliente ? ' · ' + esc(x.cliente) : ''}<br>${esc(/reembolso/i.test(x.pagamento) ? 'Reembolso ao colaborador' : 'Pago pela Kiton')}${x.saida ? ' · saída nº ' + esc(x.saida) : ''}${x.descricao ? '<br>' + esc(x.descricao) : ''}</p>
      ${/^http/.test(x.comprovante) ? `<a class="link" href="${esc(x.comprovante)}" target="_blank" rel="noopener">Ver comprovante</a>` : '<span class="selo-txt amarelo">Sem comprovante</span>'}
      <div class="segmento" style="margin-top:10px"><button type="button" data-v="Aprovada">Aprovar</button><button type="button" data-v="Recusada">Recusar</button></div></div>`).join('') : msg('info', 'Nenhuma despesa aguardando conferência.'));
    box.querySelectorAll('[data-n]').forEach(c => c.querySelectorAll('[data-v]').forEach(b => b.onclick = () => executar(async () => {
      let motivo = '';
      if (b.dataset.v === 'Recusada') { motivo = prompt('Motivo da recusa (o colaborador vai ver):') || ''; if (!motivo.trim()) return; }
      await api('conferirDespesa', { n: c.dataset.n, resultado: b.dataset.v, motivo }); adminDespesas(box);
    })));
  });
}

async function adminClientes(box) {
  await executar(async () => {
    const r = await api('clientesNovos');
    if (est.dados.pendencias) est.dados.pendencias.clientes = r.novos.length;
    const usoTxt = u => [u['Check-ins'] ? u['Check-ins'] + ' check-in(s)' : '', u['Ordens de serviço'] ? u['Ordens de serviço'] + ' OS' : '', u['Despesas'] ? u['Despesas'] + ' despesa(s)' : '', u['Saídas'] ? u['Saídas'] + ' saída(s)' : ''].filter(Boolean).join(', ') || 'nenhum lançamento';
    box.innerHTML = `<h1>Novos clientes cadastrados</h1><p class="suave">Cadastrados pelos colaboradores em campo. Aceite (corrigindo o que precisar) ou junte com um cliente que já existe.</p>` +
      (r.novos.length ? r.novos.map((c, i) => {
        const par = parecidos(c.nome, r.outros);
        return `<div class="cartao" data-i="${i}"><div class="t">${esc(c.nome)}</div>
        <p class="suave" style="margin:2px 0 6px">${esc(c.cidade)} · ${esc(c.por)}<br>Usado em: ${esc(usoTxt(c.usos))}</p>
        ${c.lat ? `<a class="link" href="https://maps.google.com/?q=${esc(c.lat)},${esc(c.lng)}" target="_blank" rel="noopener">Ver no mapa</a>` : '<span class="selo-txt amarelo">Sem localização</span>'}
        ${par.length ? `<p style="margin:8px 0 0"><span class="selo-txt laranja">Parecido com: ${esc(par.map(x => x.nome).join(', '))}</span></p>` : ''}
        <div class="segmento" style="margin-top:10px"><button type="button" data-a="aceitar">Aceitar / corrigir</button><button type="button" data-a="juntar">É o mesmo que…</button></div>
        <div class="oculto" data-f="aceitar">
          <label class="rotulo">Nome</label><input class="campo-txt" data-k="novoNome" value="${esc(c.nome)}">
          <label class="rotulo">Cidade</label><input class="campo-txt" data-k="cidade" value="${esc(c.cidade)}">
          <label class="rotulo">Endereço</label><input class="campo-txt" data-k="endereco" value="${esc(c.endereco)}">
          <label class="rotulo">E-mails para a OS (até 3)</label>
          ${[0, 1, 2].map(j => `<input class="campo-txt" data-e="${j}" type="email" value="${esc(c.emails[j] || '')}" style="margin-bottom:6px">`).join('')}
          <label class="rotulo">Raio do check-in (m)</label><input class="campo-txt" data-k="raio" inputmode="numeric" value="${esc(c.raio)}">
          <button type="button" class="acao" data-ok="aceitar">Salvar e aceitar</button></div>
        <div class="oculto" data-f="juntar">
          <label class="rotulo">Cliente certo</label><select class="campo-txt" data-k="destino"><option value="">Escolha…</option>
            ${par.map(x => `<option value="${esc(x.nome)}">${esc(x.nome)} (parecido)</option>`).join('')}${r.outros.filter(x => !par.includes(x)).map(x => `<option value="${esc(x.nome)}">${esc(x.nome)}</option>`).join('')}</select>
          <p class="suave" style="margin-top:6px">Os lançamentos passam para o cliente escolhido e este cadastro é apagado.</p>
          <button type="button" class="acao" data-ok="juntar">Juntar</button></div></div>`;
      }).join('') : msg('info', 'Nenhum cliente novo aguardando aceite.'));
    box.querySelectorAll('[data-i]').forEach(card => {
      const c = r.novos[+card.dataset.i];
      card.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
        card.querySelectorAll('[data-a]').forEach(x => x.className = x === b ? 'sel' : '');
        card.querySelectorAll('[data-f]').forEach(f => f.classList.toggle('oculto', f.dataset.f !== b.dataset.a));
      });
      const v = k => card.querySelector(`[data-k="${k}"]`).value.trim();
      card.querySelector('[data-ok="aceitar"]').onclick = () => executar(async () => {
        const x = await api('aceitarCliente', { nome: c.nome, novoNome: v('novoNome'), cidade: v('cidade'), endereco: v('endereco'), raio: v('raio'),
          emails: [...card.querySelectorAll('[data-e]')].map(e => e.value.trim()) });
        await adminClientes(box);
        document.getElementById('erro').innerHTML = msg('ok', `${x.nome} aceito.${x.alterados ? ` ${x.alterados} lançamento(s) passaram a usar o nome novo.` : ''}`);
      });
      card.querySelector('[data-ok="juntar"]').onclick = () => executar(async () => {
        const destino = v('destino');
        if (!destino) throw new Error('Escolha o cliente certo.');
        if (!confirm(`Juntar "${c.nome}" com "${destino}"? Os lançamentos passam para ${destino} e o cadastro "${c.nome}" é apagado.`)) return;
        const x = await api('juntarCliente', { nome: c.nome, destino });
        await adminClientes(box);
        document.getElementById('erro').innerHTML = msg('ok', `Juntado com ${x.destino}: ${x.alterados} lançamento(s) atualizados.`);
      });
    });
  });
}

async function adminPresenca(box) {
  const h = new Date(), mes = `${h.getFullYear()}-${String(h.getMonth() + 1).padStart(2, '0')}`;
  box.innerHTML = `<h1>Presença em obra</h1><input class="campo-txt nao-suja" id="mesP" type="month" value="${mes}"><div id="pres" style="margin-top:12px"></div>`;
  const carregar = () => executar(async () => {
    const r = await api('presenca', { mes: document.getElementById('mesP').value });
    const pessoas = {};
    r.visitas.forEach(v => {
      const p = pessoas[v.colaborador] || (pessoas[v.colaborador] = { dias: new Set(), horas: 0, fora: 0, n: 0, aberto: 0 });
      p.n++; p.dias.add(v.chegada.slice(0, 10)); p.horas += Number(v.horas) || 0; if (v.situacao === 'Fora do raio') p.fora++; if (!v.saida) p.aberto++;
    });
    const selo = s => s === 'No local' ? 'verde' : s === 'Fora do raio' || s === 'Cliente novo' ? 'laranja' : 'amarelo';
    document.getElementById('pres').innerHTML = (Object.keys(pessoas).length ? `<div class="cartao"><table><thead><tr><th>Colaborador</th><th class="n">Dias</th><th class="n">Horas</th><th class="n">Fora</th></tr></thead><tbody>
        ${Object.keys(pessoas).sort().map(k => `<tr><td>${esc(k)}</td><td class="n">${pessoas[k].dias.size}</td><td class="n">${dur(pessoas[k].horas)}</td><td class="n">${pessoas[k].fora ? `<span class="selo-txt laranja">${pessoas[k].fora}</span>` : '0'}</td></tr>`).join('')}
      </tbody></table></div>` : msg('info', 'Nenhum check-in neste mês.')) +
      (r.semLocal.length ? `<p class="suave">Clientes sem localização: ${esc(r.semLocal.join(', '))}. Use o botão “Usar como local do cliente” num check-in feito lá.</p>` : '') +
      (r.visitas.length ? `<h2>Check-ins</h2>` + r.visitas.map(v => `<div class="cartao ${v.tardio ? 'tardio' : ''}"><div class="t">${esc(v.colaborador)} · ${esc(v.cliente)}</div>
        <p class="suave" style="margin:2px 0 6px">${esc(v.chegada)}${v.saida ? ' às ' + esc(hora(v.saida)) + ' · ' + dur(v.horas) : ' · <b>sem saída registrada</b>'}${v.obs ? '<br>' + esc(v.obs) : ''}</p>
        <span class="selo-txt ${selo(v.situacao)}">${esc(v.situacao)}${v.dist !== '' && v.dist != null && v.situacao !== 'No local' ? ' · ' + distTxt(v.dist) : ''}</span>${v.tardio ? `<span class="selo-txt laranja">${esc(v.tardio)} lançada depois</span>` : ''}
        ${/^http/.test(v.mapa) ? `<a class="link" href="${esc(v.mapa)}" target="_blank" rel="noopener">Mapa</a>` : ''}
        ${v.situacao === 'Cliente sem localização' && v.lat !== '' ? ` · <button type="button" class="link" data-loc="${esc(v.n)}">Usar como local do cliente</button>` : ''}</div>`).join('') : '');
    document.querySelectorAll('[data-loc]').forEach(b => b.onclick = () => executar(async () => {
      if (!confirm('Usar a posição deste check-in como endereço do cliente? Os próximos check-ins serão comparados com ela.')) return;
      const x = await api('definirLocalCliente', { n: b.dataset.loc }); erroTela(''); document.getElementById('erro').innerHTML = msg('ok', `Localização de ${x.cliente} definida.`); carregar();
    }));
  });
  document.getElementById('mesP').onchange = carregar; carregar();
}

// ---------- partida ----------
est.token = lerLocal('kc_token');
est.token ? carregarInicio() : telaLogin();
