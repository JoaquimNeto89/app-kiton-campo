<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Kiton Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --vermelho:#CD0000; --vermelho-esc:#A30000; --amarelo:#FFAF1F; --amarelo-claro:#FFF3DA;
  --preto:#000; --aco:#E6E9ED; --aco-esc:#C7CCD3; --texto:#1C1F23; --cinza:#5D6670;
  --verde:#1F8A4C; --verde-claro:#E2F3E8; --branco:#fff;
  --tit:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --corpo:"Barlow",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--aco);color:var(--texto);font:17px/1.4 var(--corpo);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--amarelo);outline-offset:2px}
.topo{position:sticky;top:0;z-index:10;background:var(--preto);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.topo img{width:34px;height:34px;border-radius:8px;background:#fff}
.topo .marca{font:700 19px/1 var(--tit);letter-spacing:.2px;flex:1}
.topo .marca span{display:block;font:500 13px/1.3 var(--corpo);color:#B9C0C8;letter-spacing:0}
.topo .icone-btn{background:#1E2227;border:0;border-radius:10px;width:40px;height:40px;display:grid;place-items:center}
.faixa{height:4px;background:var(--vermelho)}
main{max-width:560px;margin:0 auto;padding:18px 16px 120px}
h1{font:700 26px/1.15 var(--tit);margin:4px 0 14px}
h2{font:700 20px/1.2 var(--tit);margin:22px 0 10px}
p{margin:0 0 10px}
.suave{color:var(--cinza);font-size:15px}
svg.i{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Etiqueta de status: o elemento principal da tela inicial */
.etiqueta{position:relative;background:var(--branco);border-radius:16px;padding:18px 18px 20px 26px;overflow:hidden;box-shadow:0 1px 0 var(--aco-esc)}
.etiqueta::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--preto)}
.etiqueta.campo::before{background:repeating-linear-gradient(-45deg,var(--amarelo) 0 12px,var(--preto) 12px 24px)}
.etiqueta .furo{position:absolute;right:18px;top:18px;width:18px;height:18px;border-radius:50%;border:3px solid var(--aco-esc);background:var(--aco)}
.etiqueta .estado{font:700 15px/1 var(--tit);display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:var(--aco);color:var(--texto)}
.etiqueta.campo .estado{background:var(--amarelo);color:#000}
.etiqueta .onde{font:700 30px/1.08 var(--tit);margin:12px 0 6px;padding-right:30px}
.etiqueta .det{color:var(--cinza);font-size:16px}
.etiqueta .det b{color:var(--texto);font-weight:600}

.acao{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:14px;padding:18px;font:700 20px/1 var(--tit);background:var(--vermelho);color:#fff;margin-top:16px;min-height:62px}
.acao:active{background:var(--vermelho-esc)}
.acao.leve{background:var(--branco);color:var(--texto);border:2px solid var(--aco-esc)}
.acao.preta{background:var(--preto)}
.acao:disabled{opacity:.45}
.acao svg.i{width:24px;height:24px}

.modulos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modulo{position:relative;background:var(--branco);border:0;border-radius:16px;padding:18px 16px 16px;text-align:left;display:flex;flex-direction:column;gap:12px;min-height:138px}
.modulo .ic-caixa{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--preto);color:#fff}
.modulo .ic-caixa svg.i{width:26px;height:26px}
.modulo b{font:700 19px/1.1 var(--tit)}
.modulo span.d{font-size:14px;color:var(--cinza);line-height:1.3}
.modulo .status{position:absolute;top:14px;right:14px;font:700 13px/1 var(--tit);padding:6px 9px;border-radius:8px;background:var(--aco)}
.modulo .status.campo{background:var(--amarelo);color:#000}
.modulo.principal .ic-caixa{background:var(--vermelho)}
.modulo.breve{opacity:.55}
.modulo.breve .ic-caixa{background:var(--aco-esc);color:var(--texto)}
.secao-titulo{font:700 16px/1.2 var(--tit);color:var(--cinza);margin:22px 0 10px}
.atalhos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.atalho{background:var(--branco);border:0;border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:104px}
.atalho b{font:700 18px/1.1 var(--tit)}
.atalho span{font-size:14px;color:var(--cinza)}
.regra{margin-top:20px;font-size:14px;color:var(--cinza);display:flex;gap:8px}

/* Passos da saída */
.passos{display:flex;gap:6px;margin:2px 0 6px}
.passos i{flex:1;height:6px;border-radius:3px;background:var(--aco-esc)}
.passos i.feito{background:var(--preto)}
.passos i.atual{background:var(--vermelho)}
.passo-nome{font-size:14px;color:var(--cinza);margin-bottom:6px}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opcao{background:var(--branco);border:2px solid transparent;border-radius:14px;padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:96px;font-weight:600;font-size:16px;line-height:1.2}
.opcao.larga{grid-column:1/-1;flex-direction:row;align-items:center;min-height:64px}
.opcao.sel{border-color:var(--preto);box-shadow:inset 0 0 0 1px var(--preto)}
.opcao.sel svg.i{color:var(--vermelho)}
.linha{display:flex;align-items:center;gap:12px;width:100%;background:var(--branco);border:0;border-radius:12px;padding:14px;margin-bottom:8px;text-align:left;font-weight:600;min-height:56px}
a.linha{color:inherit;text-decoration:none}
.linha small{display:block;font-weight:400;color:var(--cinza);font-size:14px}
.linha .fim{margin-left:auto;color:var(--cinza)}
.linha.sel{box-shadow:inset 0 0 0 2px var(--preto)}
.campo-txt{width:100%;font:inherit;padding:14px;border:2px solid var(--aco-esc);border-radius:12px;background:#fff;color:var(--texto)}
.campo-txt:focus{border-color:var(--preto);outline:none}
textarea.campo-txt{min-height:84px;resize:vertical}
.rotulo{font-weight:600;margin:16px 0 8px;display:block}

.pessoas{display:flex;flex-wrap:wrap;gap:8px}
.pessoa{border:2px solid var(--aco-esc);background:#fff;border-radius:999px;padding:10px 14px;font-weight:500}
.pessoa.sel{background:var(--preto);border-color:var(--preto);color:#fff}

/* Itens */
.busca{position:sticky;top:64px;z-index:5;background:var(--aco);padding:6px 0 10px}
.grupo{font:700 16px/1.2 var(--tit);color:var(--cinza);margin:16px 0 8px}
.item{display:flex;gap:12px;align-items:center;background:var(--branco);border-radius:12px;padding:12px 14px;margin-bottom:8px;width:100%;border:2px solid transparent;text-align:left}
.item .caixa{width:28px;height:28px;border-radius:8px;border:2px solid var(--aco-esc);display:grid;place-items:center;flex:none}
.item.sel{border-color:var(--preto)}
.item.sel .caixa{background:var(--preto);border-color:var(--preto);color:#fff}
.item .nome{font-weight:600}
.item .sub{font-size:14px;color:var(--cinza)}
.item.ocupado{opacity:.6}
.item.ocupado .caixa{border-style:dashed}
.cal{font-size:12.5px;color:var(--cinza);margin-top:2px}
.cal.ruim{color:var(--vermelho-esc);font-weight:600}
.cal.atencao{color:#8A3B00;font-weight:600}
.subgrupo{background:var(--branco);border-radius:12px;margin-bottom:8px;overflow:hidden}
.sg-cab{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:12px 14px;text-align:left}
.sg-qtd{min-width:32px;height:32px;border-radius:8px;background:var(--aco);display:grid;place-items:center;font:700 15px/1 var(--tit)}
.sg-qtd.tem{background:var(--preto);color:#fff}
.sg-txt{flex:1}.sg-txt .nome{display:block;font-weight:600}.sg-txt .sub{font-size:14px;color:var(--cinza)}
.seta-sg{transition:transform .15s;color:var(--cinza)}
.subgrupo.aberto .seta-sg{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){.seta-sg{transition:none}}
.sg-itens{padding:0 10px 6px;border-top:1px solid var(--aco)}
.item.dentro{margin:6px 0;background:var(--aco);}
.item.dentro.sel{background:#fff}
.pat{display:inline-block;font-size:13px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--aco);margin-left:6px;vertical-align:1px}
.aviso-item{display:inline-block;margin-top:4px;font-size:13px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--amarelo-claro);color:#7A4A00}

/* Barra fixa inferior */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--branco);box-shadow:0 -1px 0 var(--aco-esc);padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.barra .dentro{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.barra .acao{margin:0;flex:1}
.barra .voltar{flex:none;width:62px;padding:0;background:var(--aco);color:var(--texto)}
.contador{font-weight:600;font-size:15px;color:var(--cinza);margin-bottom:8px;max-width:560px;margin-left:auto;margin-right:auto}

/* Resumo e confirmação */
.resumo{background:var(--branco);border-radius:14px;padding:4px 16px}
.resumo div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--aco)}
.resumo div:last-child{border-bottom:0}
.resumo dt{color:var(--cinza)}
.resumo dd{margin:0;font-weight:600;text-align:right}
.feito-tela{text-align:center;padding-top:40px}
.feito-tela .selo{width:96px;height:96px;border-radius:50%;background:var(--verde);color:#fff;display:grid;place-items:center;margin:0 auto 18px;animation:pop .35s ease-out}
.feito-tela .selo svg.i{width:52px;height:52px;stroke-width:2.6}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.feito-tela .selo{animation:none}}

.segmento{display:flex;background:var(--aco-esc);border-radius:12px;padding:4px;gap:4px;margin-top:8px}
.segmento button{flex:1;border:0;background:transparent;border-radius:9px;padding:10px 6px;font-weight:600;font-size:15px}
.segmento button.sel{background:#fff}
.segmento button.sel.ruim{background:var(--vermelho);color:#fff}

.cartao{background:var(--branco);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.cartao .t{font-weight:600}
.cal-resumo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cal-qd{background:var(--branco);border:2px solid transparent;border-radius:12px;padding:10px 6px;text-align:center;border-top:5px solid var(--aco-esc)}
.cal-qd b{display:block;font:700 26px/1.1 var(--tit)}
.cal-qd span{display:block;font-size:12.5px;color:var(--cinza);margin-top:2px;line-height:1.2}
.cal-qd.vermelho{border-top-color:var(--vermelho)}.cal-qd.vermelho b{color:var(--vermelho-esc)}
.cal-qd.laranja{border-top-color:#E07800}.cal-qd.laranja b{color:#8A3B00}
.cal-qd.amarelo{border-top-color:var(--amarelo)}
.cal-qd.verde{border-top-color:var(--verde)}.cal-qd.verde b{color:var(--verde)}
.cal-qd.ativo{border-color:var(--preto);border-top-width:5px}
@media (max-width:380px){.cal-resumo{grid-template-columns:repeat(2,1fr)}}
.cal-minis{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.cal-mini{font-size:12px;font-weight:600;padding:1px 7px;border-radius:6px}
.cal-mini.vermelho{background:#FCE4E4;color:var(--vermelho-esc)}
.cal-mini.laranja{background:#FFE2C2;color:#8A3B00}
.cal-mini.amarelo{background:var(--amarelo-claro);color:#7A4A00}
.cal-mini.verde{background:var(--verde-claro);color:var(--verde)}
.sg-qtd.cal-vermelho{background:var(--vermelho);color:#fff}
.sg-qtd.cal-laranja{background:#E07800;color:#fff}
.sg-qtd.cal-amarelo{background:var(--amarelo);color:#000}
.sg-qtd.cal-verde{background:var(--verde);color:#fff}
.link{background:none;border:0;padding:0;color:var(--texto);text-decoration:underline;font:inherit;font-weight:600}
.selo-txt{display:inline-block;font-size:13px;font-weight:600;padding:2px 8px;border-radius:6px;margin-right:6px}
.selo-txt.amarelo{background:var(--amarelo-claro);color:#7A4A00}
.selo-txt.vermelho{background:#FCE4E4;color:var(--vermelho-esc)}
.selo-txt.laranja{background:#FFE2C2;color:#8A3B00}
.cartao.tardio{box-shadow:inset 4px 0 0 #E8730C}
.selo-txt.verde{background:var(--verde-claro);color:var(--verde)}
.abas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.abas button{flex:1 1 auto;border:0;border-radius:12px;padding:12px 12px;background:#fff;font-weight:600;font-size:15px;white-space:nowrap}
.bolinha{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;margin-left:6px;border-radius:10px;background:var(--vermelho);color:#fff;font-size:12px;line-height:1}
.abas button.sel{background:var(--preto);color:#fff}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--aco)}
th{font-size:13px;color:var(--cinza);font-weight:600}
td.n{text-align:right}

.msg{padding:12px 14px;border-radius:12px;margin:0 0 12px;font-size:15px;font-weight:500}
.msg.erro{background:#FCE4E4;color:#7E0000}
.msg.ok{background:var(--verde-claro);color:#105A30}
.msg.info{background:#fff;color:var(--cinza)}
.carregando{position:fixed;inset:0;z-index:30;background:rgba(230,233,237,.75);display:grid;place-items:center}
.carregando div{background:#000;color:#fff;font-weight:600;padding:14px 20px;border-radius:12px}
.oculto{display:none!important}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.foto{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#fff}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto button{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:18px;line-height:1}
.assin{position:relative;background:#fff;border:2px dashed var(--aco-esc);border-radius:12px}
.assin canvas{display:block;width:100%;height:210px;touch-action:none;border-radius:10px}
.assin .link{position:absolute;right:12px;top:8px}
.linha-meus{display:flex;align-items:center;gap:12px;width:100%;background:var(--branco);border:0;border-radius:14px;padding:14px 16px;margin-top:12px;text-align:left}
.linha-meus b{font:700 18px/1.1 var(--tit)}
.linha-meus .q{min-width:34px;height:34px;border-radius:9px;background:var(--preto);color:#fff;display:grid;place-items:center;font:700 16px/1 var(--tit)}
select.campo-txt{appearance:auto}
.login-marca{text-align:center;margin:26px 0 22px}
.login-marca img{width:84px;height:84px;border-radius:20px;background:#fff}
.login-marca h1{margin:12px 0 4px}
.pin{letter-spacing:10px;font-size:24px;text-align:center}
</style>
</head>
<body>
<header class="topo">
  <img src="icon-192.png" alt="">
  <div class="marca" id="marca">Kiton Hub</div>
  <button class="icone-btn oculto" id="btnSair" type="button" aria-label="Sair do app"><svg class="i" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg></button>
</header>
<div class="faixa"></div>
<main id="app"></main>
<div id="barra"></div>
<div id="carregando" class="carregando oculto"><div>Aguarde…</div></div>
<script src="config.js"></script>
<script>
'use strict';
const $app = document.getElementById('app'), $barra = document.getElementById('barra');
const est = { token: null, usuario: null, dados: null };

// ---------- ícones ----------
const IC = {
  cliente:'<path d="M3 21h18M5 21V8l7-4 7 4v13M9 21v-5h6v5M9 11h.01M15 11h.01"/>',
  copel:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  compra:'<path d="M3 4h2l2.4 11h11.2L21 7H6.2M10 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM18 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/>',
  banco:'<path d="M3 10h18L12 4zM5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18"/>',
  interno:'<path d="M3 11 12 4l9 7M5 10v10h14V10M10 20v-6h4v6"/>',
  outro:'<path d="M5 12h.01M12 12h.01M19 12h.01"/>',
  van:'<path d="M2 17V7a1 1 0 0 1 1-1h11l5 5h2a1 1 0 0 1 1 1v5h-2M2 17h2M9 17h6M14 6v5h5"/><circle cx="6.5" cy="17" r="2"/><circle cx="17" cy="17" r="2"/>',
  carro:'<path d="M5 17H3v-4l2-5h11l3 5h2v4h-2M8 17h7M5 13h14"/><circle cx="6.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/>',
  pe:'<circle cx="13" cy="4" r="2"/><path d="m9 20 3-6 3 3v4M7 12l3-4 4 1 2 4 3 1"/>',
  ferr:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',
  comb:'<path d="M4 21V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v16M3 21h13M15 9h2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V8l-3-3M7 8h5"/>',
  sem:'<circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/>',
  ok:'<path d="m5 12 5 5 9-10"/>',
  seta:'<path d="m9 6 6 6-6 6"/>',
  voltar:'<path d="m15 6-6 6 6 6"/>',
  saida:'<path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M9 8l4 4-4 4M13 12H3"/>',
  retorno:'<path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M15 8l-4 4 4 4M11 12h10"/>',
  admin:'<path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2 2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2zM9 13l2 2 4-4"/>',
  pino:'<path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  os:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17c1.5-1.5 2.5 1.5 4 0s2.5 1 4 0"/>',
  calib:'<path d="M4 15a8 8 0 1 1 16 0M12 15l4-5M8 19h8"/>',
  recibo:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3"/>',
  tabela:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 10v10"/>',
  pessoas:'<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 4a3 3 0 0 1 0 6M21 20a6 6 0 0 0-4-5.6"/>'
};
const ic = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[n] || IC.outro}</svg>`;
const icMotivo = m => /cliente/i.test(m) ? 'cliente' : /copel|concession/i.test(m) ? 'copel' : /compra|material/i.test(m) ? 'compra' : /banco|órgão|orgao/i.test(m) ? 'banco' : /interno/i.test(m) ? 'interno' : 'outro';
const icVeiculo = v => /kiton|dobl/i.test(v) ? 'van' : /partic/i.test(v) ? 'carro' : 'pe';
const icAbast = a => /não|nao/i.test(a) ? 'sem' : 'comb';

// ---------- utilidades ----------
const guardar = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
const lerLocal = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const carregando = on => document.getElementById('carregando').classList.toggle('oculto', !on);
const msg = (tipo, t) => `<div class="msg ${tipo}" role="status">${esc(t)}</div>`;
const hora = s => String(s || '').slice(-5);
const primeiroNome = n => String(n || '').replace(/^Eng\.\s*/, '').split(' ')[0];
const barra = html => { $barra.innerHTML = html ? `<div class="barra">${html}</div>` : ''; };
const topo = (sub) => { document.getElementById('marca').innerHTML = `Kiton Hub${sub ? `<span>${esc(sub)}</span>` : ''}`; };

async function api(acao, dados = {}) {
  if (!window.API_URL || API_URL.indexOf('http') !== 0) throw new Error('O endereço do Apps Script ainda não foi configurado (config.js).');
  let r;
  try {
    r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ acao, token: est.token, ...dados }) });
  } catch (e) { throw new Error('Sem conexão com o servidor. Confira a internet e tente de novo.'); }
  const j = await r.json();
  if (!j.ok) {
    if (j.erro === 'SESSAO_INVALIDA') { sair(); throw new Error('Sua sessão expirou. Entre de novo.'); }
    if (j.erro === 'TROCAR_PIN') { telaTrocarPin(); throw new Error('Crie o seu PIN para continuar.'); }
    throw new Error(j.erro || 'Algo deu errado. Tente de novo.');
  }
  return j;
}
function localizacao() {
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6), acc: p.coords.accuracy }),
      () => res(null), { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  });
}
async function executar(fn) {
  carregando(true);
  try { return await fn(); } catch (e) { erroTela(e.message); } finally { carregando(false); }
}
function erroTela(t) {
  const box = document.getElementById('erro');
  if (box) { box.innerHTML = msg('erro', t); box.scrollIntoView({ behavior: 'smooth', block: 'center' }); } else alert(t);
}
function sair() {
  est.token = null; est.usuario = null; est.dados = null; guardar('kc_token', null); telaLogin();
}
document.getElementById('btnSair').onclick = () => { if (confirm('Sair do app neste celular?')) sair(); };

// ---------- calibração na lista de itens ----------
function linhaCal(i) {
  if (i.tipo !== 'Instrumento' && !i.calData) return '';
  if (!i.calData) return '<div class="cal">Sem calibração registrada</div>';
  const d = i.calDias;
  if (d == null) return `<div class="cal">Calibrado em ${esc(i.calData)}</div>`;
  if (d < 0) return `<div class="cal ruim">Calibrado em ${esc(i.calData)} · vencida há ${-d} dias</div>`;
  return `<div class="cal ${d <= 60 ? 'atencao' : ''}">Calibrado em ${esc(i.calData)} · vence em ${d} dias</div>`;
}

// ---------- horário: agora ou informado ----------
const doisDig = n => String(n).padStart(2, '0');
const agoraLocal = () => { const d = new Date(); return `${d.getFullYear()}-${doisDig(d.getMonth() + 1)}-${doisDig(d.getDate())}T${doisDig(d.getHours())}:${doisDig(d.getMinutes())}`; };
function blocoHorario(id, pergunta) {
  return `<label class="rotulo">${esc(pergunta)}</label>
    <div class="segmento" id="${id}-seg"><button type="button" class="sel" data-v="agora">Agora</button><button type="button" data-v="outro">Outro horário</button></div>
    <div id="${id}-box" class="oculto" style="margin-top:10px"><input class="campo-txt" id="${id}" type="datetime-local" max="${agoraLocal()}">
    <p class="suave" style="margin-top:6px">Use quando esqueceu de registrar na hora. A administração vê que o lançamento foi feito depois.</p></div>`;
}
function ligarHorario(id) {
  document.querySelectorAll(`#${id}-seg button`).forEach(b => b.onclick = () => {
    document.querySelectorAll(`#${id}-seg button`).forEach(x => x.classList.toggle('sel', x === b));
    const outro = b.dataset.v === 'outro';
    document.getElementById(`${id}-box`).classList.toggle('oculto', !outro);
    if (outro && !document.getElementById(id).value) document.getElementById(id).value = agoraLocal();
  });
}
function lerHorario(id) {
  const outro = document.querySelector(`#${id}-seg .sel`).dataset.v === 'outro';
  if (!outro) return '';
  const v = document.getElementById(id).value;
  if (!v) throw new Error('Informe o horário ou escolha "Agora".');
  if (v > agoraLocal()) throw new Error('O horário não pode ser no futuro.');
  return v;
}

async function telaLogin() {
  document.getElementById('btnSair').classList.add('oculto'); topo(); barra('');
  $app.innerHTML = `<div class="login-marca"><img src="icon-192.png" alt=""><h1>Entrar no Kiton Hub</h1><p class="suave">Registro de saídas, ferramentas e retorno</p></div>
    <div id="erro"></div>
    <label class="rotulo" for="nome">Quem é você?</label>
    <div id="nomes"><p class="suave">Carregando nomes…</p></div>
    <label class="rotulo" for="pin">PIN</label>
    <input class="campo-txt pin" id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="••••••">
    <p class="suave" style="margin-top:8px">No primeiro acesso o PIN é 123456. Depois o app pede para você criar o seu.</p>`;
  barra(`<div class="dentro"><button class="acao" id="entrar" type="button">Entrar</button></div>`);
  let escolhido = lerLocal('kc_ultimo_nome') || '';
  try {
    const r = await api('nomes');
    const desenha = () => {
      document.getElementById('nomes').innerHTML = r.nomes.map(n => `<button type="button" class="linha ${n === escolhido ? 'sel' : ''}" data-n="${esc(n)}">${ic('pessoas')}${esc(n)}${n === escolhido ? `<span class="fim">${ic('ok')}</span>` : ''}</button>`).join('');
      document.querySelectorAll('#nomes [data-n]').forEach(b => b.onclick = () => { escolhido = b.dataset.n; desenha(); document.getElementById('pin').focus(); });
    };
    desenha();
  } catch (e) { erroTela(e.message); }
  const entrar = () => executar(async () => {
    const pin = document.getElementById('pin').value;
    if (!escolhido) throw new Error('Toque no seu nome.');
    if (pin.length !== 6) throw new Error('O PIN tem 6 números.');
    const r = await api('login', { nome: escolhido, pin });
    est.token = r.token; est.usuario = r.usuario; guardar('kc_token', r.token); guardar('kc_ultimo_nome', escolhido);
    r.usuario.trocaPendente ? telaTrocarPin() : carregarInicio();
  });
  document.getElementById('entrar').onclick = entrar;
  document.getElementById('pin').onkeydown = e => { if (e.key === 'Enter') entrar(); };
}
function telaTrocarPin() {
  topo(); barra('');
  $app.innerHTML = `<h1>Crie o seu PIN</h1><div id="erro"></div>
    <p class="suave">São 6 números que só você sabe. Não vale 123456 nem sequências como 111111 ou 123123.</p>
    <label class="rotulo" for="p1">Novo PIN</label><input class="campo-txt pin" id="p1" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password">
    <label class="rotulo" for="p2">Repita o PIN</label><input class="campo-txt pin" id="p2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password">`;
  barra(`<div class="dentro"><button class="acao" id="ok" type="button">Salvar PIN</button></div>`);
  document.getElementById('ok').onclick = () => executar(async () => {
    const a = document.getElementById('p1').value, b = document.getElementById('p2').value;
    if (a !== b) throw new Error('Os dois PINs estão diferentes.');
    const r = await api('trocarPin', { novo: a });
    est.token = r.token; est.usuario = r.usuario; guardar('kc_token', r.token); carregarInicio();
  });
}

// Situações na ordem de gravidade; "Válido" aparece como "Em dia"
const CAL_ST = [
  { st: 'Vencido', rot: 'Vencidos', um: 'vencido', cor: 'vermelho' },
  { st: 'Vencendo', rot: 'Vencendo', um: 'vencendo', cor: 'laranja' },
  { st: 'Sem calibração', rot: 'Sem calibração', um: 'sem calibração', cor: 'amarelo' },
  { st: 'Válido', rot: 'Em dia', um: 'em dia', cor: 'verde' }
];
let calDados = null, calFiltro = '', calAbertos = new Set();

function desenharCal() {
  const r = calDados, el = document.getElementById('lista');
  if (!el) return;
  const info = st => CAL_ST.find(c => c.st === st) || CAL_ST[2];
  const cont = (lista, st) => lista.filter(i => i.status === st).length;

  // Resumo geral: cada quadro filtra a lista
  const resumo = `<div class="cal-resumo">` + CAL_ST.map(c => `<button type="button" class="cal-qd ${c.cor}${calFiltro === c.st ? ' ativo' : ''}" data-f="${c.st}" aria-pressed="${calFiltro === c.st}">
      <b>${cont(r.itens, c.st)}</b><span>${c.rot}</span></button>`).join('') + `</div>
    <p class="suave" style="margin:6px 0 12px">${r.itens.length} instrumentos${calFiltro ? ` · mostrando só ${info(calFiltro).rot.toLowerCase()} · <button type="button" class="link" id="limparF">ver todos</button>` : ' · toque num quadro para filtrar'}</p>`;

  // Agrupa pela coluna Grupo (ou pela descrição, se o grupo estiver vazio)
  const itens = calFiltro ? r.itens.filter(i => i.status === calFiltro) : r.itens;
  const mapa = new Map();
  itens.forEach(i => { const g = i.grupo || i.desc; if (!mapa.has(g)) mapa.set(g, []); mapa.get(g).push(i); });
  const pior = l => Math.min(...l.map(i => { const k = CAL_ST.findIndex(c => c.st === i.status); return k < 0 ? 2 : k; }));
  const grupos = [...mapa.entries()].sort((a, b) => pior(a[1]) - pior(b[1]) || a[0].localeCompare(b[0], 'pt'));

  const linha = i => {
    const dias = i.dias != null ? ` (${i.dias < 0 ? 'há ' + (-i.dias) + ' dias' : 'faltam ' + i.dias + ' dias'})` : '';
    return `<button type="button" class="item dentro" data-p="${esc(i.pat)}">
      <span style="flex:1"><span class="nome">${esc(i.grupo || i.desc)}${i.ident ? ' ' + esc(i.ident) : ''}<span class="pat">${esc(i.pat)}</span></span>
      <span class="sub" style="display:block">${esc(i.marca)}</span>
      <span class="cal${i.status === 'Vencido' ? ' ruim' : i.status === 'Vencendo' ? ' atencao' : ''}" style="display:block;margin-top:4px"><span class="selo-txt ${info(i.status).cor}">${i.status === 'Válido' ? 'Em dia' : esc(i.status)}</span>${i.validade ? 'Válida até ' + esc(i.validade) + dias : ''}</span></span>
      <span class="fim">${ic('seta')}</span></button>`;
  };

  const blocos = grupos.map(([g, l]) => {
    const resumoG = CAL_ST.filter(c => cont(l, c.st)).map(c => `<span class="cal-mini ${c.cor}">${cont(l, c.st)} ${c.um}</span>`).join('');
    const p = pior(l), corQtd = p === 0 ? 'vermelho' : p === 1 ? 'laranja' : p === 2 ? 'amarelo' : 'verde';
    const aberto = calAbertos.has(g) || !!calFiltro;
    return `<div class="subgrupo${aberto ? ' aberto' : ''}" data-g="${esc(g)}">
      <button type="button" class="sg-cab" aria-expanded="${aberto}"><span class="sg-qtd cal-${corQtd}">${l.length}</span>
        <span class="sg-txt"><span class="nome">${esc(g)}${(() => { const pf = [...new Set(l.map(i => i.pat.split('-').slice(0, 2).join('-')))]; return pf[0] ? ` <span style="white-space:nowrap">(${esc(pf.join(', '))})</span>` : ''; })()}</span><span class="cal-minis">${resumoG}</span></span>
        <span class="seta-sg">${ic('seta')}</span></button>
      <div class="sg-itens"${aberto ? '' : ' hidden'}>${l.map(linha).join('')}</div></div>`;
  }).join('');

  el.innerHTML = resumo + (blocos || '<p class="suave">Nenhum instrumento nessa situação.</p>');
  el.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { calFiltro = calFiltro === b.dataset.f ? '' : b.dataset.f; desenharCal(); });
  const lf = document.getElementById('limparF'); if (lf) lf.onclick = () => { calFiltro = ''; desenharCal(); };
  el.querySelectorAll('.subgrupo').forEach(s => s.querySelector('.sg-cab').onclick = () => {
    const g = s.dataset.g, abrir = !s.classList.contains('aberto');
    s.classList.toggle('aberto', abrir); s.querySelector('.sg-itens').hidden = !abrir; s.querySelector('.sg-cab').setAttribute('aria-expanded', abrir);
    abrir ? calAbertos.add(g) : calAbertos.delete(g);
  });
  el.querySelectorAll('[data-p]').forEach(b => b.onclick = () => telaCalItem(r.itens.find(x => x.pat === b.dataset.p), r.periodicidades));
}

    <dl class="resumo">
      <div><dt>Situação</dt><dd>${esc(i.status)}</dd></div>
      <div><dt>Última calibração</dt><dd>${esc(i.data || 'Não registrada')}</dd></div>
      <div><dt>Válida até</dt><dd>${esc(i.validade || '-')}</dd></div>
      <div><dt>Certificado</dt><dd>${esc(i.cert || '-')}</dd></div>
      <div><dt>Periodicidade</dt><dd>${esc(i.per || '-')}</dd></div>
      <div><dt>Fornecedor</dt><dd>${esc(i.fornecedor || '-')}</dd></div>
      <div><dt>Custo da última</dt><dd>${i.custo !== '' && i.custo != null ? 'R$ ' + real(i.custo) : '-'}</dd></div>
      <div><dt>Local / responsável</dt><dd>${esc(i.local || i.responsavel || '-')}</dd></div>
    </dl>
    <h2>Registrar nova calibração</h2>
    <label class="rotulo" for="cData">Data da calibração</label><input class="campo-txt" id="cData" type="date" max="${hoje}" value="${hoje}">
    <label class="rotulo" for="cCert">Nº do certificado</label><input class="campo-txt" id="cCert">
    <label class="rotulo">Periodicidade</label><div class="pessoas" id="cPer">${pers.map(x => `<button type="button" class="pessoa ${x === i.per ? 'sel' : ''}" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>
    <label class="rotulo" for="cForn">Fornecedor / laboratório</label><input class="campo-txt" id="cForn" value="${esc(i.fornecedor)}">
    <label class="rotulo" for="cCusto">Custo (R$)</label><input class="campo-txt" id="cCusto" inputmode="decimal" placeholder="0,00">

  let per = i.per;
  document.querySelectorAll('#cPer [data-v]').forEach(b => b.onclick = () => { per = b.dataset.v; document.querySelectorAll('#cPer .pessoa').forEach(x => x.classList.toggle('sel', x === b)); });
  barra(`<div class="dentro"><button class="acao voltar" id="ant" type="button" aria-label="Voltar">${ic('voltar')}</button><button class="acao" id="ok" type="button">Salvar calibração</button></div>`);
  document.getElementById('ant').onclick = () => telaCalibracao();

    const data = document.getElementById('cData').value;
    if (!data) throw new Error('Informe a data da calibração.');
    if (!per) throw new Error('Escolha a periodicidade.');
    const custo = Number(document.getElementById('cCusto').value.replace(/\./g, '').replace(',', '.')) || '';
    await api('registrarCalibracao', { pat: i.pat, data, cert: document.getElementById('cCert').value, periodicidade: per, fornecedor: document.getElementById('cForn').value, custo, obs: document.getElementById('cObs').value });
    await telaCalibracao();
    document.getElementById('erro').innerHTML = msg('ok', `Calibração de ${i.pat} registrada.`);
  });
}

// ---------- saída em passos ----------
function fluxoSaida() {
  const d = est.dados;
  const f = { motivo: '', destino: '', veiculo: '', equipe: new Set(), itens: new Set(), obs: '' };
  const passos = ['Motivo', 'Destino', 'Veículo e equipe', 'Ferramentas e EPC', 'Conferir'];
  let p = 0;
  const cab = () => `<div class="passos">${passos.map((_, i) => `<i class="${i < p ? 'feito' : i === p ? 'atual' : ''}"></i>`).join('')}</div><div class="passo-nome">Passo ${p + 1} de ${passos.length}</div><div id="erro"></div>`;
  const rodape = (txtAvancar, pode) => barra(`${p === 3 ? `<div class="contador">${f.itens.size ? f.itens.size + (f.itens.size === 1 ? ' item selecionado' : ' itens selecionados') : 'Nenhum item selecionado'}</div>` : ''}
    <div class="dentro"><button class="acao voltar" id="ant" type="button" aria-label="Voltar">${ic('voltar')}</button>
    <button class="acao" id="prox" type="button" ${pode ? '' : 'disabled'}>${txtAvancar}</button></div>`);
  const ligar = () => {
    document.getElementById('ant').onclick = () => { if (p === 0) telaSaidas(); else { p--; desenhar(); } };
    const pr = document.getElementById('prox'); if (pr) pr.onclick = () => { if (p < 4) { p++; desenhar(); } else confirmar(); };
  };
  const avancarSozinho = () => setTimeout(() => { p++; desenhar(); }, 150);
  const itensBase = d.itens.filter(i => !i.kit);
  const comp = pat => d.itens.filter(i => i.kit === pat).map(i => i.desc);
  const nomeItem = i => i.grupo && i.ident ? `${i.grupo} ${i.ident}` : i.desc;

  function desenhar() {
    window.scrollTo(0, 0);
    if (p === 0) {
      $app.innerHTML = `${cab()}<h1>Por que você vai sair?</h1><div class="grade">
        ${d.motivos.map(m => `<button type="button" class="opcao ${f.motivo === m ? 'sel' : ''}" data-v="${esc(m)}">${ic(icMotivo(m))}${esc(m)}</button>`).join('')}</div>`;
      $app.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { f.motivo = b.dataset.v; if (/interno/i.test(f.motivo)) f.destino = f.destino || 'Kiton (uso interno)'; desenhar(); avancarSozinho(); });
      rodape('Continuar', !!f.motivo);
    } else if (p === 1) {
      const lista = d.clientes;
      $app.innerHTML = `${cab()}<h1>Para onde?</h1>
        <input class="campo-txt" id="buscaDest" placeholder="Buscar cliente ou digitar outro destino" value="">
        <div id="dests" style="margin-top:10px"></div>`;
      const busca = document.getElementById('buscaDest');
      const pintar = () => {
        const q = busca.value.trim().toLowerCase();
        const vis = lista.filter(c => !q || c.toLowerCase().includes(q));
        const livre = busca.value.trim() && !lista.some(c => c.toLowerCase() === q);
        document.getElementById('dests').innerHTML =
          (livre ? `<button type="button" class="linha" data-v="${esc(busca.value.trim())}">${ic('outro')}<span>Usar “${esc(busca.value.trim())}”<small>Destino que não está na lista</small></span></button>` : '') +
          vis.map(c => `<button type="button" class="linha ${f.destino === c ? 'sel' : ''}" data-v="${esc(c)}">${ic('cliente')}${esc(c)}${f.destino === c ? `<span class="fim">${ic('ok')}</span>` : ''}</button>`).join('');
        document.querySelectorAll('#dests [data-v]').forEach(b => b.onclick = () => { f.destino = b.dataset.v; pintar(); rodape('Continuar', true); ligar(); avancarSozinho(); });
      };
      busca.oninput = pintar; pintar();
      rodape('Continuar', !!f.destino);
    } else if (p === 2) {
      const outros = d.colaboradores.filter(n => n !== est.usuario.nome);
      $app.innerHTML = `${cab()}<h1>Como você vai?</h1><div class="grade">
        ${d.veiculos.map(v => `<button type="button" class="opcao ${/sem/i.test(v) ? 'larga' : ''} ${f.veiculo === v ? 'sel' : ''}" data-v="${esc(v)}">${ic(icVeiculo(v))}${esc(v)}</button>`).join('')}</div>
        ${outros.length ? `<label class="rotulo">Quem vai junto?</label><div class="pessoas">${outros.map(n => `<button type="button" class="pessoa ${f.equipe.has(n) ? 'sel' : ''}" data-p="${esc(n)}">${esc(n)}</button>`).join('')}</div><p class="suave" style="margin-top:8px">Opcional. Quem for junto não precisa registrar de novo.</p>` : ''}`;
      $app.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { f.veiculo = b.dataset.v; desenhar(); });
      $app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { f.equipe.has(b.dataset.p) ? f.equipe.delete(b.dataset.p) : f.equipe.add(b.dataset.p); b.classList.toggle('sel'); });
      rodape('Continuar', !!f.veiculo);
    } else if (p === 3) {
      $app.innerHTML = `${cab()}<h1>O que você vai levar?</h1><p class="suave">Marque as ferramentas e EPC de uso coletivo. Se não levar nada, é só continuar.</p>
        <div class="busca"><input class="campo-txt" id="buscaItem" placeholder="Buscar: escada, luva, K-0010…"></div><div id="itens"></div>`;
      const abertos = new Set();
      const linhaItem = (i, dentro) => {
        const livre = i.situacao === 'Disponível', sel = f.itens.has(i.pat);
        const motivo = livre ? '' : (i.comQuem ? `Com ${esc(primeiroNome(i.comQuem))} desde ${esc(i.desde)}` : esc(i.situacao));
        const nome = dentro && i.ident ? `${i.grupo} ${i.ident}` : nomeItem(i);
        return `<button type="button" class="item ${dentro ? 'dentro' : ''} ${sel ? 'sel' : ''} ${livre ? '' : 'ocupado'}" data-p="${esc(i.pat)}" ${livre ? '' : 'aria-disabled="true"'}>
          <span class="caixa">${sel ? ic('ok') : ''}</span>
          <span><span class="nome">${esc(nome)}</span><span class="pat">${esc(i.pat)}</span>
          ${!dentro && nome !== i.desc ? `<div class="sub">${esc(i.desc)}</div>` : ''}
          ${i.tipo === 'Kit' ? `<div class="sub">Contém: ${esc(comp(i.pat).join(', ') || 'componentes não cadastrados')}</div>` : ''}
          ${linhaCal(i)}
          ${motivo ? `<span class="aviso-item">${motivo}</span>` : ''}</span></button>`;
      };
      const pintar = () => {
        const q = document.getElementById('buscaItem').value.trim().toLowerCase();
        const vis = itensBase.filter(i => !q || [i.desc, i.grupo, i.ident, i.pat].join(' ').toLowerCase().includes(q));
        const cats = {};
        vis.forEach(i => {
          const c = i.tipo === 'Kit' ? 'Kits' : i.tipo === 'EPC' ? 'EPC' : i.tipo === 'Instrumento' ? 'Instrumentos' : i.tipo === 'Equipamento' ? 'Equipamentos' : 'Ferramentas';
          const g = i.grupo || i.desc;
          ((cats[c] = cats[c] || {})[g] = cats[c][g] || []).push(i);
        });
        const html = ['Ferramentas', 'Instrumentos', 'EPC', 'Kits', 'Equipamentos'].filter(c => cats[c]).map(c => `<div class="grupo">${c}</div>` +
          Object.keys(cats[c]).sort((x, y) => x.localeCompare(y, 'pt-BR')).map(g => {
            const lista = cats[c][g].sort((x, y) => (Number(x.ident) || 0) - (Number(y.ident) || 0) || x.pat.localeCompare(y.pat));
            if (lista.length === 1) return linhaItem(lista[0], false);
            const livres = lista.filter(i => i.situacao === 'Disponível').length;
            const marcados = lista.filter(i => f.itens.has(i.pat)).length;
            const aberto = q ? true : abertos.has(g);
            return `<div class="subgrupo ${aberto ? 'aberto' : ''}">
              <button type="button" class="sg-cab" data-g="${esc(g)}" aria-expanded="${aberto}">
                <span class="sg-qtd ${marcados ? 'tem' : ''}">${marcados || lista.length}</span>
                <span class="sg-txt"><span class="nome">${esc(g)}</span><span class="sub">${marcados ? `${marcados} selecionado${marcados > 1 ? 's' : ''} · ` : ''}${livres} de ${lista.length} disponíveis</span></span>
                <svg class="i seta-sg" viewBox="0 0 24 24" aria-hidden="true">${IC.seta}</svg>
              </button>
              ${aberto ? `<div class="sg-itens">${lista.map(i => linhaItem(i, true)).join('')}</div>` : ''}</div>`;
          }).join('')).join('');
        document.getElementById('itens').innerHTML = html || '<p class="suave">Nenhum item com esse nome.</p>';
        document.querySelectorAll('#itens [data-g]').forEach(b => b.onclick = () => { abertos.has(b.dataset.g) ? abertos.delete(b.dataset.g) : abertos.add(b.dataset.g); pintar(); });
        document.querySelectorAll('#itens [data-p]').forEach(b => b.onclick = () => {
          if (b.getAttribute('aria-disabled')) return;
          f.itens.has(b.dataset.p) ? f.itens.delete(b.dataset.p) : f.itens.add(b.dataset.p); pintar(); rodape('Continuar', true); ligar();
        });
      };
      document.getElementById('buscaItem').oninput = pintar; pintar();
      rodape('Continuar', true);
    } else {
      const sel = itensBase.filter(i => f.itens.has(i.pat));
      $app.innerHTML = `${cab()}<h1>Confira a saída</h1>
        <dl class="resumo">
          <div><dt>Motivo</dt><dd>${esc(f.motivo)}</dd></div>
          <div><dt>Destino</dt><dd>${esc(f.destino)}</dd></div>
          <div><dt>Veículo</dt><dd>${esc(f.veiculo)}</dd></div>
          <div><dt>Equipe</dt><dd>${f.equipe.size ? esc([...f.equipe].join(', ')) : 'Só você'}</dd></div>
          <div><dt>Levando</dt><dd>${sel.length ? sel.map(i => esc(nomeItem(i))).join('<br>') : 'Nada'}</dd></div>
        </dl>
        ${blocoHorario('hSaida', 'Que horas você saiu?')}
        <label class="rotulo" for="obs">Observação (opcional)</label><textarea class="campo-txt" id="obs">${esc(f.obs)}</textarea>
        <p class="suave" style="margin-top:10px">A hora do lançamento e a sua localização são registradas automaticamente ao confirmar.</p>`;
      document.getElementById('obs').oninput = e => f.obs = e.target.value;
      ligarHorario('hSaida');
      rodape(`${ic('saida')} Confirmar saída`, true);
    }
    ligar();
  }
  function confirmar() {
    executar(async () => {
      const horario = lerHorario('hSaida');
      const geo = await localizacao();
      const r = await api('registrarSaida', { horario, motivo: f.motivo, destino: f.destino, veiculo: f.veiculo, equipe: [...f.equipe], itens: [...f.itens].map(pat => ({ pat, qtd: 1 })), obs: f.obs, geo });
      telaFeito(`Saída nº ${r.n} registrada`, `${f.destino} · saída às ${hora(r.quando)}`, r.semLocalizacao, r.tardio);
    });
  }
  desenhar();
}

  barra(`<div class="dentro"><button class="acao voltar" id="ant" type="button" aria-label="Voltar">${ic('voltar')}</button></div>`);
  $app.innerHTML = `<h1>Qual saída está encerrando?</h1>${est.dados.abertas.map(s => `<button type="button" class="linha" data-n="${esc(s.n)}">${ic(icVeiculo(s.veiculo))}<span>${esc(s.destino)}<small>Saiu ${esc(s.saida)} · nº ${esc(s.n)}</small></span><span class="fim">${ic('seta')}</span></button>`).join('')}`;
  document.getElementById('ant').onclick = () => telaSaidas();
  $app.querySelectorAll('[data-n]').forEach(b => b.onclick = () => telaRetorno(est.dados.abertas.find(s => s.n === b.dataset.n)));
}
function telaRetorno(s) {
  const d = est.dados; const estado = {}; s.itens.forEach(i => estado[i.pat] = 'OK');
  let abast = 'Não abasteceu';
  $app.innerHTML = `<h1>Retorno de ${esc(s.destino)}</h1><p class="suave">Saiu ${esc(s.saida)} · ${esc(s.veiculo)} · nº ${esc(s.n)}</p><div id="erro"></div>
    <h2>Abasteceu?</h2><div class="grade" id="abast">
      ${d.abastecimentos.map(a => `<button type="button" class="opcao ${/não|nao/i.test(a) ? 'larga' : ''} ${a === abast ? 'sel' : ''}" data-v="${esc(a)}">${ic(icAbast(a))}${esc(a)}</button>`).join('')}</div>
    <div id="boxValor" class="oculto"><label class="rotulo" for="valor">Quanto você pagou? (R$)</label><input class="campo-txt" id="valor" inputmode="decimal" placeholder="0,00">
      <div id="rPrev"></div><label class="acao leve" for="rFoto" style="cursor:pointer">${ic('recibo')} Fotografar o cupom</label><input id="rFoto" type="file" accept="image/*" capture="environment" class="oculto">
      <p class="suave" style="margin-top:6px">Vai direto para Despesas como pedido de reembolso.</p></div>
    ${s.itens.length ? `<h2>Como voltaram as ferramentas?</h2>${s.itens.map(i => `<div class="cartao"><div class="t">${esc(i.desc)}<span class="pat">${esc(i.pat)}</span></div>
      <div class="segmento" data-p="${esc(i.pat)}"><button type="button" class="sel" data-v="OK">Voltou OK</button><button type="button" data-v="Avariado">Avariado</button><button type="button" data-v="Extraviado">Sumiu</button></div>
      <input class="campo-txt oculto" data-obs="${esc(i.pat)}" placeholder="O que aconteceu?" style="margin-top:10px"></div>`).join('')}` : ''}
    ${blocoHorario('hRet', 'Que horas você voltou?')}
    <label class="rotulo" for="obs">Observação (opcional)</label><textarea class="campo-txt" id="obs"></textarea>`;
  barra(`<div class="dentro"><button class="acao voltar" id="ant" type="button" aria-label="Voltar">${ic('voltar')}</button><button class="acao" id="ok" type="button">${ic('retorno')} Confirmar retorno</button></div>`);
  ligarHorario('hRet');
  let fotoCupom = null;
  document.getElementById('rFoto').onchange = e => executar(async () => {
    const a = e.target.files[0]; if (!a) return;
    fotoCupom = await comprimir(a, 1600, 0.75);
    document.getElementById('rPrev').innerHTML = `<div class="fotos"><div class="foto"><img src="${fotoCupom}" alt="Cupom"></div></div>`;
  });
  document.querySelectorAll('#abast [data-v]').forEach(b => b.onclick = () => {
    abast = b.dataset.v; document.querySelectorAll('#abast .opcao').forEach(x => x.classList.toggle('sel', x === b));
    document.getElementById('boxValor').classList.toggle('oculto', !/colaborador/i.test(abast));
  });
  document.querySelectorAll('.segmento').forEach(sg => sg.querySelectorAll('button').forEach(b => b.onclick = () => {
    sg.querySelectorAll('button').forEach(x => x.className = x === b ? ('sel' + (b.dataset.v === 'OK' ? '' : ' ruim')) : '');
    estado[sg.dataset.p] = b.dataset.v;
    document.querySelector(`[data-obs="${CSS.escape(sg.dataset.p)}"]`).classList.toggle('oculto', b.dataset.v === 'OK');
  }));
  document.getElementById('ant').onclick = () => telaSaidas();
  document.getElementById('ok').onclick = () => executar(async () => {
    const valor = /colaborador/i.test(abast) ? Number(document.getElementById('valor').value.replace(/\./g, '').replace(',', '.')) || 0 : 0;
    if (/colaborador/i.test(abast) && !valor) throw new Error('Informe quanto você pagou no abastecimento.');
    const horario = lerHorario('hRet');
    const problemas = Object.keys(estado).filter(p => estado[p] !== 'OK').map(p => ({ pat: p, situacao: estado[p], obs: document.querySelector(`[data-obs="${CSS.escape(p)}"]`).value }));
    const geo = await localizacao();
    const r = await api('registrarRetorno', { horario, n: s.n, abastecimento: abast, valor, foto: fotoCupom, problemas, obs: document.getElementById('obs').value, geo });
    telaFeito('Retorno registrado', `${s.destino} · retorno às ${hora(r.quando)}`, r.semLocalizacao, r.tardio);
  });
}

        <h2>Fora da base</h2>
        ${r.semRetorno.length ? r.semRetorno.map(s => `<div class="cartao"><div class="t">${esc(s.colaborador)} em ${esc(s.destino)}</div>
          <p class="suave" style="margin:4px 0 0">Saiu ${esc(s.saida)} · ${esc(s.veiculo)}${s.itens.length ? ' · ' + s.itens.length + (s.itens.length === 1 ? ' item' : ' itens') : ''}</p>
          ${s.atrasada ? '<span class="selo-txt vermelho">Sem retorno desde outro dia</span>' : ''}${s.tardio ? `<span class="selo-txt laranja">Saída lançada depois (às ${esc(hora(s.lancadoEm))})</span>` : ''}</div>`).join('') : msg('info', 'Ninguém fora agora.')}
        <h2>Lançados depois (últimos 30 dias)</h2>

// ---------- utilidades novas ----------
const reais = v => 'R$ ' + Number(v || 0).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const numBR = v => Number(String(v || '').replace(/\./g, '').replace(',', '.')) || 0;
const hojeISO = () => agoraLocal().slice(0, 10);
const distTxt = m => m == null || m === '' ? '' : m < 1000 ? `${Math.round(m)} m` : `${(m / 1000).toFixed(1).replace('.', ',')} km`;
function distanciaM(a, b) {
  const R = 6371000, rad = x => x * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
/** Foto do celular reduzida para no máximo `max` px (JPEG), em dataURL. */
function comprimir(arquivo, max = 1280, q = 0.72) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(arquivo);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Não foi possível ler a foto.')); };
    img.src = url;
  });
}

// ---------- nome de cliente: mesmo padrão do servidor ----------
const chaveCliente = n => String(n || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
  .replace(/[^a-z0-9 ]/g, ' ').replace(/\b(ltda|me|epp|eireli|s ?a|cia|industria e comercio|ind e com)\b/g, ' ').replace(/\s+/g, ' ').trim();
function padronizarCliente(n) {
  const minus = ['de', 'da', 'do', 'das', 'dos', 'e'];
  const s = String(n || '').trim().replace(/\s+/g, ' ').replace(/[\s,.-]+(ltda|me|epp|eireli|s\.?\/?a)\.?$/i, '').trim();
  return s.split(' ').map((w, i) => {
    if (/^[A-Z0-9]{2,4}$/.test(w)) return w;
    const l = w.toLowerCase();
    if (i > 0 && minus.includes(l)) return l;
    return l.charAt(0).toUpperCase() + l.slice(1);
  }).join(' ');
}
const padronizarCidade = c => padronizarCliente(c).replace(/[\s/-]+([a-z]{2})$/i, (_, uf) => '-' + uf.toUpperCase());
function distEdicao(a, b) {
  const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[m][n];
}
/** Clientes cadastrados parecidos com o que foi digitado. */
function parecidos(digitado, lista) {
  const k = chaveCliente(digitado);
  if (k.length < 3) return [];
  return lista.filter(c => {
    const kc = chaveCliente(c.nome);
    return kc === k || kc.includes(k) || k.includes(kc) || distEdicao(k, kc) <= Math.max(1, Math.floor(k.length / 6)) ||
      (() => { const a = k.split(' ')[0], b = kc.split(' ')[0]; return a.length >= 4 && b.length >= 4 && (a === b || (Math.min(a.length, b.length) >= 5 && distEdicao(a, b) <= 1)); })();
  });
}

function fluxoOS(pre) {
  topo('Ordem de serviço');
  const d = est.dados;
  const f = Object.assign({ cliente: '', local: '', solicitante: '', tipo: '', data: hojeISO(), inicio: '', fim: '', tecnicos: [est.usuario.nome],
    solicitacao: '', executado: '', materiais: [], pendencias: '', emails: null, extra: '', assinante: '', cargo: '' }, pre || {});
  if (f.data && /\//.test(f.data)) { const m = f.data.match(/(\d{2})\/(\d{2})\/(\d{4})/); f.data = m ? `${m[3]}-${m[2]}-${m[1]}` : hojeISO(); }
  const fotos = []; let assinatura = null, tracos = 0;
  const passos = ['Atendimento', 'Serviço', 'Fotos', 'Assinatura'];
  let p = 0;
  const salvarRascunho = () => { const { ...x } = f; guardar('kc_os_rascunho', JSON.stringify(x)); };
  const cab = () => `<div class="passos">${passos.map((_, i) => `<i class="${i < p ? 'feito' : i === p ? 'atual' : ''}"></i>`).join('')}</div><div class="passo-nome">Passo ${p + 1} de ${passos.length} · ${passos[p]}</div><div id="erro"></div>`;
  const rodape = txt => {
    barra(`<div class="dentro"><button class="acao voltar" id="ant" type="button" aria-label="Voltar">${ic('voltar')}</button><button class="acao" id="prox" type="button">${txt}</button></div>`);
    document.getElementById('ant').onclick = () => { ler(); if (p === 0) telaOS(); else { p--; desenhar(); } };
    document.getElementById('prox').onclick = () => { ler(); try { validar(); } catch (e) { return erroTela(e.message); } if (p < 3) { p++; desenhar(); } else finalizar(); };
  };
  const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
  function ler() {
    if (p === 0) { f.local = val('oLocal'); f.solicitante = val('oSol'); f.data = val('oData'); f.inicio = val('oIni'); f.fim = val('oFim'); }
    if (p === 1) {
      f.solicitacao = val('oSolic'); f.executado = val('oExec'); f.pendencias = val('oPend');
      f.materiais = [...document.querySelectorAll('.mat')].map(r => ({ qtd: r.querySelector('[data-q]').value.trim(), desc: r.querySelector('[data-d]').value.trim() })).filter(m => m.desc);
    }
    if (p === 3) { f.assinante = val('oAss'); f.cargo = val('oCargo'); f.extra = val('oExtra'); f.emails = [...document.querySelectorAll('#oMails input:checked')].map(x => x.value); }
    salvarRascunho();
  }
  function validar() {
    if (p === 0 && !f.cliente) throw new Error('Escolha o cliente.');
    if (p === 0 && !f.tipo) throw new Error('Escolha o tipo de serviço.');
    if (p === 0 && f.inicio && f.fim && f.fim < f.inicio) throw new Error('O término está antes do início. Confira os horários.');
    if (p === 1 && !f.executado) throw new Error('Descreva o serviço executado.');
  }
  function desenhar() {
    window.scrollTo(0, 0);
    if (p === 0) {
      $app.innerHTML = `${cab()}<h1>Atendimento</h1>
        <label class="rotulo">Cliente</label><select class="campo-txt" id="oCli"><option value="">Escolha…</option>${d.clientesInfo.map(c => `<option ${c.nome === f.cliente ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}</select>
        <label class="rotulo" for="oLocal">Local / setor / equipamento</label><input class="campo-txt" id="oLocal" value="${esc(f.local)}" placeholder="Ex.: Prensa 2, quadro geral">
        <label class="rotulo" for="oSol">Quem solicitou</label><input class="campo-txt" id="oSol" value="${esc(f.solicitante)}">
        <label class="rotulo">Tipo de serviço</label>${chips('oTipo', d.tiposOS, f.tipo)}
        <label class="rotulo" for="oData">Data</label><input class="campo-txt" id="oData" type="date" max="${hojeISO()}" value="${esc(f.data)}">
        <div class="grade" style="margin-top:0"><div><label class="rotulo" for="oIni">Início</label><input class="campo-txt" id="oIni" type="time" value="${esc(f.inicio)}"></div>
        <div><label class="rotulo" for="oFim">Término</label><input class="campo-txt" id="oFim" type="time" value="${esc(f.fim)}"></div></div>
        <label class="rotulo">Técnicos da Kiton</label>${chips('oTec', d.colaboradores, '')}`;
      document.getElementById('oCli').onchange = e => { f.cliente = e.target.value; f.emails = null; };
      ligarChips('oTipo', v => f.tipo = v);
      document.querySelectorAll('#oTec .pessoa').forEach(b => b.classList.toggle('sel', f.tecnicos.includes(b.dataset.v)));
      ligarChips('oTec', (v, on) => { f.tecnicos = on ? [...new Set([...f.tecnicos, v])] : f.tecnicos.filter(x => x !== v); }, true);
      rodape('Continuar');
    } else if (p === 1) {
      const linhaMat = (m = {}) => `<div class="mat grade" style="grid-template-columns:76px 1fr 44px;margin-bottom:8px"><input class="campo-txt" data-q placeholder="Qtd." value="${esc(m.qtd || '')}"><input class="campo-txt" data-d placeholder="Material" value="${esc(m.desc || '')}"><button type="button" class="acao leve" data-x style="margin:0;min-height:0;padding:0" aria-label="Remover">×</button></div>`;
      $app.innerHTML = `${cab()}<h1>Serviço</h1>
        <label class="rotulo" for="oSolic">Solicitação / problema relatado</label><textarea class="campo-txt" id="oSolic">${esc(f.solicitacao)}</textarea>
        <label class="rotulo" for="oExec">Serviço executado</label><textarea class="campo-txt" id="oExec" style="min-height:130px">${esc(f.executado)}</textarea>
        <label class="rotulo">Materiais utilizados</label><div id="mats">${(f.materiais.length ? f.materiais : [{}]).map(linhaMat).join('')}</div>
        <button type="button" class="link" id="addMat">+ Adicionar material</button>
        <label class="rotulo" for="oPend">Pendências e recomendações</label><textarea class="campo-txt" id="oPend">${esc(f.pendencias)}</textarea>`;
      const ligarX = () => document.querySelectorAll('[data-x]').forEach(b => b.onclick = () => b.closest('.mat').remove());
      document.getElementById('addMat').onclick = () => { document.getElementById('mats').insertAdjacentHTML('beforeend', linhaMat()); ligarX(); };
      ligarX();
      rodape('Continuar');
    } else if (p === 2) {
      $app.innerHTML = `${cab()}<h1>Fotos (opcional)</h1><p class="suave">Até 6 fotos do serviço. Elas entram no PDF da OS.</p>
        <div class="fotos" id="fotos"></div>
        <label class="acao leve" for="oFoto" style="cursor:pointer">${ic('ok')} Tirar ou escolher foto</label>
        <input id="oFoto" type="file" accept="image/*" capture="environment" multiple class="oculto">`;
      const pintarFotos = () => {
        document.getElementById('fotos').innerHTML = fotos.map((x, i) => `<div class="foto"><img src="${x}" alt="Foto ${i + 1}"><button type="button" data-rm="${i}" aria-label="Remover foto">×</button></div>`).join('');
        document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { fotos.splice(+b.dataset.rm, 1); pintarFotos(); });
      };
      document.getElementById('oFoto').onchange = e => executar(async () => {
        for (const a of [...e.target.files]) { if (fotos.length >= 6) break; fotos.push(await comprimir(a, 1100, 0.7)); }
        e.target.value = ''; pintarFotos();
      });
      pintarFotos();
      rodape('Continuar');
    } else {
      const cli = d.clientesInfo.find(c => c.nome === f.cliente) || { emails: [] };
      if (!f.emails) f.emails = cli.emails.slice();
      $app.innerHTML = `${cab()}<h1>Assinatura do cliente</h1>
        <dl class="resumo">
          <div><dt>Cliente</dt><dd>${esc(f.cliente)}${f.local ? '<br>' + esc(f.local) : ''}</dd></div>
          <div><dt>Serviço</dt><dd>${esc(f.tipo)} · ${esc(f.data.split('-').reverse().join('/'))}${f.inicio ? ' · ' + esc(f.inicio) + (f.fim ? ' às ' + esc(f.fim) : '') : ''}</dd></div>
          <div><dt>Executado</dt><dd style="font-weight:400;text-align:left">${esc(f.executado).replace(/\n/g, '<br>')}</dd></div>
          ${f.materiais.length ? `<div><dt>Materiais</dt><dd>${f.materiais.map(m => esc((m.qtd ? m.qtd + ' x ' : '') + m.desc)).join('<br>')}</dd></div>` : ''}
          ${fotos.length ? `<div><dt>Fotos</dt><dd>${fotos.length}</dd></div>` : ''}
        </dl>
        <label class="rotulo">Assine no quadro abaixo</label>
        <div class="assin"><canvas id="cv"></canvas><button type="button" class="link" id="limpar">Limpar</button></div>
        <label class="rotulo" for="oAss">Nome de quem assinou</label><input class="campo-txt" id="oAss" value="${esc(f.assinante)}" autocomplete="off">
        <label class="rotulo" for="oCargo">Cargo / setor (opcional)</label><input class="campo-txt" id="oCargo" value="${esc(f.cargo)}">
        <label class="rotulo">Enviar a OS para</label>
        <div id="oMails">${cli.emails.map(e => `<label class="linha" style="font-weight:500"><input type="checkbox" value="${esc(e)}" ${f.emails.includes(e) ? 'checked' : ''} style="width:22px;height:22px"> ${esc(e)}</label>`).join('') || '<p class="suave">Este cliente não tem e-mail cadastrado.</p>'}</div>
        <input class="campo-txt" id="oExtra" type="email" inputmode="email" placeholder="Outro e-mail (opcional)" value="${esc(f.extra)}">
        <p class="suave" style="margin-top:8px">A Kiton (contato@) sempre recebe uma cópia.</p>`;
      montarAssinatura(document.getElementById('cv'), (url, n) => { assinatura = url; tracos = n; });
      document.getElementById('limpar').onclick = () => { montarAssinatura(document.getElementById('cv'), (url, n) => { assinatura = url; tracos = n; }); assinatura = null; tracos = 0; };
      rodape(`${ic('ok')} Finalizar e enviar`);
    }
  }
  function finalizar() {
    executar(async () => {
      if (!assinatura || tracos < 1) throw new Error('Peça para o cliente assinar no quadro.');
      if (!f.assinante) throw new Error('Informe o nome de quem assinou.');
      const emails = [...f.emails, f.extra].filter(Boolean);
      if (emails.length > 3) throw new Error('No máximo 3 e-mails do cliente.');
      const geo = await localizacao();
      const r = await api('salvarOS', { ...f, emails, fotos, assinatura, geo });
      guardar('kc_os_rascunho', null);
      barra(`<div class="dentro"><button class="acao preta" id="fim" type="button">Voltar ao início</button></div>`);
      $app.innerHTML = `<div class="feito-tela"><div class="selo">${ic('ok')}</div><h1>OS ${esc(r.numero)} registrada</h1>
        <p class="suave">${esc(f.cliente)} · assinada por ${esc(f.assinante)}</p>
        ${r.enviada ? msg('ok', `Enviada para ${r.emails.length ? r.emails.join(', ') + ' e ' : ''}contato@kitonengenharia.com.br.`) : msg('erro', 'A OS foi salva, mas o e-mail não saiu. Em "Ordem de serviço" dá para tentar enviar de novo.')}

      document.getElementById('fim').onclick = () => carregarInicio();
    });
  }
  desenhar();
}

/** Quadro de assinatura com dedo ou caneta. Devolve PNG com fundo branco. */
function montarAssinatura(cv, aoMudar) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  const g = cv.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
  g.lineWidth = 2.4 * dpr; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#0B2A6F';
  let desenhando = false, n = 0, ult = null;
  const pos = e => { const b = cv.getBoundingClientRect(); return { x: (e.clientX - b.left) * dpr, y: (e.clientY - b.top) * dpr }; };
  cv.onpointerdown = e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); desenhando = true; ult = pos(e); g.beginPath(); g.moveTo(ult.x, ult.y); };
  cv.onpointermove = e => { if (!desenhando) return; const q = pos(e); g.lineTo(q.x, q.y); g.stroke(); ult = q; };
  const fim = () => { if (!desenhando) return; desenhando = false; n++; aoMudar(cv.toDataURL('image/png'), n); };
  cv.onpointerup = fim; cv.onpointercancel = fim; cv.onpointerleave = fim;
}

    <label class="rotulo" for="nSerie">Nº de série</label><input class="campo-txt" id="nSerie">
    <label class="rotulo">Estado</label>${chips('nEst', info.estados, 'N')}<p class="suave" style="margin-top:6px">${esc(info.legendaEstado.join(' · '))}</p>
    <label class="rotulo" for="nValor">Valor de reposição (R$)</label><input class="campo-txt" id="nValor" inputmode="decimal" placeholder="0,00">
    <label class="rotulo" for="nLocal">Local de guarda</label><input class="campo-txt" id="nLocal" list="locais"><datalist id="locais">${info.locais.map(x => `<option value="${esc(x)}">`).join('')}</datalist>
    ${info.kits.length ? `<label class="rotulo" for="nKit">Faz parte de um kit?</label><select class="campo-txt" id="nKit"><option value="">Não</option>${info.kits.map(k => `<option value="${esc(k.pat)}">${esc(k.pat)} · ${esc(k.desc)}</option>`).join('')}</select>` : ''}
    <div id="boxPer" class="oculto"><label class="rotulo">Periodicidade da calibração</label>${chips('nPer', info.periodicidades, '')}</div>
    <label class="rotulo" for="nObs">Observação (opcional)</label><textarea class="campo-txt" id="nObs"></textarea>`;
  const prox = () => {
    const pf = (document.getElementById('nFam').value + '-' + document.getElementById('nTip').value).toUpperCase();
    const el = document.getElementById('nProx');
    if (/^[A-Z]{3}-[A-Z]{3}$/.test(pf)) {
      const n = (info.ultimos[pf] || 0) + 1, q = Math.max(1, Number(document.getElementById('nQtd').value) || 1);
      el.innerHTML = `Próximo código: <b>${pf}-${String(n).padStart(3, '0')}</b>${q > 1 ? ` até <b>${pf}-${String(n + q - 1).padStart(3, '0')}</b>` : ''}${info.ultimos[pf] ? '' : ' (código novo)'}`;
    } else el.textContent = 'Use 3 letras para a família e 3 para o tipo. Ex.: ESC-FIB.';
  };
  const marcarTipo = t => { f.tipo = t; document.querySelectorAll('#nTipo .pessoa').forEach(b => b.classList.toggle('sel', b.dataset.v === t)); document.getElementById('boxPer').classList.toggle('oculto', t !== 'Instrumento'); };
  document.getElementById('nGrupo').onchange = e => {
    const v = e.target.value;
    document.getElementById('nGrupoNovo').classList.toggle('oculto', v !== '__novo');
    const g = info.grupos.find(x => x.grupo === v);
    if (g) {
      f.grupo = g.grupo; const [a, b] = (g.prefixos[0] || '-').split('-');
      document.getElementById('nFam').value = a || ''; document.getElementById('nTip').value = b || '';
      if (!document.getElementById('nDesc').value) document.getElementById('nDesc').value = g.desc;
      if (g.tipo) marcarTipo(g.tipo);
    } else f.grupo = '';
    prox();
  };
  ['nFam', 'nTip', 'nQtd'].forEach(id => document.getElementById(id).oninput = prox);
  ligarChips('nTipo', marcarTipo);
  ligarChips('nUso', v => { f.uso = v; document.getElementById('boxResp').classList.toggle('oculto', v !== 'Individual'); });
  ligarChips('nEst', v => f.estado = v);
  ligarChips('nPer', v => f.periodicidade = v);
  document.getElementById('ok').onclick = () => executar(async () => {
    const grupo = document.getElementById('nGrupo').value === '__novo' ? document.getElementById('nGrupoNovo').value.trim() : f.grupo;
    if (!grupo) throw new Error('Escolha o grupo ou crie um novo.');
    if (!f.tipo) throw new Error('Escolha o tipo.');
    const kit = document.getElementById('nKit');
    const r = await api('novoItem', {
      grupo, tipo: f.tipo, prefixo: (document.getElementById('nFam').value + '-' + document.getElementById('nTip').value).toUpperCase(),
      descricao: document.getElementById('nDesc').value, quantidade: document.getElementById('nQtd').value, ident: document.getElementById('nIdent').value,
      uso: f.uso, responsavel: document.getElementById('nResp').value, marca: document.getElementById('nMarca').value, serie: document.getElementById('nSerie').value,
      estado: f.estado, valor: numBR(document.getElementById('nValor').value), local: document.getElementById('nLocal').value,
      kit: kit ? kit.value : '', periodicidade: f.tipo === 'Instrumento' ? f.periodicidade : '', obs: document.getElementById('nObs').value
    });
    barra(`<div class="dentro"><button class="acao leve" id="fim" type="button">Cadastros</button><button class="acao" id="outro" type="button">Cadastrar outro</button></div>`);
    $app.innerHTML = `<div class="feito-tela"><div class="selo">${ic('ok')}</div><h1>${r.criados.length === 1 ? 'Item cadastrado' : r.criados.length + ' itens cadastrados'}</h1>
      <p class="suave">${r.criados.map(esc).join(', ')}</p>${msg('info', 'Escreva o código na etiqueta e cole na peça.')}</div>`;
    document.getElementById('fim').onclick = telaCadastros;
    document.getElementById('outro').onclick = telaNovoItem;
  });
}

// ---------- administração: despesas e presença ----------
async function adminDespesas(box) {
  await executar(async () => {
    const r = await api('despesasPendentes');
    box.innerHTML = `<h1>Despesas para conferir</h1>` + (r.lista.length ? r.lista.map(x => `<div class="cartao" data-n="${esc(x.n)}">
      <div class="t">${esc(x.colaborador)} · ${reais(x.valor)}</div>
      <p class="suave" style="margin:2px 0 6px">${esc(x.data)} · ${esc(x.categoria)}${x.cliente ? ' · ' + esc(x.cliente) : ''}<br>${esc(/reembolso/i.test(x.pagamento) ? 'Reembolso ao colaborador' : 'Pago pela Kiton')}${x.saida ? ' · saída nº ' + esc(x.saida) : ''}${x.descricao ? '<br>' + esc(x.descricao) : ''}</p>
      ${/^http/.test(x.comprovante) ? `<a class="link" href="${esc(x.comprovante)}" target="_blank" rel="noopener">Ver comprovante</a>` : '<span class="selo-txt amarelo">Sem comprovante</span>'}
      <div class="segmento" style="margin-top:10px"><button type="button" data-v="Aprovada">Aprovar</button><button type="button" data-v="Recusada">Recusar</button></div></div>`).join('') : msg('info', 'Nenhuma despesa aguardando conferência.'));
    box.querySelectorAll('[data-n]').forEach(c => c.querySelectorAll('[data-v]').forEach(b => b.onclick = () => executar(async () => {
      let motivo = '';
      if (b.dataset.v === 'Recusada') { motivo = prompt('Motivo da recusa (o colaborador vai ver):') || ''; if (!motivo.trim()) return; }
      await api('conferirDespesa', { n: c.dataset.n, resultado: b.dataset.v, motivo }); adminDespesas(box);
    })));
  });
}

async function adminClientes(box) {
  await executar(async () => {
    const r = await api('clientesNovos');
    if (est.dados.pendencias) est.dados.pendencias.clientes = r.novos.length;
    const usoTxt = u => [u['Check-ins'] ? u['Check-ins'] + ' check-in(s)' : '', u['Ordens de serviço'] ? u['Ordens de serviço'] + ' OS' : '', u['Despesas'] ? u['Despesas'] + ' despesa(s)' : '', u['Saídas'] ? u['Saídas'] + ' saída(s)' : ''].filter(Boolean).join(', ') || 'nenhum lançamento';
    box.innerHTML = `<h1>Novos clientes cadastrados</h1><p class="suave">Cadastrados pelos colaboradores em campo. Aceite (corrigindo o que precisar) ou junte com um cliente que já existe.</p>` +
      (r.novos.length ? r.novos.map((c, i) => {
        const par = parecidos(c.nome, r.outros);
        return `<div class="cartao" data-i="${i}"><div class="t">${esc(c.nome)}</div>
        <p class="suave" style="margin:2px 0 6px">${esc(c.cidade)} · ${esc(c.por)}<br>Usado em: ${esc(usoTxt(c.usos))}</p>
        ${c.lat ? `<a class="link" href="https://maps.google.com/?q=${esc(c.lat)},${esc(c.lng)}" target="_blank" rel="noopener">Ver no mapa</a>` : '<span class="selo-txt amarelo">Sem localização</span>'}
        ${par.length ? `<p style="margin:8px 0 0"><span class="selo-txt laranja">Parecido com: ${esc(par.map(x => x.nome).join(', '))}</span></p>` : ''}
        <div class="segmento" style="margin-top:10px"><button type="button" data-a="aceitar">Aceitar / corrigir</button><button type="button" data-a="juntar">É o mesmo que…</button></div>
        <div class="oculto" data-f="aceitar">
          <label class="rotulo">Nome</label><input class="campo-txt" data-k="novoNome" value="${esc(c.nome)}">
          <label class="rotulo">Cidade</label><input class="campo-txt" data-k="cidade" value="${esc(c.cidade)}">
          <label class="rotulo">Endereço</label><input class="campo-txt" data-k="endereco" value="${esc(c.endereco)}">
          <label class="rotulo">E-mails para a OS (até 3)</label>
          ${[0, 1, 2].map(j => `<input class="campo-txt" data-e="${j}" type="email" value="${esc(c.emails[j] || '')}" style="margin-bottom:6px">`).join('')}
          <label class="rotulo">Raio do check-in (m)</label><input class="campo-txt" data-k="raio" inputmode="numeric" value="${esc(c.raio)}">
          <button type="button" class="acao" data-ok="aceitar">Salvar e aceitar</button></div>
        <div class="oculto" data-f="juntar">
          <label class="rotulo">Cliente certo</label><select class="campo-txt" data-k="destino"><option value="">Escolha…</option>
            ${par.map(x => `<option value="${esc(x.nome)}">${esc(x.nome)} (parecido)</option>`).join('')}${r.outros.filter(x => !par.includes(x)).map(x => `<option value="${esc(x.nome)}">${esc(x.nome)}</option>`).join('')}</select>
          <p class="suave" style="margin-top:6px">Os lançamentos passam para o cliente escolhido e este cadastro é apagado.</p>
          <button type="button" class="acao" data-ok="juntar">Juntar</button></div></div>`;
      }).join('') : msg('info', 'Nenhum cliente novo aguardando aceite.'));
    box.querySelectorAll('[data-i]').forEach(card => {
      const c = r.novos[+card.dataset.i];
      card.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
        card.querySelectorAll('[data-a]').forEach(x => x.className = x === b ? 'sel' : '');
        card.querySelectorAll('[data-f]').forEach(f => f.classList.toggle('oculto', f.dataset.f !== b.dataset.a));
      });
      const v = k => card.querySelector(`[data-k="${k}"]`).value.trim();
      card.querySelector('[data-ok="aceitar"]').onclick = () => executar(async () => {
        const x = await api('aceitarCliente', { nome: c.nome, novoNome: v('novoNome'), cidade: v('cidade'), endereco: v('endereco'), raio: v('raio'),
          emails: [...card.querySelectorAll('[data-e]')].map(e => e.value.trim()) });
        await adminClientes(box);
        document.getElementById('erro').innerHTML = msg('ok', `${x.nome} aceito.${x.alterados ? ` ${x.alterados} lançamento(s) passaram a usar o nome novo.` : ''}`);
      });
      card.querySelector('[data-ok="juntar"]').onclick = () => executar(async () => {
        const destino = v('destino');
        if (!destino) throw new Error('Escolha o cliente certo.');
        if (!confirm(`Juntar "${c.nome}" com "${destino}"? Os lançamentos passam para ${destino} e o cadastro "${c.nome}" é apagado.`)) return;
        const x = await api('juntarCliente', { nome: c.nome, destino });
        await adminClientes(box);
        document.getElementById('erro').innerHTML = msg('ok', `Juntado com ${x.destino}: ${x.alterados} lançamento(s) atualizados.`);
      });
    });
  });
}

async function adminPresenca(box) {
  const h = new Date(), mes = `${h.getFullYear()}-${String(h.getMonth() + 1).padStart(2, '0')}`;
  box.innerHTML = `<h1>Presença em obra</h1><input class="campo-txt" id="mesP" type="month" value="${mes}"><div id="pres" style="margin-top:12px"></div>`;
  const carregar = () => executar(async () => {
    const r = await api('presenca', { mes: document.getElementById('mesP').value });
    const pessoas = {};
    r.visitas.forEach(v => {
      const p = pessoas[v.colaborador] || (pessoas[v.colaborador] = { dias: new Set(), horas: 0, fora: 0, n: 0, aberto: 0 });
      p.n++; p.dias.add(v.chegada.slice(0, 10)); p.horas += Number(v.horas) || 0; if (v.situacao === 'Fora do raio') p.fora++; if (!v.saida) p.aberto++;
    });
    const selo = s => s === 'No local' ? 'verde' : s === 'Fora do raio' || s === 'Cliente novo' ? 'laranja' : 'amarelo';
    document.getElementById('pres').innerHTML = (Object.keys(pessoas).length ? `<div class="cartao"><table><thead><tr><th>Colaborador</th><th class="n">Dias</th><th class="n">Horas</th><th class="n">Fora</th></tr></thead><tbody>
        ${Object.keys(pessoas).sort().map(k => `<tr><td>${esc(k)}</td><td class="n">${pessoas[k].dias.size}</td><td class="n">${pessoas[k].horas.toFixed(1).replace('.', ',')}</td><td class="n">${pessoas[k].fora ? `<span class="selo-txt laranja">${pessoas[k].fora}</span>` : '0'}</td></tr>`).join('')}
      </tbody></table></div>` : msg('info', 'Nenhum check-in neste mês.')) +
      (r.semLocal.length ? `<p class="suave">Clientes sem localização: ${esc(r.semLocal.join(', '))}. Use o botão “Usar como local do cliente” num check-in feito lá.</p>` : '') +
      (r.visitas.length ? `<h2>Check-ins</h2>` + r.visitas.map(v => `<div class="cartao ${v.tardio ? 'tardio' : ''}"><div class="t">${esc(v.colaborador)} · ${esc(v.cliente)}</div>
        <p class="suave" style="margin:2px 0 6px">${esc(v.chegada)}${v.saida ? ' às ' + esc(hora(v.saida)) + ' · ' + String(v.horas).replace('.', ',') + ' h' : ' · <b>sem saída registrada</b>'}${v.obs ? '<br>' + esc(v.obs) : ''}</p>
        <span class="selo-txt ${selo(v.situacao)}">${esc(v.situacao)}${v.dist !== '' && v.dist != null && v.situacao !== 'No local' ? ' · ' + distTxt(v.dist) : ''}</span>${v.tardio ? `<span class="selo-txt laranja">${esc(v.tardio)} lançada depois</span>` : ''}
        ${/^http/.test(v.mapa) ? `<a class="link" href="${esc(v.mapa)}" target="_blank" rel="noopener">Mapa</a>` : ''}
        ${v.situacao === 'Cliente sem localização' && v.lat !== '' ? ` · <button type="button" class="link" data-loc="${esc(v.n)}">Usar como local do cliente</button>` : ''}</div>`).join('') : '');
    document.querySelectorAll('[data-loc]').forEach(b => b.onclick = () => executar(async () => {
      if (!confirm('Usar a posição deste check-in como endereço do cliente? Os próximos check-ins serão comparados com ela.')) return;
      const x = await api('definirLocalCliente', { n: b.dataset.loc }); erroTela(''); document.getElementById('erro').innerHTML = msg('ok', `Localização de ${x.cliente} definida.`); carregar();
    }));
  });
  document.getElementById('mesP').onchange = carregar; carregar();
}

// ---------- partida ----------
est.token = lerLocal('kc_token');
est.token ? carregarInicio() : telaLogin();
</script>
