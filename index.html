<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Kiton Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo-redondo.png?v=2">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --vermelho:#CD0000; --vermelho-esc:#A30000; --amarelo:#FFAF1F; --amarelo-claro:#FFF3DA;
  --preto:#000; --aco:#E6E9ED; --aco-esc:#C7CCD3; --texto:#1C1F23; --cinza:#5D6670;
  --verde:#1F8A4C; --verde-claro:#E2F3E8; --branco:#fff;
  --tit:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --corpo:"Barlow",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--aco);color:var(--texto);font:17px/1.4 var(--corpo);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--amarelo);outline-offset:2px}
.topo{position:sticky;top:0;z-index:10;background:var(--preto);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.topo img{width:38px;height:38px;border-radius:50%;background:#fff}
.topo .ajuda{background:#1E2227;border-radius:10px;width:40px;height:40px;display:grid;place-items:center;color:#25D366}
.rodape{margin:28px 0 0;text-align:center;font-size:12.5px;line-height:1.5;color:var(--cinza)}
.rodape b{font-weight:600;color:var(--texto)}
.ir-inicio{all:unset;display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
.ir-inicio:focus-visible{outline:3px solid var(--amarelo);outline-offset:2px;border-radius:8px}
.topo .marca{font:700 19px/1 var(--tit);letter-spacing:.2px;flex:1}
.topo .marca span{display:block;font:500 13px/1.3 var(--corpo);color:#B9C0C8;letter-spacing:0}
.topo .icone-btn{background:#1E2227;border:0;border-radius:10px;width:40px;height:40px;display:grid;place-items:center}
.faixa{height:4px;background:var(--vermelho)}
main{max-width:560px;margin:0 auto;padding:18px 16px 120px}
h1{font:700 26px/1.15 var(--tit);margin:4px 0 14px}
h2{font:700 20px/1.2 var(--tit);margin:22px 0 10px}
p{margin:0 0 10px}
.suave{color:var(--cinza);font-size:15px}
svg.i{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Etiqueta de status: o elemento principal da tela inicial */
.etiqueta{position:relative;background:var(--branco);border-radius:16px;padding:18px 18px 20px 26px;overflow:hidden;box-shadow:0 1px 0 var(--aco-esc)}
.etiqueta::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--preto)}
.etiqueta.campo::before{background:repeating-linear-gradient(-45deg,var(--amarelo) 0 12px,var(--preto) 12px 24px)}
.etiqueta .furo{position:absolute;right:18px;top:18px;width:18px;height:18px;border-radius:50%;border:3px solid var(--aco-esc);background:var(--aco)}
.etiqueta .estado{font:700 15px/1 var(--tit);display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:var(--aco);color:var(--texto)}
.etiqueta.campo .estado{background:var(--amarelo);color:#000}
.etiqueta .onde{font:700 30px/1.08 var(--tit);margin:12px 0 6px;padding-right:30px}
.etiqueta .det{color:var(--cinza);font-size:16px}
.etiqueta .det b{color:var(--texto);font-weight:600}

.acao{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:14px;padding:18px;font:700 20px/1 var(--tit);background:var(--vermelho);color:#fff;margin-top:16px;min-height:62px}
.acao:active{background:var(--vermelho-esc)}
.acao.leve{background:var(--branco);color:var(--texto);border:2px solid var(--aco-esc)}
.acao.preta{background:var(--preto)}
.acao:disabled{opacity:.45}
.acao svg.i{width:24px;height:24px}

.modulos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modulo{position:relative;background:var(--branco);border:0;border-radius:16px;padding:18px 16px 16px;text-align:left;display:flex;flex-direction:column;gap:12px;min-height:138px}
.modulo .ic-caixa{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--preto);color:#fff}
.modulo .ic-caixa svg.i{width:26px;height:26px}
.modulo b{font:700 19px/1.1 var(--tit)}
.modulo span.d{font-size:14px;color:var(--cinza);line-height:1.3}
.modulo .status{position:absolute;top:14px;right:14px;font:700 13px/1 var(--tit);padding:6px 9px;border-radius:8px;background:var(--aco)}
.modulo .status.campo{background:var(--amarelo);color:#000}
.modulo.principal .ic-caixa{background:var(--vermelho)}
.modulo.breve{opacity:.55}
.modulo.breve .ic-caixa{background:var(--aco-esc);color:var(--texto)}
.secao-titulo{font:700 16px/1.2 var(--tit);color:var(--cinza);margin:22px 0 10px}
.atalhos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.atalho{background:var(--branco);border:0;border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:104px}
.atalho b{font:700 18px/1.1 var(--tit)}
.atalho span{font-size:14px;color:var(--cinza)}
.regra{margin-top:20px;font-size:14px;color:var(--cinza);display:flex;gap:8px}

/* Passos da saída */
.passos{display:flex;gap:6px;margin:2px 0 6px}
.passos i{flex:1;height:6px;border-radius:3px;background:var(--aco-esc)}
.passos i.feito{background:var(--preto)}
.passos i.atual{background:var(--vermelho)}
.passo-nome{font-size:14px;color:var(--cinza);margin-bottom:6px}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opcao{background:var(--branco);border:2px solid transparent;border-radius:14px;padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:96px;font-weight:600;font-size:16px;line-height:1.2}
.opcao.larga{width:100%;grid-column:1/-1;flex-direction:row;align-items:center;min-height:64px}
.opcao.sel{border-color:var(--preto);box-shadow:inset 0 0 0 1px var(--preto)}
.opcao.sel svg.i{color:var(--vermelho)}
.linha{display:flex;align-items:center;gap:12px;width:100%;background:var(--branco);border:0;border-radius:12px;padding:14px;margin-bottom:8px;text-align:left;font-weight:600;min-height:56px}
a.linha{color:inherit;text-decoration:none}
.linha small{display:block;font-weight:400;color:var(--cinza);font-size:14px}
.linha .fim{margin-left:auto;color:var(--cinza)}
.linha.sel{box-shadow:inset 0 0 0 2px var(--preto)}
.campo-txt{width:100%;font:inherit;padding:14px;border:2px solid var(--aco-esc);border-radius:12px;background:#fff;color:var(--texto)}
.campo-txt:focus{border-color:var(--preto);outline:none}
textarea.campo-txt{min-height:84px;resize:vertical}
.rotulo{font-weight:600;margin:16px 0 8px;display:block}

.pessoas{display:flex;flex-wrap:wrap;gap:8px}
.pessoa{border:2px solid var(--aco-esc);background:#fff;border-radius:999px;padding:10px 14px;font-weight:500}
.pessoa.sel{background:var(--preto);border-color:var(--preto);color:#fff}

/* Itens */
.busca{position:sticky;top:64px;z-index:5;background:var(--aco);padding:6px 0 10px}
.grupo{font:700 16px/1.2 var(--tit);color:var(--cinza);margin:16px 0 8px}
.item{display:flex;gap:12px;align-items:center;background:var(--branco);border-radius:12px;padding:12px 14px;margin-bottom:8px;width:100%;border:2px solid transparent;text-align:left}
.item .caixa{width:28px;height:28px;border-radius:8px;border:2px solid var(--aco-esc);display:grid;place-items:center;flex:none}
.item.sel{border-color:var(--preto)}
.item.sel .caixa{background:var(--preto);border-color:var(--preto);color:#fff}
.item .nome{font-weight:600}
.item .sub{font-size:14px;color:var(--cinza)}
.item.ocupado{opacity:.6}
.item.ocupado .caixa{border-style:dashed}
.cal{font-size:12.5px;color:var(--cinza);margin-top:2px}
.cal.ruim{color:var(--vermelho-esc);font-weight:600}
.cal.atencao{color:#8A3B00;font-weight:600}
.subgrupo{background:var(--branco);border-radius:12px;margin-bottom:8px;overflow:hidden}
.sg-cab{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:12px 14px;text-align:left}
.sg-qtd{min-width:32px;height:32px;border-radius:8px;background:var(--aco);display:grid;place-items:center;font:700 15px/1 var(--tit)}
.sg-qtd.tem{background:var(--preto);color:#fff}
.sg-txt{flex:1}.sg-txt .nome{display:block;font-weight:600}.sg-txt .sub{font-size:14px;color:var(--cinza)}
.seta-sg{transition:transform .15s;color:var(--cinza)}
.subgrupo.aberto .seta-sg{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){.seta-sg{transition:none}}
.sg-itens{padding:0 10px 6px;border-top:1px solid var(--aco)}
.item.dentro{margin:6px 0;background:var(--aco);}
.item.dentro.sel{background:#fff}
.pat{display:inline-block;font-size:13px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--aco);margin-left:6px;vertical-align:1px}
.aviso-item{display:inline-block;margin-top:4px;font-size:13px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--amarelo-claro);color:#7A4A00}

/* Barra fixa inferior */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--branco);box-shadow:0 -1px 0 var(--aco-esc);padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.barra .dentro{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.barra .acao{margin:0;flex:1}
.barra .voltar{flex:none;width:62px;padding:0;background:var(--aco);color:var(--texto)}
.contador{font-weight:600;font-size:15px;color:var(--cinza);margin-bottom:8px;max-width:560px;margin-left:auto;margin-right:auto}

/* Resumo e confirmação */
.resumo{background:var(--branco);border-radius:14px;padding:4px 16px}
.resumo div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--aco)}
.resumo div:last-child{border-bottom:0}
.resumo dt{color:var(--cinza)}
.resumo dd{margin:0;font-weight:600;text-align:right}
.feito-tela{text-align:center;padding-top:40px}
.feito-tela .selo{width:96px;height:96px;border-radius:50%;background:var(--verde);color:#fff;display:grid;place-items:center;margin:0 auto 18px;animation:pop .35s ease-out}
.feito-tela .selo svg.i{width:52px;height:52px;stroke-width:2.6}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.feito-tela .selo{animation:none}}

.apr-it{background:var(--branco);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.apr-it p{margin:0 0 8px;font-weight:500;line-height:1.3}
.sna{display:flex;gap:6px}.sna button{flex:1;border:1px solid #C9CFD6;background:#fff;border-radius:9px;padding:9px 4px;font-weight:600;font-size:15px}
.sna button.sel{background:var(--preto);color:#fff;border-color:var(--preto)}.sna.ck button.sel[data-v="Sim"]{background:var(--verde);border-color:var(--verde)}
.sna.ck button.sel[data-v="Não"]{background:var(--vermelho);border-color:var(--vermelho)}
.imp{display:inline-block;font-size:12px;font-weight:700;color:var(--vermelho-esc);background:#FCE4E4;border-radius:5px;padding:0 6px;vertical-align:middle}
.segmento{display:flex;background:var(--aco-esc);border-radius:12px;padding:4px;gap:4px;margin-top:8px}
.segmento button{flex:1;border:0;background:transparent;border-radius:9px;padding:10px 6px;font-weight:600;font-size:15px}
.segmento button.sel{background:#fff}
.segmento button.sel.ruim{background:var(--vermelho);color:#fff}

.cartao{background:var(--branco);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.cartao .t{font-weight:600}
.cal-resumo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cal-qd{background:var(--branco);border:2px solid transparent;border-radius:12px;padding:10px 6px;text-align:center;border-top:5px solid var(--aco-esc)}
.cal-qd b{display:block;font:700 26px/1.1 var(--tit)}
.cal-qd span{display:block;font-size:12.5px;color:var(--cinza);margin-top:2px;line-height:1.2}
.cal-qd.vermelho{border-top-color:var(--vermelho)}.cal-qd.vermelho b{color:var(--vermelho-esc)}
.cal-qd.laranja{border-top-color:#E07800}.cal-qd.laranja b{color:#8A3B00}
.cal-qd.amarelo{border-top-color:var(--amarelo)}
.cal-qd.verde{border-top-color:var(--verde)}.cal-qd.verde b{color:var(--verde)}
.cal-qd.ativo{border-color:var(--preto);border-top-width:5px}
@media (max-width:380px){.cal-resumo{grid-template-columns:repeat(2,1fr)}}
.cal-minis{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.cal-mini{font-size:12px;font-weight:600;padding:1px 7px;border-radius:6px}
.cal-mini.vermelho{background:#FCE4E4;color:var(--vermelho-esc)}
.cal-mini.laranja{background:#FFE2C2;color:#8A3B00}
.cal-mini.amarelo{background:var(--amarelo-claro);color:#7A4A00}
.cal-mini.verde{background:var(--verde-claro);color:var(--verde)}
.sg-qtd.cal-vermelho{background:var(--vermelho);color:#fff}
.sg-qtd.cal-laranja{background:#E07800;color:#fff}
.sg-qtd.cal-amarelo{background:var(--amarelo);color:#000}
.sg-qtd.cal-verde{background:var(--verde);color:#fff}
.link{background:none;border:0;padding:0;color:var(--texto);text-decoration:underline;font:inherit;font-weight:600}
.selo-txt{display:inline-block;font-size:13px;font-weight:600;padding:2px 8px;border-radius:6px;margin-right:6px}
.selo-txt.amarelo{background:var(--amarelo-claro);color:#7A4A00}
.selo-txt.vermelho{background:#FCE4E4;color:var(--vermelho-esc)}
.selo-txt.laranja{background:#FFE2C2;color:#8A3B00}
.cartao.tardio{box-shadow:inset 4px 0 0 #E8730C}
.selo-txt.verde{background:var(--verde-claro);color:var(--verde)}
.menu{position:fixed;inset:0;z-index:50}.menu.oculto{display:none}
.menu-fundo{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.menu-painel{position:absolute;top:0;right:0;bottom:0;width:min(330px,88vw);background:var(--aco);overflow-y:auto;padding:0 0 calc(24px + env(safe-area-inset-bottom));box-shadow:-6px 0 24px rgba(0,0,0,.25)}
.menu-cab{display:flex;align-items:center;justify-content:space-between;background:var(--preto);color:#fff;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));border-bottom:4px solid var(--vermelho);margin-bottom:8px}
.folha-painel{position:absolute;left:0;right:0;bottom:0;top:6vh;max-width:600px;margin:0 auto;background:var(--aco);border-radius:16px 16px 0 0;overflow-y:auto;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.folha-painel .menu-cab{border-radius:16px 16px 0 0;position:sticky;top:0;z-index:1}.folha-corpo{padding:4px 16px}
.apr-lin{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid #EEF0F2;font-size:15px}.apr-lin:last-child{border-bottom:0}.apr-lin .selo-txt{flex:none;margin:0}
.menu-cab .icone-btn{background:#1E2227;border:0;border-radius:10px;width:40px;height:40px;display:grid;place-items:center;color:#fff}
.menu-it{display:flex;align-items:center;gap:12px;width:calc(100% - 20px);margin:0 10px 6px;padding:12px;border:0;border-radius:12px;background:#fff;font-weight:600;font-size:16px;text-align:left;color:inherit;text-decoration:none}
.menu-it span:not(.bolinha):not(.q){flex:1}.menu-it .q{width:26px;height:26px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700}
.menu-sec{margin:14px 20px 8px;font-size:13px;font-weight:700;color:var(--cinza);letter-spacing:.3px}
.abas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.abas button{flex:1 1 auto;border:0;border-radius:12px;padding:12px 12px;background:#fff;font-weight:600;font-size:15px;white-space:nowrap}
.bolinha{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;margin-left:6px;border-radius:10px;background:var(--vermelho);color:#fff;font-size:12px;line-height:1}
.abas button.sel{background:var(--preto);color:#fff}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--aco)}
th{font-size:13px;color:var(--cinza);font-weight:600}
td.n{text-align:right}

.msg{padding:12px 14px;border-radius:12px;margin:0 0 12px;font-size:15px;font-weight:500}
.msg.erro{background:#FCE4E4;color:#7E0000}
.msg.ok{background:var(--verde-claro);color:#105A30}
.msg.info{background:#fff;color:var(--cinza)}
.carregando{position:fixed;inset:0;z-index:30;background:rgba(230,233,237,.75);display:grid;place-items:center}
.carregando div{background:#000;color:#fff;font-weight:600;padding:14px 20px;border-radius:12px}
.oculto{display:none!important}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.foto{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#fff}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto button{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:18px;line-height:1}
.assin{position:relative;background:#fff;border:2px dashed var(--aco-esc);border-radius:12px}
.assin canvas{display:block;width:100%;height:210px;touch-action:none;border-radius:10px}
.assin .link{position:absolute;right:12px;top:8px}
.linha-meus{display:flex;align-items:center;gap:12px;width:100%;background:var(--branco);border:0;border-radius:14px;padding:14px 16px;margin-top:12px;text-align:left}
.linha-meus b{font:700 18px/1.1 var(--tit)}
.linha-meus .q{min-width:34px;height:34px;border-radius:9px;background:var(--preto);color:#fff;display:grid;place-items:center;font:700 16px/1 var(--tit)}
select.campo-txt{appearance:auto}
.login-marca{text-align:center;margin:26px 0 22px}
.login-marca img{width:96px;height:96px;border-radius:50%;background:#fff}
.login-marca h1{margin:12px 0 4px}
.pin{letter-spacing:10px;font-size:24px;text-align:center}
</style>
</head>
<body>
<header class="topo">
  <button type="button" class="ir-inicio" id="irInicio" aria-label="Ir para a tela inicial"><img src="logo-redondo.png?v=2" alt=""><div class="marca" id="marca">Kiton Hub</div></button>
  <a class="ajuda" id="btnAjuda" href="#" target="_blank" rel="noopener" aria-label="Ajuda pelo WhatsApp"><svg class="i" viewBox="0 0 24 24"><path d="M4 20l1.3-4A8 8 0 1 1 8 19z"/><path d="M9.5 9.5c0 3 2 5 5 5l1-1.4-1.6-.8-.8.8c-1-.4-1.8-1.2-2.2-2.2l.8-.8-.8-1.6z" fill="currentColor" stroke="none"/></svg></a>
  <button class="icone-btn oculto" id="btnMenu" type="button" aria-label="Abrir o menu" aria-haspopup="dialog"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
</header>
<div class="faixa"></div>
<main id="app"></main>
<div id="barra"></div>
<div id="folha" class="menu oculto" role="dialog" aria-modal="true" aria-labelledby="folhaTit"><div class="menu-fundo" id="folhaFundo"></div><div class="folha-painel"><div class="menu-cab"><b id="folhaTit"></b><button type="button" class="icone-btn" id="folhaX" aria-label="Fechar"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div id="folhaCorpo" class="folha-corpo"></div></div></div>
<div id="menu" class="menu oculto" role="dialog" aria-modal="true" aria-label="Menu"><div class="menu-fundo" id="menuFundo"></div><nav class="menu-painel" id="menuPainel"></nav></div>
<div id="carregando" class="carregando oculto"><div>Aguarde…</div></div>
<script src="config.js"></script>
<script>
'use strict';
const $app = document.getElementById('app'), $barra = document.getElementById('barra');
const VERSAO = '1.0 beta', ANO = 2026, WHATS_AJUDA = '5544997311914';
const rodape = () => `<p class="rodape"><b>Kiton Hub</b> · versão ${VERSAO} · ${ANO}<br>Desenvolvido por Eng. Joaquim Neto · Kiton Engenharia Integrada</p>`;
let telaAtual = 'Entrar';
function linkAjuda() {
  const quem = est.usuario ? est.usuario.nome : 'não entrei ainda';
  const t = `Olá, Joaquim! Preciso de ajuda no Kiton Hub.\nUsuário: ${quem}\nTela: ${telaAtual}\nVersão: ${VERSAO}\n\nDúvida: `;
  return `https://wa.me/${WHATS_AJUDA}?text=${encodeURIComponent(t)}`;
}
document.getElementById('btnAjuda').addEventListener('click', e => { e.currentTarget.href = linkAjuda(); });
const est = { token: null, usuario: null, dados: null };

// ---------- ícones ----------
const IC = {
  camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  galeria:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="15.5" cy="8.5" r="1.5"/>',
  cliente:'<path d="M3 21h18M5 21V8l7-4 7 4v13M9 21v-5h6v5M9 11h.01M15 11h.01"/>',
  copel:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  compra:'<path d="M3 4h2l2.4 11h11.2L21 7H6.2M10 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM18 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/>',
  banco:'<path d="M3 10h18L12 4zM5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18"/>',
  interno:'<path d="M3 11 12 4l9 7M5 10v10h14V10M10 20v-6h4v6"/>',
  outro:'<path d="M5 12h.01M12 12h.01M19 12h.01"/>',
  van:'<path d="M2 17V7a1 1 0 0 1 1-1h11l5 5h2a1 1 0 0 1 1 1v5h-2M2 17h2M9 17h6M14 6v5h5"/><circle cx="6.5" cy="17" r="2"/><circle cx="17" cy="17" r="2"/>',
  carro:'<path d="M5 17H3v-4l2-5h11l3 5h2v4h-2M8 17h7M5 13h14"/><circle cx="6.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/>',
  pe:'<circle cx="13" cy="4" r="2"/><path d="m9 20 3-6 3 3v4M7 12l3-4 4 1 2 4 3 1"/>',
  ferr:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',
  comb:'<path d="M4 21V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v16M3 21h13M15 9h2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V8l-3-3M7 8h5"/>',
  sem:'<circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/>',
  ok:'<path d="m5 12 5 5 9-10"/>',
  seta:'<path d="m9 6 6 6-6 6"/>',
  voltar:'<path d="m15 6-6 6 6 6"/>',
  saida:'<path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M9 8l4 4-4 4M13 12H3"/>',
  retorno:'<path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M15 8l-4 4 4 4M11 12h10"/>',
  admin:'<path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2 2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2zM9 13l2 2 4-4"/>',
  pino:'<path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  os:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17c1.5-1.5 2.5 1.5 4 0s2.5 1 4 0"/>',
  calib:'<path d="M4 15a8 8 0 1 1 16 0M12 15l4-5M8 19h8"/>',
  recibo:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3"/>',
  tabela:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 10v10"/>',
  pessoas:'<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 4a3 3 0 0 1 0 6M21 20a6 6 0 0 0-4-5.6"/>'
};
const ic = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[n] || IC.outro}</svg>`;
const icMotivo = m => /cliente/i.test(m) ? 'cliente' : /copel|concession/i.test(m) ? 'copel' : /compra|material/i.test(m) ? 'compra' : /banco|órgão|orgao/i.test(m) ? 'banco' : /interno/i.test(m) ? 'interno' : 'outro';
const icVeiculo = v => /kiton|dobl/i.test(v) ? 'van' : /partic/i.test(v) ? 'carro' : 'pe';
const icAbast = a => /não|nao/i.test(a) ? 'sem' : 'comb';

// ---------- utilidades ----------
const guardar = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
const lerLocal = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const carregando = on => document.getElementById('carregando').classList.toggle('oculto', !on);
const msg = (tipo, t) => `<div class="msg ${tipo}" role="status">${esc(t)}</div>`;
const hora = s => String(s || '').slice(-5);
const primeiroNome = n => String(n || '').replace(/^Eng\.\s*/, '').split(' ')[0];
const barra = html => { $barra.innerHTML = html ? `<div class="barra">${html}</div>` : ''; };
const topo = (sub) => { telaAtual = sub || 'Entrar'; sujo = false; document.getElementById('marca').innerHTML = `Kiton Hub${sub ? `<span>${esc(sub)}</span>` : ''}`; };

async function api(acao, dados = {}) {
  if (!window.API_URL || API_URL.indexOf('http') !== 0) throw new Error('O endereço do Apps Script ainda não foi configurado (config.js).');
  let r;
  try {
    r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ acao, token: est.token, ...dados }) });
  } catch (e) { throw new Error('Sem conexão com o servidor. Confira a internet e tente de novo.'); }
  const j = await r.json();
  if (!j.ok) {
    if (j.erro === 'SESSAO_INVALIDA') { sair(); throw new Error('Sua sessão expirou. Entre de novo.'); }
    if (j.erro === 'TROCAR_PIN') { telaTrocarPin(); throw new Error('Crie o seu PIN para continuar.'); }
    throw new Error(j.erro || 'Algo deu errado. Tente de novo.');
  }
  return j;
}
function localizacao() {
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6), acc: p.coords.accuracy }),
      () => res(null), { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  });
}
async function executar(fn) {
  carregando(true);
  try { return await fn(); } catch (e) { erroTela(e.message); } finally { carregando(false); }
}
function erroTela(t) {
  const box = document.getElementById('erro');
  if (box) { box.innerHTML = msg('erro', t); box.scrollIntoView({ behavior: 'smooth', block: 'center' }); } else alert(t);
}
function sair() {
  est.token = null; est.usuario = null; est.dados = null; guardar('kc_token', null); telaLogin();
}
// logo e nome no topo levam à tela inicial; em tela com formulário preenchido, confirma antes
document.getElementById('irInicio').onclick = () => {
  if (!est.token || !est.dados || telaAtual === est.usuario.nome) return;
  carregarInicio();
};
// ---------- proteção contra perda do que foi preenchido ----------
let sujo = false;
const marcarSujo = alvo => { if (!alvo.closest('.nao-suja')) sujo = true; };
$app.addEventListener('input', e => marcarSujo(e.target), true);
$app.addEventListener('change', e => { if (e.target.type === 'file') marcarSujo(e.target); }, true);
$app.addEventListener('click', e => { const t = e.target.closest('.sna button, .pessoa, .segmento button, .opcao, [data-x], [data-rm], [data-rmf]'); if (t) marcarSujo(t); }, true);
$app.addEventListener('pointerdown', e => { if (e.target.tagName === 'CANVAS') sujo = true; }, true);
function podeSair() {
  if (!sujo) return true;
  if (!confirm('Sair desta tela? O que foi preenchido e ainda não foi salvo será perdido.')) return false;
  sujo = false; return true;
}
// botões que tiram da tela atual: confirmam antes se houver algo preenchido
document.addEventListener('click', e => {
  const t = e.target.closest('#ini, #irInicio, #ant:not([data-passo]), #sairB, [data-menu]');
  if (t && !podeSair()) { e.preventDefault(); e.stopImmediatePropagation(); if (t.dataset.menu) fecharMenu(); }
}, true);
window.addEventListener('beforeunload', e => { if (sujo) { e.preventDefault(); e.returnValue = ''; } });

// ---------- menu ----------
function fecharMenu() { document.getElementById('menu').classList.add('oculto'); document.body.style.overflow = ''; }
function abrirMenu() {
  const d = est.dados || {}, admin = est.usuario && est.usuario.perfil === 'Administrador', pd = d.pendencias || {};
  const bol = n => n ? `<span class="bolinha">${n}</span>` : '';
  const item = (k, icone, t, n) => `<button type="button" class="menu-it" data-menu="${k}">${ic(icone)}<span>${t}</span>${bol(n)}</button>`;
  document.getElementById('menuPainel').innerHTML = `<div class="menu-cab"><b>${esc(est.usuario.nome)}</b><button type="button" class="icone-btn" id="menuX" aria-label="Fechar o menu"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    ${item('inicio', 'cliente', 'Início')}${item('saidas', 'saida', 'Saídas e retornos')}${item('checkin', 'pino', 'Check-in em obra')}
    ${item('os', 'os', 'Ordem de serviço')}${item('desp', 'recibo', 'Despesas')}${item('meus', 'tabela', 'Meus itens')}
    ${admin ? `<div class="menu-sec">Administração</div>
      ${item('a-aberto', 'admin', 'Itens para conferir', pd.itens)}${item('a-desp', 'recibo', 'Despesas para conferir', pd.despesas)}
      ${item('a-cli', 'pessoas', 'Novos clientes cadastrados', pd.clientes)}${item('a-os', 'os', 'Painel de OS', pd.os)}
      ${item('a-seg', 'admin', 'Segurança (APR e treinamentos)', (pd.apr || 0) + (pd.treinos || 0))}${item('a-pres', 'pino', 'Presença em obra')}
      ${item('a-fech', 'calib', 'Fechamento do mês')}${item('calib', 'calib', 'Calibração')}${item('cad', 'tabela', 'Cadastros')}${item('a-acessos', 'pessoas', 'Acessos')}` : ''}
    <div class="menu-sec"></div>
    <a class="menu-it" href="${esc(linkAjuda())}" target="_blank" rel="noopener" id="menuAjuda"><span class="q" style="background:#25D366">?</span><span>Ajuda e dúvidas</span></a>
    ${item('sair', 'voltar', 'Sair do app')}`;
  document.getElementById('menu').classList.remove('oculto'); document.body.style.overflow = 'hidden';
  document.getElementById('menuX').onclick = fecharMenu;
  const acoes = { inicio: carregarInicio, saidas: telaSaidas, checkin: telaCheckin, os: telaOS, desp: telaDespesas, meus: telaMeusItens,
    calib: telaCalibracao, cad: telaCadastros, sair: () => { if (confirm('Sair do app neste celular?')) sair(); } };
  document.querySelectorAll('[data-menu]').forEach(b => b.onclick = () => {
    fecharMenu(); const k = b.dataset.menu;
    if (k.startsWith('a-')) telaAdmin(k.slice(2)); else acoes[k]();
  });
  document.getElementById('menuAjuda').onclick = fecharMenu;
}
document.getElementById('btnMenu').onclick = abrirMenu;
// folha suspensa para consultas rápidas sem sair da tela
function abrirFolha(titulo, html) {
  document.getElementById('folhaTit').textContent = titulo; document.getElementById('folhaCorpo').innerHTML = html;
  document.getElementById('folha').classList.remove('oculto'); document.body.style.overflow = 'hidden';
}
function fecharFolha() { document.getElementById('folha').classList.add('oculto'); document.body.style.overflow = ''; }
document.getElementById('folhaX').onclick = fecharFolha; document.getElementById('folhaFundo').onclick = fecharFolha;
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharFolha(); });
/** Consulta da APR completa: por nº da APR ou pelo apontamento. */
async function verAPR(q) {
  await executar(async () => {
    const a = (await api('verAPR', q)).apr;
    const selo = (l, neutro) => { const m = l.match(/^(.*?)\s(Sim|Não|N\/A)$/); return m ? `<div class="apr-lin"><span>${esc(m[1])}</span><span class="selo-txt ${neutro ? '' : m[2] === 'Sim' ? 'verde' : m[2] === 'Não' ? 'vermelho' : ''}">${m[2]}</span></div>` : `<div class="apr-lin"><span>${esc(l)}</span></div>`; };
    const linha = (k, v) => v ? `<div><dt>${k}</dt><dd>${v}</dd></div>` : '';
    abrirFolha(`APR nº ${a.n}`, `
      <p style="margin:6px 0 10px"><span class="selo-txt ${/exceção/.test(a.situacao) ? 'laranja' : /Bloq/.test(a.situacao) ? 'vermelho' : 'verde'}">${esc(a.situacao)}</span><span class="selo-txt">APR ${esc(a.modelo.toLowerCase())}</span></p>
      <dl class="resumo">
        ${linha('Data', esc(a.data))}${linha('OS', esc(a.numero || 'nova'))}${linha('Cliente', esc(a.cliente))}${linha('Serviço', esc(a.tipo))}
        ${linha('Responsável', esc(a.responsavel))}${linha('Equipe', esc(a.equipe.join(', ')))}
        ${linha('PT', esc(a.pt) + (a.ptNumero ? ', nº ' + esc(a.ptNumero) : '') + (a.ptEmissor ? '<br>' + esc(a.ptEmissor) : '') + (a.ptFoto && /^http/.test(a.ptFoto) ? `<br><a class="link" href="${esc(a.ptFoto)}" target="_blank" rel="noopener">Ver foto da PT</a>` : ''))}
        ${linha('Instalação', esc(a.condicao))}${linha('Justificativa', esc(a.justificativa))}
        ${linha('Ciência do cliente', esc(a.ciencia || 'Ainda não registrada'))}
      </dl>
      <h2>Triagem</h2><div class="cartao">${a.triagem.map(l => selo(l, true)).join('')}</div>
      <h2>Checklist</h2><div class="cartao">${a.respostas.map(selo).join('')}</div>
      ${a.riscos.length ? `<h2>Riscos adicionais e medidas</h2><div class="cartao">${a.riscos.map(r => `<div class="apr-lin"><span>${esc(r)}</span></div>`).join('')}</div>` : ''}
      ${a.impedimentos.length ? `<h2>Impedimentos registrados</h2><div class="cartao">${a.impedimentos.map(r => `<div class="apr-lin"><span>${esc(r)}</span></div>`).join('')}</div>` : ''}
      ${a.decisor ? `<h2>Decisão da administração</h2><div class="cartao"><b>${esc(a.decisor)}</b><p class="suave" style="margin:4px 0 0">${esc(a.decisao)}</p></div>` : ''}
      <p class="suave">Registrada por ${esc(a.registradoPor)}${a.lat ? ` · <a class="link" href="https://maps.google.com/?q=${esc(a.lat)},${esc(a.lng)}" target="_blank" rel="noopener">localização</a>` : ''}</p>`);
  });
}
document.getElementById('menuFundo').onclick = fecharMenu;
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharMenu(); });

// ---------- calibração na lista de itens ----------
function linhaCal(i) {
  if (i.tipo !== 'Instrumento' && !i.calData) return '';
  if (!i.calData) return '<div class="cal">Sem calibração registrada</div>';
  const d = i.calDias;
  if (d == null) return `<div class="cal">Calibrado em ${esc(i.calData)}</div>`;
  if (d < 0) return `<div class="cal ruim">Calibrado em ${esc(i.calData)} · vencida há ${-d} dias</div>`;
  return `<div class="cal ${d <= 60 ? 'atencao' : ''}">Calibrado em ${esc(i.calData)} · vence em ${d} dias</div>`;
}

// ---------- horário: agora ou informado ----------
const doisDig = n => String(n).padStart(2, '0');
const agoraLocal = () => { const d = new Date(); return `${d.getFullYear()}-${doisDig(d.getMonth() + 1)}-${doisDig(d.getDate())}T${doisDig(d.getHours())}:${doisDig(d.getMinutes())}`; };
function blocoHorario(id, pergunta) {
  return `<label class="rotulo">${esc(pergunta)}</label>
    <div class="segmento" id="${id}-seg"><button type="button" class="sel" data-v="agora">Agora</button><button type="button" data-v="outro">Outro horário</button></div>
    <div id="${id}-box" class="oculto" style="margin-top:10px"><input class="campo-txt" id="${id}" type="datetime-local" max="${agoraLocal()}">
    <p class="suave" style="margin-top:6px">Use quando esqueceu de registrar na hora. A administração vê que o lançamento foi feito depois.</p></div>`;
}
function ligarHorario(id) {
  document.querySelectorAll(`#${id}-seg button`).forEach(b => b.onclick = () => {
    document.querySelectorAll(`#${id}-seg button`).forEach(x => x.classList.toggle('sel', x === b));
    const outro = b.dataset.v === 'outro';
    document.getElementById(`${id}-box`).classList.toggle('oculto', !outro);
    if (outro && !document.getElementById(id).value) document.getElementById(id).value = agoraLocal();
  });
}
/** "dd/MM/yyyy HH:mm" -> "yyyy-MM-ddTHH:mm" */
const isoDe = t => { const m = String(t || '').match(/(\d{2})\/(\d{2})\/(\d{4}) (\d{2}):(\d{2})/); return m ? `${m[3]}-${m[2]}-${m[1]}T${m[4]}:${m[5]}` : ''; };
/** Lê o horário e confere que não é antes de `minimo` (texto dd/MM/yyyy HH:mm). */
function lerHorarioApos(id, minimo, oque) {
  const v = lerHorario(id), min = isoDe(minimo);
  if (v && min && v < min) throw new Error(`O horário informado é antes ${oque} (${minimo}). Confira a data e a hora.`);
  return v;
}
function lerHorario(id) {
  const outro = document.querySelector(`#${id}-seg .sel`).dataset.v === 'outro';
  if (!outro) return '';
  const v = document.getElementById(id).value;
  if (!v) throw new Error('Informe o horário ou escolha "Agora".');
  if (v > agoraLocal()) throw new Error('O horário informado está no futuro. Use "Agora" ou um horário que já passou.');
  return v;
}

// ---------- entrar ----------
async function telaLogin() {
  document.getElementById('btnMenu').classList.add('oculto'); topo(); barra('');
  $app.innerHTML = `<div class="login-marca"><img src="logo-redondo.png?v=2" alt=""><h1>Entrar no Kiton Hub</h1><p class="suave">Registro de saídas, ferramentas e retorno</p></div>
    <div id="erro"></div>
    <label class="rotulo" for="nome">Quem é você?</label>
    <div id="nomes"><p class="suave">Carregando nomes…</p></div>
    <label class="rotulo" for="pin">PIN</label>
    <input class="campo-txt pin" id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="••••••">
    <p class="suave" style="margin-top:8px">No primeiro acesso o PIN é 123456. Depois o app pede para você criar o seu.</p>
    <p class="suave" style="margin-top:14px">Esqueceu o PIN ou travou? Toque no ícone verde do WhatsApp no alto da tela.</p>${rodape()}`;
  barra(`<div class="dentro"><button class="acao" id="entrar" type="button">Entrar</button></div>`);
  let escolhido = lerLocal('kc_ultimo_nome') || '';
  try {
    const r = await api('nomes');
    const desenha = () => {
      document.getElementById('nomes').innerHTML = r.nomes.map(n => `<button type="button" class="linha ${n === escolhido ? 'sel' : ''}" data-n="${esc(n)}">${ic('pessoas')}${esc(n)}${n === escolhido ? `<span class="fim">${ic('ok')}</span>` : ''}</button>`).join('');
      document.querySelectorAll('#nomes [data-n]').forEach(b => b.onclick = () => { escolhido = b.dataset.n; desenha(); document.getElementById('pin').focus(); });
    };
    desenha();
  } catch (e) { erroTela(e.message); }
  const entrar = () => executar(async () => {
    const pin = document.getElementById('pin').value;
    if (!escolhido) throw new Error('Toque no seu nome.');
    if (pin.length !== 6) throw new Error('O PIN tem 6 números.');
    const r = await api('login', { nome: escolhido, pin });
    est.token = r.token; est.usuario = r.usuario; guardar('kc_token', r.token); guardar('kc_ultimo_nome', escolhido);
    r.usuario.trocaPendente ? telaTrocarPin() : carregarInicio();
  });
  document.getElementById('entrar').onclick = entrar;
  document.getElementById('pin').onkeydown = e => { if (e.key === 'Enter') entrar(); };
}
function telaTrocarPin() {
  topo(); barra('');
  $app.innerHTML = `<h1>Crie o seu PIN</h1><div id="erro"></div>
    <p class="suave">São 6 números que só você sabe. Não vale 123456 nem sequências como 111111 ou 123123.</p>
    <label class="rotulo" for="p1">Novo PIN</label><input class="campo-txt pin" id="p1" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password">
    <label class="rotulo" for="p2">Repita o PIN</label><input class="campo-txt pin" id="p2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password">`;
  barra(`<div class="dentro"><button class="acao" id="ok" type="button">Salvar PIN</button></div>`);
  document.getElementById('ok').onclick = () => executar(async () => {
    const a = document.getElementById('p1').value, b = document.getElementById('p2').value;
    if (a !== b) throw new Error('Os dois PINs estão diferentes.');
    const r = await api('trocarPin', { novo: a });
    est.token = r.token; est.usuario = r.usuario; guardar('kc_token', r.token); carregarInicio();

// Situações na ordem de gravidade; "Válido" aparece como "Em dia"
const CAL_ST = [
  { st: 'Vencido', rot: 'Vencidos', um: 'vencido', cor: 'vermelho' },
  { st: 'Vencendo', rot: 'Vencendo', um: 'vencendo', cor: 'laranja' },
  { st: 'Sem calibração', rot: 'Sem calibração', um: 'sem calibração', cor: 'amarelo' },
  { st: 'Válido', rot: 'Em dia', um: 'em dia', cor: 'verde' }
];
let calDados = null, calFiltro = '', calAbertos = new Set();

function desenharCal() {
  const r = calDados, el = document.getElementById('lista');
  if (!el) return;
  const info = st => CAL_ST.find(c => c.st === st) || CAL_ST[2];
  const cont = (lista, st) => lista.filter(i => i.status === st).length;

  // Resumo geral: cada quadro filtra a lista
  const resumo = `<div class="cal-resumo">` + CAL_ST.map(c => `<button type="button" class="cal-qd ${c.cor}${calFiltro === c.st ? ' ativo' : ''}" data-f="${c.st}" aria-pressed="${calFiltro === c.st}">
      <b>${cont(r.itens, c.st)}</b><span>${c.rot}</span></button>`).join('') + `</div>
    <p class="suave" style="margin:6px 0 12px">${r.itens.length} instrumentos${calFiltro ? ` · mostrando só ${info(calFiltro).rot.toLowerCase()} · <button type="button" class="link" id="limparF">ver todos</button>` : ' · toque num quadro para filtrar'}</p>`;

  // Agrupa pela coluna Grupo (ou pela descrição, se o grupo estiver vazio)
  const itens = calFiltro ? r.itens.filter(i => i.status === calFiltro) : r.itens;
  const mapa = new Map();
  itens.forEach(i => { const g = i.grupo || i.desc; if (!mapa.has(g)) mapa.set(g, []); mapa.get(g).push(i); });
  const pior = l => Math.min(...l.map(i => { const k = CAL_ST.findIndex(c => c.st === i.status); return k < 0 ? 2 : k; }));
  const grupos = [...mapa.entries()].sort((a, b) => pior(a[1]) - pior(b[1]) || a[0].localeCompare(b[0], 'pt'));

  const linha = i => {
    const dias = i.dias != null ? ` (${i.dias < 0 ? 'há ' + (-i.dias) + ' dias' : 'faltam ' + i.dias + ' dias'})` : '';
    return `<button type="button" class="item dentro" data-p="${esc(i.pat)}">
      <span style="flex:1"><span class="nome">${esc(i.grupo || i.desc)}${i.ident ? ' ' + esc(i.ident) : ''}<span class="pat">${esc(i.pat)}</span></span>
      <span class="sub" style="display:block">${esc(i.marca)}</span>
      <span class="cal${i.status === 'Vencido' ? ' ruim' : i.status === 'Vencendo' ? ' atencao' : ''}" style="display:block;margin-top:4px"><span class="selo-txt ${info(i.status).cor}">${i.status === 'Válido' ? 'Em dia' : esc(i.status)}</span>${i.validade ? 'Válida até ' + esc(i.validade) + dias : ''}</span></span>
      <span class="fim">${ic('seta')}</span></button>`;
  };

  const blocos = grupos.map(([g, l]) => {
    const resumoG = CAL_ST.filter(c => cont(l, c.st)).map(c => `<span class="cal-mini ${c.cor}">${cont(l, c.st)} ${c.um}</span>`).join('');
    const p = pior(l), corQtd = p === 0 ? 'vermelho' : p === 1 ? 'laranja' : p === 2 ? 'amarelo' : 'verde';
    const aberto = calAbertos.has(g) || !!calFiltro;
    return `<div class="subgrupo${aberto ? ' aberto' : ''}" data-g="${esc(g)}">
      <button type="button" class="sg-cab" aria-expanded="${aberto}"><span class="sg-qtd cal-${corQtd}">${l.length}</span>
        <span class="sg-txt"><span class="nome">${esc(g)}${(() => { const pf = [...new Set(l.map(i => i.pat.split('-').slice(0, 2).join('-')))]; return pf[0] ? ` <span style="white-space:nowrap">(${esc(pf.join(', '))})</span>` : ''; })()}</span><span class="cal-minis">${resumoG}</span></span>
        <span class="seta-sg">${ic('seta')}</span></button>
      <div class="sg-itens"${aberto ? '' : ' hidden'}>${l.map(linha).join('')}</div></div>`;
  }).join('');

  el.innerHTML = resumo + (blocos || '<p class="suave">Nenhum instrumento nessa situação.</p>');
  el.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { calFiltro = calFiltro === b.dataset.f ? '' : b.dataset.f; desenharCal(); });
  const lf = document.getElementById('limparF'); if (lf) lf.onclick = () => { calFiltro = ''; desenharCal(); };
  el.querySelectorAll('.subgrupo').forEach(s => s.querySelector('.sg-cab').onclick = () => {
    const g = s.dataset.g, abrir = !s.classList.contains('aberto');
    s.classList.toggle('aberto', abrir); s.querySelector('.sg-itens').hidden = !abrir; s.querySelector('.sg-cab').setAttribute('aria-expanded', abrir);
    abrir ? calAbertos.add(g) : calAbertos.delete(g);
  });
  el.querySelectorAll('[data-p]').forEach(b => b.onclick = () => telaCalItem(r.itens.find(x => x.pat === b.dataset.p), r.periodicidades));
}

// ---------- saída em passos ----------
function fluxoSaida() {
  const d = est.dados;
  const f = { motivo: '', destino: '', veiculo: '', equipe: new Set(), itens: new Set(), obs: '' };
  const passos = ['Motivo', 'Destino', 'Veículo e equipe', 'Ferramentas e EPC', 'Conferir'];
  let p = 0;
  const cab = () => `<div class="passos">${passos.map((_, i) => `<i class="${i < p ? 'feito' : i === p ? 'atual' : ''}"></i>`).join('')}</div><div class="passo-nome">Passo ${p + 1} de ${passos.length}</div><div id="erro"></div>`;
  const rodape = (txtAvancar, pode) => barra(`${p === 3 ? `<div class="contador">${f.itens.size ? f.itens.size + (f.itens.size === 1 ? ' item selecionado' : ' itens selecionados') : 'Nenhum item selecionado'}</div>` : ''}
    <div class="dentro"><button class="acao voltar" id="ant" type="button" aria-label="Voltar">${ic('voltar')}</button>
    <button class="acao" id="prox" type="button" ${pode ? '' : 'disabled'}>${txtAvancar}</button></div>`);
  const ligar = () => {
    if (p > 0) document.getElementById('ant').dataset.passo = '1';
    document.getElementById('ant').onclick = () => { if (p === 0) telaSaidas(); else { p--; desenhar(); } };
    const pr = document.getElementById('prox'); if (pr) pr.onclick = () => { if (p < 4) { p++; desenhar(); } else confirmar(); };
  };
  const avancarSozinho = () => setTimeout(() => { p++; desenhar(); }, 150);
  const itensBase = d.itens.filter(i => !i.kit);
  const comp = pat => d.itens.filter(i => i.kit === pat).map(i => i.desc);
  const nomeItem = i => i.grupo && i.ident ? `${i.grupo} ${i.ident}` : i.desc;

  function desenhar() {
    window.scrollTo(0, 0);
    if (p === 0) {
      $app.innerHTML = `${cab()}<h1>Por que você vai sair?</h1><div class="grade">
        ${d.motivos.map(m => `<button type="button" class="opcao ${f.motivo === m ? 'sel' : ''}" data-v="${esc(m)}">${ic(icMotivo(m))}${esc(m)}</button>`).join('')}</div>`;
      $app.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { f.motivo = b.dataset.v; if (/interno/i.test(f.motivo)) f.destino = f.destino || 'Kiton (uso interno)'; desenhar(); avancarSozinho(); });
      rodape('Continuar', !!f.motivo);
    } else if (p === 1) {
      const lista = d.clientes;
      $app.innerHTML = `${cab()}<h1>Para onde?</h1>
        <input class="campo-txt" id="buscaDest" placeholder="Buscar cliente ou digitar outro destino" value="">
        <div id="dests" style="margin-top:10px"></div>`;
      const busca = document.getElementById('buscaDest');
      const pintar = () => {
        const q = busca.value.trim().toLowerCase();
        const vis = lista.filter(c => !q || c.toLowerCase().includes(q));
        const livre = busca.value.trim() && !lista.some(c => c.toLowerCase() === q);
        document.getElementById('dests').innerHTML =
          (livre ? `<button type="button" class="linha" data-v="${esc(busca.value.trim())}">${ic('outro')}<span>Usar “${esc(busca.value.trim())}”<small>Destino que não está na lista</small></span></button>` : '') +
          vis.map(c => `<button type="button" class="linha ${f.destino === c ? 'sel' : ''}" data-v="${esc(c)}">${ic('cliente')}${esc(c)}${f.destino === c ? `<span class="fim">${ic('ok')}</span>` : ''}</button>`).join('');
        document.querySelectorAll('#dests [data-v]').forEach(b => b.onclick = () => { f.destino = b.dataset.v; pintar(); rodape('Continuar', true); ligar(); avancarSozinho(); });
      };
      busca.oninput = pintar; pintar();
      rodape('Continuar', !!f.destino);
    } else if (p === 2) {

      $app.innerHTML = `${cab()}<h1>Como você vai?</h1><div class="grade">

// ---------- utilidades novas ----------
/** Duração legível: "7 min", "1 h 03 min". */
const dur = h => { const m = Math.round((Number(h) || 0) * 60); if (m < 60) return m + ' min'; const r = m % 60; return Math.floor(m / 60) + ' h' + (r ? ' ' + String(r).padStart(2, '0') + ' min' : ''); };
const reais = v => 'R$ ' + Number(v || 0).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const numBR = v => Number(String(v || '').replace(/\./g, '').replace(',', '.')) || 0;
const hojeISO = () => agoraLocal().slice(0, 10);
const distTxt = m => m == null || m === '' ? '' : m < 1000 ? `${Math.round(m)} m` : `${(m / 1000).toFixed(1).replace('.', ',')} km`;
function distanciaM(a, b) {
  const R = 6371000, rad = x => x * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
/** Foto do celular reduzida para no máximo `max` px (JPEG), em dataURL. */
function comprimir(arquivo, max = 1280, q = 0.72) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(arquivo);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Não foi possível ler a foto.')); };
    img.src = url;
  });
}

// ---------- nome de cliente: mesmo padrão do servidor ----------
const chaveCliente = n => String(n || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
  .replace(/[^a-z0-9 ]/g, ' ').replace(/\b(ltda|me|epp|eireli|s ?a|cia|industria e comercio|ind e com)\b/g, ' ').replace(/\s+/g, ' ').trim();
function padronizarCliente(n) {
  const minus = ['de', 'da', 'do', 'das', 'dos', 'e'];
  const s = String(n || '').trim().replace(/\s+/g, ' ').replace(/[\s,.-]+(ltda|me|epp|eireli|s\.?\/?a)\.?$/i, '').trim();
  return s.split(' ').map((w, i) => {
    if (/^[A-Z0-9]{2,4}$/.test(w)) return w;
    const l = w.toLowerCase();
    if (i > 0 && minus.includes(l)) return l;
    return l.charAt(0).toUpperCase() + l.slice(1);
  }).join(' ');
}
const padronizarCidade = c => padronizarCliente(c).replace(/[\s/-]+([a-z]{2})$/i, (_, uf) => '-' + uf.toUpperCase());
function distEdicao(a, b) {
  const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[m][n];
}
/** Clientes cadastrados parecidos com o que foi digitado. */
function parecidos(digitado, lista) {
  const k = chaveCliente(digitado);
  if (k.length < 3) return [];
  return lista.filter(c => {
    const kc = chaveCliente(c.nome);
    return kc === k || kc.includes(k) || k.includes(kc) || distEdicao(k, kc) <= Math.max(1, Math.floor(k.length / 6)) ||
      (() => { const a = k.split(' ')[0], b = kc.split(' ')[0]; return a.length >= 4 && b.length >= 4 && (a === b || (Math.min(a.length, b.length) >= 5 && distEdicao(a, b) <= 1)); })();
  });
}

const hojeTxt = () => { const d = new Date(); return `${doisDig(d.getDate())}/${doisDig(d.getMonth() + 1)}/${d.getFullYear()}`; };
function quandoOS(o) {
  if (!o.inicioPrev) return o.iniciadaEm ? 'Aberta em campo ' + o.iniciadaEm.slice(0, 5) + ' às ' + hora(o.iniciadaEm) : 'Sem data programada';
  const [d, h] = o.inicioPrev.split(' ');
  return (d === hojeTxt() ? 'Hoje' : d.slice(0, 5)) + ' às ' + h;

function seloOS(o) {
  if (o.emExecucao) return '<span class="selo-txt verde">Em execução</span>';

  if (o.status === 'Cancelada') return '<span class="selo-txt vermelho">Cancelada</span>';

  if (o.parada) return '<span class="selo-txt laranja">Parada há mais de 2 dias</span>';

      ${o.solicitacao ? `<div><dt>Solicitação</dt><dd style="font-weight:400;text-align:left">${esc(o.solicitacao)}</dd></div>` : ''}
      ${o.apontamentos ? `<div><dt>Trabalhado</dt><dd>${dur(o.horas)} em ${o.apontamentos} apontamento(s)</dd></div>` : ''}
      ${o.inicioVsPrevisto ? `<div><dt>Início</dt><dd>${esc(o.inicioVsPrevisto)}</dd></div>` : ''}
      ${o.prazo ? `<div><dt>Prazo</dt><dd>${esc(o.prazo)}</dd></div>` : ''}
      ${o.motivoCancel ? `<div><dt>Cancelamento</dt><dd>${esc(o.motivoCancel)}</dd></div>` : ''}
      ${o.revisao ? `<div><dt>Revisão</dt><dd>${String(o.revisao).padStart(2, '0')}${o.reaberta ? ` · reaberta ${o.reaberta}x` : ''}</dd></div>` : ''}
    </dl>
    ${o.historico ? `<p class="suave" style="white-space:pre-line">${esc(o.historico)}</p>` : ''}
    ${o.pdf ? `<a class="acao leve" href="${esc(o.pdf)}" target="_blank" rel="noopener" style="text-decoration:none">${ic('os')} Abrir PDF final</a>` : ''}
    ${r.apontamentos.length ? `<h2>Apontamentos</h2>` + r.apontamentos.map(a => `<div class="cartao"><div class="t">${esc(a.inicio.slice(0, 10))} · ${esc(hora(a.inicio))}${a.fim ? ' às ' + esc(hora(a.fim)) + ' · ' + dur(a.horas) : ' · em execução'}</div>
      <p class="suave" style="margin:2px 0 6px">Equipe: ${esc(a.equipe.join(', '))}${a.executado ? '<br>' + esc(a.executado) : ''}</p>
      ${a.tipo ? `<span class="selo-txt ${a.tipo === 'Final' ? 'verde' : 'amarelo'}">${a.tipo === 'Final' ? 'Finalização' : 'Parcial'}</span>` : ''}
      ${a.ausente ? `<span class="selo-txt laranja">Cliente ausente</span>` : a.assinante ? `<span class="selo-txt">Assinado por ${esc(a.assinante)}</span>` : ''}
      ${a.pdf ? `<a class="link" href="${esc(a.pdf)}" target="_blank" rel="noopener">PDF</a>` : ''}${a.apr ? ` <button type="button" class="link" data-apr="${esc(a.apr)}">Ver APR nº ${esc(a.apr)}</button>` : ''}</div>`).join('') : ''}
    ${admin ? '<div id="adm"></div>' : ''}`;
  document.querySelectorAll('[data-apr]').forEach(b => b.onclick = () => verAPR({ n: b.dataset.apr }));
  const ok = document.getElementById('ok');
  const pode = !admin && ['Programada', 'Em andamento'].includes(o.status) && !o.emExecucao && !sess;
  if (pode) { ok.disabled = false; ok.innerHTML = `${ic('saida')} Iniciar`; ok.onclick = () => telaIniciarOS(o); }
  else if (!admin && sess && sess.numero === o.numero) { ok.disabled = false; ok.innerHTML = `${ic('ok')} Apontar fim`; ok.onclick = () => fluxoApontar(sess); }
  else if (admin) { ok.remove(); adminEditarOS(o, r.apontamentos); }
  else { ok.textContent = o.emExecucao ? 'Em execução' : sess ? 'Aponte a OS em execução antes' : o.status; }
}

// ---------- APR antes de iniciar a OS ----------
/** Situação do treinamento a partir de "dd/MM/yyyy". */
function diasPara(dmy) {
  if (!dmy) return null;
  const [d, m, a] = dmy.split('/').map(Number); const x = new Date(a, m - 1, d), h = new Date(); h.setHours(0, 0, 0, 0);
  return Math.round((x - h) / 864e5);
}
function exigidosAPR(f) {
  const t = f.triagem, r = ['ASO'];
  if (f.modelo === 'Completa') r.push('NR-10');
  if (t.sep) r.push('NR-10 SEP'); if (t.confinado) r.push('NR-33'); if (t.altura) r.push('NR-35');
  return r;
}

/** ctx: {numero, cliente, tipo, equipe}; payload: o que vai para iniciarOS; voltar: função. */
function fluxoAPR(ctx, payload, voltar) {
  const cfg = est.dados.apr, tr = est.dados.treinamentos || {};
  const f = { pt: '', ptNumero: '', ptEmissor: '', ptFoto: '', triagem: {}, modelo: '', forcarCompleta: false, responsavel: ctx.equipe.length === 1 ? ctx.equipe[0] : '',
    condicao: '', justificativa: '', respostas: {}, riscos: {}, declaracao: false };
  let p = 0;
  const reduzidaTipo = cfg.reduzida.includes(ctx.tipo);
  const triagemOk = () => cfg.triagem.every(([k]) => f.triagem[k] === true || f.triagem[k] === false);
  const modelo = () => reduzidaTipo && triagemOk() && !Object.values(f.triagem).some(Boolean) && !f.forcarCompleta ? 'Reduzida' : 'Completa';
  const cab = t => `<div class="passos">${[0, 1, 2].map(i => `<i class="${i < p ? 'feito' : i === p ? 'atual' : ''}"></i>`).join('')}</div>
    <div class="passo-nome">APR · ${esc(ctx.cliente)}${ctx.numero ? ' · OS ' + esc(ctx.numero) : ''} · passo ${p + 1} de 3</div><h1>${t}</h1><div id="erro"></div>`;
  const sn = (nome, val, ops = ['Sim', 'Não', 'N/A'], ck = true) => `<div class="sna${ck ? ' ck' : ''}" data-k="${nome}">${ops.map(o => `<button type="button" data-v="${o}" class="${val === o ? 'sel' : ''}">${o}</button>`).join('')}</div>`;
  const ligarSN = (aoMudar) => document.querySelectorAll('.sna').forEach(g => g.querySelectorAll('button').forEach(b => b.onclick = () => {
    g.querySelectorAll('button').forEach(x => x.classList.toggle('sel', x === b)); aoMudar(g.dataset.k, b.dataset.v);
  }));
  const rodape = (txt, prox) => {
    barra(`<div class="dentro"><button class="acao voltar" id="ant" type="button" aria-label="Voltar">${ic('voltar')}</button><button class="acao" id="prox" type="button">${txt}</button></div>`);
    if (p > 0) document.getElementById('ant').dataset.passo = '1';
    document.getElementById('ant').onclick = () => { if (p === 0) voltar(); else { p--; desenhar(); } };
    document.getElementById('prox').onclick = () => { try { prox(); } catch (e) { erroTela(e.message); } };
  };
  const val = id => (document.getElementById(id) || {}).value || '';

  function passoPT() {
    $app.innerHTML = `${cab('Permissão de trabalho')}<p>O serviço a ser executado possui PT (Permissão de Trabalho) emitida pelo cliente?</p>
      ${sn('pt', f.pt, ['Sim', 'Não', 'Não se aplica'], false)}
      <div id="ptBox" class="${f.pt === 'Sim' ? '' : 'oculto'}" style="margin-top:12px">
        <p class="suave">Informe pelo menos um: número, foto ou quem emitiu. Alguns clientes não entregam a via da PT.</p>
        <label class="rotulo" for="ptN">Número da PT</label><input class="campo-txt" id="ptN" value="${esc(f.ptNumero)}">
        <label class="rotulo" for="ptE">Emitida por (nome e cargo)</label><input class="campo-txt" id="ptE" value="${esc(f.ptEmissor)}" placeholder="Ex.: Carlos Souza, técnico de segurança">
        <label class="rotulo">Foto da PT</label><div class="fotos" id="ptF">${f.ptFoto ? `<div class="foto"><img src="${f.ptFoto}" alt="Foto da PT"><button type="button" id="ptRm" aria-label="Remover foto">×</button></div>` : ''}</div>
        ${botoesFoto('ptArq')}</div>`;
    ligarSN((k, v) => { f.pt = v; document.getElementById('ptBox').classList.toggle('oculto', v !== 'Sim'); });
    const ler = () => { f.ptNumero = val('ptN').trim(); f.ptEmissor = val('ptE').trim(); };
    ligarFoto('ptArq', e => executar(async () => { ler(); if (e.target.files[0]) f.ptFoto = await comprimir(e.target.files[0], 1400, 0.72); passoPT(); }));
    const rm = document.getElementById('ptRm'); if (rm) rm.onclick = () => { ler(); f.ptFoto = ''; passoPT(); };
    rodape('Continuar', () => {
      ler();
      if (!f.pt) throw new Error('Responda se há PT emitida pelo cliente.');
      if (f.pt === 'Sim' && !f.ptNumero && !f.ptFoto && !f.ptEmissor) throw new Error('Informe o número da PT, a foto ou quem a emitiu.');
      p = 1; desenhar();
    });
  }

  function passoTriagem() {
    const m = modelo();
    $app.innerHTML = `${cab('Triagem do serviço')}
      ${cfg.triagem.map(([k, t]) => `<div class="apr-it"><p>${esc(t)}</p>${sn(k, f.triagem[k] === true ? 'Sim' : f.triagem[k] === false ? 'Não' : '', ['Sim', 'Não'], false)}</div>`).join('')}
      <div id="modBox">${triagemOk() ? (m === 'Reduzida'
        ? msg('info', `Tipo "${ctx.tipo}" sem exposição a risco elétrico, altura, espaço confinado ou SEP: APR reduzida.`) + `<button type="button" class="link" id="forcar">Usar a APR completa</button>`
        : msg('info', f.forcarCompleta ? 'APR completa escolhida pela equipe.' : reduzidaTipo ? 'A triagem indicou exposição a risco: APR completa obrigatória.' : `O tipo "${ctx.tipo}" exige APR completa.`)) : ''}</div>`;
    ligarSN((k, v) => { f.triagem[k] = v === 'Sim'; passoTriagem(); });
    const fc = document.getElementById('forcar'); if (fc) fc.onclick = () => { f.forcarCompleta = true; passoTriagem(); };
    rodape('Continuar', () => {
      if (!triagemOk()) throw new Error('Responda todas as perguntas da triagem.');
      f.modelo = modelo();
      if (f.modelo === 'Completa') { if (f.triagem.altura && !('Trabalho em altura' in f.riscos)) f.riscos['Trabalho em altura'] = ''; if (f.triagem.confinado && !('Espaço confinado' in f.riscos)) f.riscos['Espaço confinado'] = ''; }
      p = 2; desenhar();
    });
  }

  function passoChecklist() {
    const comp = f.modelo === 'Completa';
    const exig = exigidosAPR(f);
    const linhasTreino = ctx.equipe.map(n => {
      const t = tr[n] || {};
      const it = exig.map(k => { const d = diasPara(t[k]);
        const cls = d === null || d < 0 ? 'vermelho' : d <= 30 ? 'laranja' : 'verde';
        return `<span class="selo-txt ${cls}">${k}: ${d === null ? 'sem data' : d < 0 ? 'vencido' : 'até ' + esc(t[k])}</span>`; }).join('');
      return `<div style="margin-bottom:6px"><b>${esc(n)}</b><br>${it}</div>`;
    }).join('');
    const itensDe = s => cfg.itens.filter(it => it.s === s && (comp || it.m === 'A') && (!it.cond || it.cond === f.condicao));
    const htmlIt = it => `<div class="apr-it"><p>${esc(it.t)}${it.imp || (it.impCond && it.impCond === f.condicao) ? ' <span class="imp">Impeditivo</span>' : ''}</p>${sn(it.id, f.respostas[it.id])}</div>`;
    const secao = ([s, nome]) => {
      if (!comp && (s === 'C' || s === 'D')) return '';
      let extra = '';
      if (s === 'D') extra = `<div class="pessoas" id="cond">${cfg.condicoes.map(c => `<button type="button" class="pessoa ${f.condicao === c ? 'sel' : ''}" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>
        ${f.condicao === 'Energizada' ? `<label class="rotulo" for="aJust">Justificativa para o trabalho energizado <span class="imp">Impeditivo</span></label><textarea class="campo-txt" id="aJust">${esc(f.justificativa)}</textarea>` : ''}
        <div style="height:10px"></div>`;
      const its = itensDe(s);
      if (s === 'H') return `<h2>${esc(nome)}</h2>${its.map(htmlIt).join('')}<div class="apr-it"><p>PT conferida</p><b>${esc(f.pt)}${f.ptNumero ? ', nº ' + esc(f.ptNumero) : ''}</b></div>`;
      return `<h2>${esc(nome)}</h2>${extra}${its.map(htmlIt).join('')}`;
    };
    $app.innerHTML = `${cab(comp ? 'APR completa' : 'APR reduzida')}
      <p class="suave">Itens marcados como impeditivos bloqueiam o início se a resposta for "Não". A administração é avisada na hora.</p>
      <h2>Equipe</h2><p class="suave">Verificado pelo cadastro.</p>${linhasTreino}
      <label class="rotulo">Responsável pela atividade</label>${chips('aResp', ctx.equipe, f.responsavel)}
      ${cfg.secoes.filter(x => x[0] === 'B').map(secao).join('')}
      ${cfg.secoes.filter(x => ['C', 'D', 'E'].includes(x[0])).map(secao).join('')}
      ${comp ? `<h2>Riscos adicionais</h2><p class="suave">Marque os riscos presentes e informe a medida adotada.</p>
        <div class="pessoas" id="aRis">${cfg.riscos.map(r => `<button type="button" class="pessoa ${r in f.riscos ? 'sel' : ''}" data-v="${esc(r)}">${esc(r)}</button>`).join('')}</div>
        ${Object.keys(f.riscos).map(r => `<label class="rotulo">Medida para ${esc(r.toLowerCase())}</label><input class="campo-txt" data-med="${esc(r)}" value="${esc(f.riscos[r])}">`).join('')}` : ''}
      ${cfg.secoes.filter(x => ['G', 'H'].includes(x[0])).map(secao).join('')}
      <h2>Liberação</h2>
      <label class="linha" style="font-weight:500;align-items:flex-start"><input type="checkbox" id="aDecl" ${f.declaracao ? 'checked' : ''} style="width:24px;height:24px;flex:none;margin-top:2px">
        <span>Os riscos foram avaliados e as medidas de controle foram implementadas.${comp ? '' : ' Não haverá abertura de painéis nem aproximação de partes energizadas.'}</span></label>
      <p class="suave">O registro grava nome, data, hora e localização.</p>`;
    const ler = () => {
      const j = document.getElementById('aJust'); if (j) f.justificativa = j.value.trim();
      document.querySelectorAll('[data-med]').forEach(i => f.riscos[i.dataset.med] = i.value.trim());
      f.declaracao = document.getElementById('aDecl').checked;
    };
    ligarSN((k, v) => { f.respostas[k] = v; });
    ligarChips('aResp', v => f.responsavel = v);
    const cd = document.getElementById('cond');
    if (cd) cd.querySelectorAll('button').forEach(b => b.onclick = () => { ler(); f.condicao = b.dataset.v; const y = window.scrollY; passoChecklist(); window.scrollTo(0, y); });
    const rs = document.getElementById('aRis');
    if (rs) rs.querySelectorAll('button').forEach(b => b.onclick = () => { ler(); const r = b.dataset.v; if (r in f.riscos) delete f.riscos[r]; else f.riscos[r] = ''; const y = window.scrollY; passoChecklist(); window.scrollTo(0, y); });
    rodape(`${ic('saida')} Liberar e iniciar`, () => {
      ler();
      if (!f.responsavel) throw new Error('Escolha o responsável pela atividade.');
      if (comp && !f.condicao) throw new Error('Informe a condição da instalação.');
      const falta = cfg.itens.filter(it => (comp || it.m === 'A') && (!it.cond || it.cond === f.condicao) && !f.respostas[it.id]);
      if (falta.length) throw new Error('Responda todos os itens. Falta: ' + falta[0].t);
      const semMed = Object.keys(f.riscos).find(r => !f.riscos[r]); if (semMed) throw new Error('Informe a medida para: ' + semMed + '.');
      if (!f.declaracao) throw new Error('Confirme a declaração de liberação.');
      enviar();
    });
  }

  function enviar() {
    executar(async () => {
      const apr = { pt: f.pt, ptNumero: f.ptNumero, ptEmissor: f.ptEmissor, ptFoto: f.ptFoto, triagem: f.triagem, modelo: f.modelo, responsavel: f.responsavel,
        condicao: f.condicao, justificativa: f.justificativa, respostas: f.respostas,
        riscos: Object.keys(f.riscos).map(r => ({ risco: r, medida: f.riscos[r] })), declaracao: f.declaracao };
      const geo = payload.geo || await localizacao();
      const r = await api('iniciarOS', Object.assign({}, payload, { geo, apr }));
      if (r.bloqueada) return telaAPRBloqueada(r, () => { p = 2; desenhar(); });
      await recarregarDados();
      telaOS(`OS ${r.numero} iniciada às ${hora(r.quando)}. APR nº ${r.apr} registrada.${r.checkinNovo ? ' Check-in em ' + r.cliente + ' registrado.' : ''}`);
    });
  }

  function desenhar() { window.scrollTo(0, 0); [passoPT, passoTriagem, passoChecklist][p](); }
  topo('APR'); desenhar();
}

function telaAPRBloqueada(r, corrigir) {
  topo('APR bloqueada');
  const link = `https://wa.me/${WHATS_AJUDA}?text=${encodeURIComponent(r.resumo + '\n\nAguardo orientação.')}`;
  $app.innerHTML = `<h1>Início bloqueado</h1><div id="erro"></div>
    ${msg('erro', `A APR nº ${r.apr} tem impedimento. A OS não pode ser iniciada.`)}
    <h2>Impedimentos</h2>${r.impedimentos.map(i => `<div class="apr-it"><p style="margin:0">${esc(i)}</p></div>`).join('')}
    <p class="suave" style="margin-top:12px">A administração recebeu um e-mail com o resumo. Avise também o Eng. Joaquim pelo WhatsApp para a decisão.
      Se a liberação for por exceção, a APR aparece na tela de OS com o botão Iniciar.</p>
    <a class="acao" href="${link}" target="_blank" rel="noopener" style="text-decoration:none;background:#25D366;color:#fff">Avisar o Eng. Joaquim pelo WhatsApp</a>
    <button type="button" class="acao leve" id="corr">Corrigir as respostas</button>`;
  barra(`<div class="dentro"><button class="acao leve" id="sairB" type="button">${ic('voltar')} Voltar para as OS</button></div>`);
  document.getElementById('corr').onclick = corrigir;
  document.getElementById('sairB').onclick = () => telaOS();
}

/** Decisão da administração sobre APR bloqueada e situação dos treinamentos. */
async function adminAPR(box) {
  await executar(async () => {
    const r = await api('aprPainel');
    // NR-10 e ASO valem para todos; SEP, NR-33 e NR-35 só aparecem quando há data cadastrada
    const tre = r.treinos.map(p => ({ nome: p.nome, itens: p.itens.filter(i => i.dias === null ? ['NR-10', 'ASO'].includes(i.k) : i.dias <= 30) })).filter(p => p.itens.length);
    box.innerHTML = `<h2>APR bloqueadas (${r.bloqueadas.length})</h2>
      ${r.bloqueadas.length ? r.bloqueadas.map(a => `<div class="cartao"><div class="t">APR ${esc(a.n)} · ${esc(a.cliente)}</div>
        <p class="suave" style="margin:4px 0 6px">${esc(a.data)} · ${esc(a.quem)}${a.numero ? ' · OS ' + esc(a.numero) : ' · OS nova'} · ${esc(a.tipo)}<br>Equipe: ${esc(a.equipe.join(', '))}</p>
        ${a.impedimentos.map(i => `<span class="selo-txt vermelho" style="margin-bottom:4px">${esc(i)}</span>`).join('')}
        <textarea class="campo-txt" data-just="${esc(a.n)}" placeholder="Justificativa da decisão (obrigatória)" style="margin-top:8px"></textarea>
        <div class="grade" style="margin-top:8px"><button type="button" class="acao leve" data-dec="${esc(a.n)}" data-l="1" style="margin:0">Liberar por exceção</button>
        <button type="button" class="acao leve" data-dec="${esc(a.n)}" data-l="0" style="margin:0">Manter bloqueio</button></div></div>`).join('') : msg('info', 'Nenhuma APR aguardando decisão.')}
      <h2>Treinamentos e ASO</h2><p class="suave">Vencidos, sem data ou vencendo em até 30 dias. Atualize na aba Colaboradores.</p>
      ${tre.length ? tre.map(p => `<div class="cartao"><div class="t">${esc(p.nome)}</div>${p.itens.map(i => `<span class="selo-txt ${i.dias === null || i.dias < 0 ? 'vermelho' : 'laranja'}">${esc(i.k)}: ${i.dias === null ? 'sem data' : i.dias < 0 ? 'vencido em ' + esc(i.venc) : 'vence em ' + i.dias + ' dia(s)'}</span>`).join('')}</div>`).join('') : msg('ok', 'Todos os treinamentos em dia.')}`;
    box.querySelectorAll('[data-dec]').forEach(b => b.onclick = () => executar(async () => {
      const just = box.querySelector(`[data-just="${b.dataset.dec}"]`).value.trim();
      if (!just) throw new Error('Escreva a justificativa da decisão.');
      const lib = b.dataset.l === '1';
      if (lib && !confirm('Liberar por exceção? A responsabilidade pela liberação fica registrada no seu nome.')) return;
      await api('decidirAPR', { n: b.dataset.dec, liberar: lib, justificativa: just });
      await recarregarDados(); telaAdmin('seg');
    }));
  });
}

function blocoEquipe(id, sel) {
  const outros = (est.dados.equipeCampo || est.dados.colaboradores).filter(n => n !== est.usuario.nome);
  return outros.length ? `<label class="rotulo">Quem está com você hoje?</label>${chips(id, outros, '')}<p class="suave" style="margin-top:6px">Opcional. As horas contam para todos os marcados.</p>` : '';
}
function lerEquipe(id) { return [...document.querySelectorAll(`#${id} .pessoa.sel`)].map(b => b.dataset.v); }

function telaIniciarOS(o) {
  const ck = est.dados.checkin;
  $app.innerHTML = `<h1>Iniciar OS ${esc(o.numero)}</h1><p class="suave">${esc(o.cliente)}${o.local ? ' · ' + esc(o.local) : ''}</p><div id="erro"></div>
    ${ck && ck.cliente === o.cliente ? msg('info', `Você já está com check-in em ${ck.cliente}. A OS usa o mesmo check-in.`) : ck ? msg('erro', `Você está com check-in aberto em ${ck.cliente}. Registre a saída de lá antes.`) : msg('info', 'Ao iniciar, o check-in no cliente é feito junto (hora e localização).')}
    ${blocoEquipe('eqIni')}
    ${blocoHorario('hIni', 'Que horas começou?')}`;
  document.querySelectorAll('#eqIni .pessoa').forEach(b => b.onclick = () => b.classList.toggle('sel'));
  barra(`<div class="dentro"><button class="acao voltar" id="ant" type="button" aria-label="Voltar">${ic('voltar')}</button><button class="acao" id="ok" type="button">${ic('saida')} Iniciar</button></div>`);
  ligarHorario('hIni');
  document.getElementById('ant').onclick = () => telaOSDetalhe(o.numero);
  document.getElementById('ok').onclick = () => executar(async () => {
    const horario = lerHorario('hIni');
    const equipe = lerEquipe('eqIni');
    fluxoAPR({ numero: o.numero, cliente: o.cliente, tipo: o.tipo, equipe: [est.usuario.nome, ...equipe] }, { numero: o.numero, equipe, horario }, () => telaIniciarOS(o));
  });
}

async function recarregarDados() { try { const r = await api('inicio'); est.dados = r; est.usuario = r.usuario; } catch (e) { /* segue com os dados atuais */ } }

/** OS que surgiu em campo: cria e já inicia. */
function telaNovaOSCampo(pre) {
  topo('Ordem de serviço');
  const d = est.dados, ck = d.checkin;
  const fixo = ck ? ck.cliente : pre.cliente || '';
  const f = { tipo: '' };
  $app.innerHTML = `<h1>Abrir OS agora</h1><div id="erro"></div>
    ${ck ? msg('info', `Check-in aberto em ${ck.cliente}: a OS fica neste cliente.`) : ''}
    <label class="rotulo" for="nCli">Cliente</label>
    ${fixo ? `<input class="campo-txt" id="nCli" value="${esc(fixo)}" disabled>` : `<select class="campo-txt" id="nCli"><option value="">Escolha…</option>${d.clientesInfo.map(c => `<option>${esc(c.nome)}</option>`).join('')}<option value="__novo">+ Cliente novo</option></select>
    <div id="boxNovo" class="oculto"><input class="campo-txt" id="nNome" placeholder="Nome do cliente (nome fantasia)" style="margin-top:8px"><p class="suave" id="nPrev" style="margin-top:6px"></p><div id="nParec"></div>
      <input class="campo-txt" id="nCid" placeholder="Cidade (ex.: Sarandi-PR)"></div>`}
    <label class="rotulo" for="nLocal">Local / setor / equipamento</label><input class="campo-txt" id="nLocal" placeholder="Ex.: Prensa 2, quadro geral">
    <label class="rotulo">Tipo de serviço</label>${chips('nTipo', d.tiposOS, '')}
    <label class="rotulo" for="nSol">Quem solicitou</label><input class="campo-txt" id="nSol">
    <label class="rotulo" for="nSolic">Solicitação / problema relatado</label><textarea class="campo-txt" id="nSolic"></textarea>
    ${blocoEquipe('eqNova')}
    ${blocoHorario('hNova', 'Que horas começou?')}`;
  ligarChips('nTipo', v => f.tipo = v);
  document.querySelectorAll('#eqNova .pessoa').forEach(b => b.onclick = () => b.classList.toggle('sel'));
  ligarHorario('hNova');
  if (!fixo) {
    const sel = document.getElementById('nCli'), nome = document.getElementById('nNome');
    sel.onchange = () => document.getElementById('boxNovo').classList.toggle('oculto', sel.value !== '__novo');
    nome.oninput = () => {
      const p = padronizarCliente(nome.value), par = parecidos(nome.value, d.clientesInfo);
      document.getElementById('nPrev').innerHTML = p ? `Vai ser salvo como: <b>${esc(p)}</b>` : '';
      document.getElementById('nParec').innerHTML = par.length ? msg('erro', 'Parece com cliente já cadastrado: ' + par.map(c => c.nome).join(', ') + '. Se for o mesmo, escolha na lista.') : '';
    };
  }
  barra(`<div class="dentro"><button class="acao voltar" id="ant" type="button" aria-label="Voltar">${ic('voltar')}</button><button class="acao" id="ok" type="button">${ic('saida')} Abrir e iniciar</button></div>`);
  document.getElementById('ant').onclick = () => telaOS();
  document.getElementById('ok').onclick = () => executar(async () => {
    let cliente = fixo, novo = false, cidade = '';
    if (!fixo) {
      const v = document.getElementById('nCli').value;
      if (!v) throw new Error('Escolha o cliente.');
      if (v === '__novo') {
        cliente = padronizarCliente(document.getElementById('nNome').value); cidade = padronizarCidade(document.getElementById('nCid').value); novo = true;
        if (cliente.length < 3) throw new Error('Digite o nome do cliente novo.');
        if (!cidade) throw new Error('Informe a cidade do cliente novo.');
        const par = parecidos(cliente, d.clientesInfo);
        if (par.some(c => chaveCliente(c.nome) === chaveCliente(cliente))) throw new Error('Esse cliente já está cadastrado. Escolha na lista.');
        if (par.length && !confirm(`Confirma que "${cliente}" é diferente de ${par.map(c => c.nome).join(', ')}?`)) return;
      } else cliente = v;
    }
    if (!f.tipo) throw new Error('Escolha o tipo de serviço.');
    const horario = lerHorario('hNova');
    const equipe = lerEquipe('eqNova');
    fluxoAPR({ cliente, tipo: f.tipo, equipe: [est.usuario.nome, ...equipe] }, { cliente, novo, cidade, tipo: f.tipo, local: document.getElementById('nLocal').value, solicitante: document.getElementById('nSol').value,
      solicitacao: document.getElementById('nSolic').value, equipe, horario }, () => telaNovaOSCampo(pre));
  });
}

  const d = est.dados, f = { tipo: '' };
  const amanha = new Date(Date.now() + 864e5); const base = `${amanha.getFullYear()}-${doisDig(amanha.getMonth() + 1)}-${doisDig(amanha.getDate())}`;

    <label class="rotulo" for="pSol">Quem solicitou</label><input class="campo-txt" id="pSol">

  ligarChips('pTipo', v => f.tipo = v);
  document.querySelectorAll('#pTec .pessoa').forEach(b => { if (b.dataset.v === est.usuario.nome && est.usuario.perfil !== 'Administrador') b.classList.add('sel'); b.onclick = () => b.classList.toggle('sel'); });
  barra(`<div class="dentro"><button class="acao voltar" id="ant" type="button" aria-label="Voltar">${ic('voltar')}</button><button class="acao" id="ok" type="button">Programar</button></div>`);

      solicitante: document.getElementById('pSol').value, solicitacao: document.getElementById('pSolic').value,
      inicioPrev: document.getElementById('pIni').value, fimPrev: document.getElementById('pFim').value, tecnicos });
    telaOS(`OS ${r.numero} programada para ${tecnicos.join(', ')}.${r.agenda ? ' Evento criado na agenda GERAL.' : ' Não foi possível criar o evento na agenda.'}`);
